[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guffin"
version = "0.2.0"
description = "Export Roam Research graph sub-trees to self-contained Markdown, PDF, and EPUB documents"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "imagesize>=1.4",
    "panflute>=2.3",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pypandoc>=1.17",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "regex>=2024.11.6",
    "requests>=2.31.0",
    "rich>=13.0",
    "typer>=0.9.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "black>=23.0",
    "httpx>=0.27",
    "pyright>=1.1",
    "pydocstringformatter>=0.7",
    "ruff>=0.4",
    "hatch>=1.0",
    "pyyaml>=6.0",
    "types-regex>=2024.11.6",
]

[project.scripts]
dump-roam-tree = "guffin.cli.dump_roam_tree:app"
export-roam-tree = "guffin.cli.export_roam_tree:app"
guffin-server = "guffin.cli.serve:app"

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.env-vars]
# Silence the pyright-python "new version available" notice, which fires for any value other than
# "latest" (even when the pinned version already equals the latest).  "latest" also keeps the CLI
# checker aligned with the newer pyright engine bundled in editors like Pylance, reducing drift.
PYRIGHT_PYTHON_FORCE_VERSION = "latest"

[tool.hatch.envs.default.scripts]
check = [
    "pydocstringformatter --write src/",
    "black .",
    "ruff check --fix src/ tests/",
    "pyright",
    "test-heavy",
]
# Test tiers, lightest to heaviest.  All three parallelize with loadscope: it groups each test
# module/class onto one worker, so the module-scoped render fixtures (which spawn Pandoc/Typst)
# are built once per module rather than re-run on every worker.
#   light  — skips the pandoc-subprocess-bound integration tests (marked `pandoc`); the fast inner loop.
#   medium — the full offline suite.
#   heavy  — everything, live tests included (requires the Roam Desktop app running locally);
#            the tier `check` runs.
test-light = "pytest -n auto --dist loadscope -m 'not pandoc'"
test-medium = "pytest -n auto --dist loadscope"
test-heavy = "GUFFIN_LIVE_TESTS=1 pytest -n auto --dist loadscope"

[tool.black]
line-length = 120
target-version = ['py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "ANN",   # flake8-annotations — require explicit parameter/return annotations
    "D",     # pydocstyle
    "E501",  # line too long
    "F401",  # unused imports
    "I",     # isort — enforce sorted, grouped imports
    "UP",    # pyupgrade — enforce modern Python idioms
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydocstringformatter]
style = ["pep257"]
max-line-length = 120
linewrap-full-docstring = true
split-summary-body = true

[tool.pyright]
include = ["src"]
exclude = [".venv", "tests"]
extraPaths = ["tests", "src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# importlib import mode lets the test tree mirror src/guffin/ in package subdirectories:
# test modules are imported by path, so duplicate basenames across packages (e.g.
# common/test_markdown.py and roam/test_markdown.py) coexist without __init__.py files.
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: requires external dependencies (e.g. Roam Desktop app running locally)",
    "pandoc: invokes the pandoc binary (subprocess-bound; deselect with -m 'not pandoc' for a fast inner loop)",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(levelname)s] (%(module)s.%(funcName)s:%(lineno)d) %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
