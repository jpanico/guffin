- uid: 2eBv9J8n5
  id: 12061
  string: "```python\n@validate_call\ndef transcribe(node_tree: NodeTree) -> VertexTree:\n\
    \    \"\"\"Transcribe every node in *node_tree* into a :class:`~guffin.vertex_tree.VertexTree`.\n\
    \n    Traverses *node_tree* in pre-order DFS order.  Most nodes are transcribed\n\
    \    one-to-one via :func:`transcribe_standalone_node`.  Exception: a\n    :attr:`~guffin.roam.node.NodeType.NATIVE_TABLE`\
    \ node and all of its\n    descendants are consumed together into a single\n \
    \   :class:`~guffin.vertex.TableVertex` via :func:`to_table_vertex`; those\n \
    \   descendants are skipped when the DFS iterator later yields them.\n\n    When\
    \ :data:`SHOULD_NORMALIZE_HEADING_LEVELS` is ``True``, computes a\n    *heading_offset*\
    \ equal to ``1 − min effective heading level`` across all\n    nodes in the tree,\
    \ so that the shallowest heading maps to level 1; when no\n    heading nodes are\
    \ present, or when :data:`SHOULD_NORMALIZE_HEADING_LEVELS`\n    is ``False``,\
    \ *heading_offset* is 0.\n\n    Args:\n        node_tree: A validated tree of\
    \ raw Roam nodes.\n\n    Returns:\n        A :class:`~guffin.vertex_tree.VertexTree`\
    \ in document (DFS) order, with\n        :attr:`~guffin.vertex_tree.VertexTree.ref_vertices`\
    \ populated from\n        :attr:`~guffin.roam.node_tree.NodeTree.refs_by_id`.\
    \  Referenced native-table\n        nodes are consumed into a single :class:`~guffin.vertex.TableVertex`\
    \ (with their\n        row/cell descendants) just as in-tree tables are, so a\
    \ cross-page table reference\n        resolves to a complete table.\n\n    Raises:\n\
    \        ValueError: If any anchor node has neither a ``title`` nor a ``string``\
    \ field set.\n    \"\"\"\n    min_level: Final[HeadingLevel | None] = (\n    \
    \    min_effective_heading_level(node_tree.tree_network) if SHOULD_NORMALIZE_HEADING_LEVELS\
    \ else None\n    )\n    heading_offset: Final[int] = (1 - min_level) if min_level\
    \ is not None else 0\n    logger.debug(\"heading_offset=%d\", heading_offset)\n\
    \    consumed: Final[set[Id]] = set()\n    vertices: Final[list[Vertex]] = []\n\
    \    for node in node_tree.dfs():\n        if node.id in consumed:\n         \
    \   continue\n        # A <domain>-meta:: container and its whole subtree are\
    \ folded onto the parent vertex's\n        # attribute_assignments (see _resolve_attribute_assignments);\
    \ consume them so they are not\n        # transcribed as standalone vertices.\
    \  Checked before the attribute-block guard so a meta\n        # block whose value\
    \ happens to parse as an attribute is still consumed (not folded twice).\n   \
    \     if _is_meta_block(node):\n            _consume_subtree(node, node_tree,\
    \ consumed)\n            continue\n        # Attribute blocks are folded into\
    \ their parent vertex's attribute_assignments field\n        # (see _resolve_attribute_assignments),\
    \ not transcribed as standalone vertices.\n        if node_type(node) is NodeType.ATTRIBUTE_BLOCK:\n\
    \            continue\n        if node_type(node) == NodeType.NATIVE_TABLE:\n\
    \            table_vertex, nodes_consumed = to_table_vertex(node, node_tree)\n\
    \            consumed.update(nodes_consumed)\n            vertices.append(table_vertex)\n\
    \        else:\n            vertices.append(transcribe_standalone_node(node, node_tree,\
    \ heading_offset))\n    ref_vertices: Final[list[Vertex]] = []\n    ref_consumed:\
    \ Final[set[Id]] = set()\n    # Native tables are multi-node constructs: consume\
    \ each referenced table together with its\n    # row/cell descendants first, so\
    \ those descendants are not also transcribed as standalone\n    # ref vertices.\
    \  refs_by_id is not in DFS order, so a single-pass consumed-set guard could\n\
    \    # encounter a cell before its table; a dedicated table pass avoids that.\n\
    \    for ref_node in node_tree.refs_by_id.values():\n        if node_type(ref_node)\
    \ != NodeType.NATIVE_TABLE:\n            continue\n        try:\n            ref_table_vertex,\
    \ ref_nodes_consumed = to_table_vertex(ref_node, node_tree)\n        except (NotImplementedError,\
    \ ValueError) as exc:\n            logger.debug(\"skipping ref table node uid=%r:\
    \ %s\", ref_node.uid, exc)\n            continue\n        ref_consumed.update(ref_nodes_consumed)\n\
    \        ref_vertices.append(ref_table_vertex)\n    for ref_node in node_tree.refs_by_id.values():\n\
    \        # Native tables are consumed above; attribute blocks and meta containers\
    \ are not vertices.\n        if (\n            ref_node.id in ref_consumed\n \
    \           or node_type(ref_node) in (NodeType.NATIVE_TABLE, NodeType.ATTRIBUTE_BLOCK)\n\
    \            or _is_meta_block(ref_node)\n        ):\n            continue\n \
    \       try:\n            ref_vertices.append(transcribe_standalone_node(ref_node,\
    \ node_tree))\n        except (NotImplementedError, ValueError) as exc:\n    \
    \        logger.debug(\"skipping ref node uid=%r: %s\", ref_node.uid, exc)\n \
    \   return VertexTree(tree_vertices=vertices, ref_vertices=ref_vertices)```"
