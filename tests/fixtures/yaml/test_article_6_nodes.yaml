- uid: Gn10okg1P
  id: 11873
  string: '**The Sovereign and the Statesman:** For kings, princes, and dukes who
    wish to understand the geopolitical architecture of the world beyond the Levant.
    This text offers a comprehensive operational overview of the Mongol Empire under
    Kublai Khan, detailing his military structure, courier system, administrative
    laws, and the unfathomable scale of his revenues.'
  order: 2
  heading: null
  children: null
