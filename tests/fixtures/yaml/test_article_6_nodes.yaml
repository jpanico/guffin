- uid: v_yb2JFwl
  id: 11872
  string: '**The Enterprising Merchant:** If your trade involves the acquisition of
    pepper, ginger, silk, or precious stones, this book serves as a practical geographical
    manual. You will find detailed accounts of the major trading hubs from Hormuz
    to Cathay, including the preferred currencies (such as the Great Khan’s paper
    money), safe routes, and the relative dangers of bandits and deserts along the
    Silk Road.'
  order: 1
