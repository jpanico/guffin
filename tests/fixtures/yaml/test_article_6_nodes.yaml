  attrs: null
- uid: 4nmDcSocA
  id: 11885
  string: Therefore, do not attempt to swallow this book whole. Read it measure by
    measure. Allow the structure of his journey—from the deserts of Persia to the
    high plains of the Tartars, and onward to the coastlines of the Indies—to build
    a new map within your thoughts.
  order: 5
  heading: null
