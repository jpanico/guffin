- uid: xDLdP7phb
  id: 11882
  string: Before you embark upon the text that follows, it is proper that you are
    given some instruction on how to receive it. We have labored at great length to
    strike these pages from metal type, bringing the words of the Venetian, Messer
    Marco Polo, into our plain German tongue. But the architecture of these Eastern
    realms is exceedingly complex, and to comprehend such vast and foreign territories
    without guidance places a heavy burden upon the mind.
  order: 2
