  string: '**The Deception:** The Old Man of the Mountain maintained a beautiful,
    secret garden modeled after the Islamic concept of Paradise. He would gather young
    men from the region and secretly dose them with a powerful sleeping potion. While
    they were unconscious, his servants would carry the youths into this hidden valley.'
