- uid: y6pLmW1tO
  id: 11984
  string: '[[>]] [[!INFO]] Lesser Hermenia (Cilician Armenia) vs. Turkomania (Anatolia)

    When Marco Polo traveled, he didn''t view these as overlapping regions. He landed
    his ship at the busy port city of **Layas (Ayas)** on the coast of Lesser Hermenia.
    To get to Turkomania, his caravan had to travel north from the coast, climb through
    the treacherous mountain passes of the Taurus Mountains (such as the famous Cilician
    Gates), and emerge onto the high inland plateau of Turkomania to continue their
    journey east toward the Mongol Empire.'
  order: 3
  heading: null
  children: null
