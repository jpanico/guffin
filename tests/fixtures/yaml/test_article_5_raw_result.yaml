- - string: '**What it is** — snapshots source code from GitHub into an ordinary Roam
      fenced code block, with provenance recorded as guffin''s `code-source::` tag
      (blob URL, resolved commit SHA, fetch date) under a `guffin-meta::` child. Built
      on [[SmartBlocks]] plus a custom `roam/js` script. The snippet is real block
      content: searchable, readable offline, and exported by guffin as a first-class
      sourced code block.'
    id: 14494
    uid: 6hmXo4GYL
    parents:
    - id: 14489
    order: 3
    page:
      id: 14489
    refs:
    - id: 14470
- - string: '`x-ratelimit-limit` shows 60 despite a token in [[roam/js/github-code]]
      — reload the graph: `roam/js` edits are inert until reload, and a stale script
      fails silently (API requests simply go unauthenticated). Verify via dev-tools
      Network tab, filter `api.github`, run a refresh (past the 60-second memo window),
      and check the response headers'
    id: 14532
    uid: EnB1Dcl4J
