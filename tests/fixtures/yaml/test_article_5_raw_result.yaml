- - string: 'Exports **verify** every sourced block against GitHub by default (`--verify-code-sources`):
      the ref resolves to its tip, the SHA-pinned content is fetched and compared,
      and any drift or local modification aborts the export with a diagnosis (the
      recorded SHA disambiguates which). `dump-roam-tree` runs the same check advisorily
      (warnings only). `GUFFIN_GITHUB_TOKEN` raises the API rate limit; `--no-verify-code-sources`
      is the offline path'
    id: 14556
