    string: "```python\n\"\"\"Generic accumulator-pipeline validation framework.\n\
      \nProvides a small, side-effect-free validation pipeline:\n\n- :class:`ValidationError`\
      \ — immutable record of a single validation failure.\n- :class:`ValidationResult`\
      \ — immutable collection of all failures from a\n  validation run; empty means\
      \ valid.\n- :data:`Validator` — type alias for a pure validator function.\n\
      - :func:`validate_all` — runs every validator in sequence and accumulates\n\
      \  results into a :class:`ValidationResult`.\n\nAll validators always run regardless\
      \ of prior failures (no short-circuit),\nso the caller receives the complete\
      \ set of errors in one pass.\n\"\"\"\n\nfrom collections.abc import Callable\n\
      from dataclasses import dataclass\nfrom typing import Final\n\n\n@dataclass(frozen=True)\n\
      class ValidationError:\n    \"\"\"Immutable record of a single validation failure.\n\
      \n    Attributes:\n        validator: The validator function that produced this\
      \ error.\n        message: Human-readable description of the validation failure.\n\
      \    \"\"\"\n\n    validator: Callable[..., ValidationError | None]\n    message:\
      \ str\n\n    def __str__(self) -> str:\n        \"\"\"Return a human-readable\
      \ string combining the validator name and message.\"\"\"\n        return f\"\
      {self.validator.__name__}: {self.message}\"\n\n\n@dataclass(frozen=True)\nclass\
      \ ValidationResult:\n    \"\"\"Immutable collection of all validation failures\
      \ from a single run.\n\n    An empty :attr:`errors` tuple means the input was\
      \ valid.\n\n    Attributes:\n        errors: All failures produced by the validator\
      \ pipeline. Empty when valid.\n    \"\"\"\n\n    errors: tuple[ValidationError,\
      \ ...]\n\n    @property\n    def is_valid(self) -> bool:\n        \"\"\"Return\
      \ True when no validation errors were recorded.\"\"\"\n        return len(self.errors)\
      \ == 0\n\n\ntype Validator[T] = Callable[[T], ValidationError | None]\n\"\"\"\
      A pure validator function over an input of type ``T``.\n\nReturns a :class:`ValidationError`\
      \ if the input violates the rule,\nor ``None`` if the input passes.\n\nEach\
      \ validator is responsible only for detecting a single violation; it has\nno\
      \ knowledge of the :class:`ValidationResult` accumulator or other validators\n\
      in the pipeline.\n\"\"\"\n\n\ndef validate_all[T](input: T, validators: list[Validator[T]])\
      \ -> ValidationResult:\n    \"\"\"Run every validator over ``input`` and return\
      \ the accumulated result.\n\n    All validators always run regardless of prior\
      \ failures — no short-circuit.\n\n    Args:\n        input: The value to validate.\n\
      \        validators: Ordered list of validators to apply.\n\n    Returns:\n\
      \        A :class:`ValidationResult` containing all failures, or an empty\n\
      \        result if every validator passed.\n    \"\"\"\n    errors: Final[tuple[ValidationError,\
      \ ...]] = tuple(error for v in validators if (error := v(input)) is not None)\n\
      \    return ValidationResult(errors=errors)\n\n```"
