    string: "```plain text\nC     FIZZBUZZ FOR IBM 704 FORTRAN\n      DO 100 I = 1,\
      \ 100\nC     CHECK FOR 15 (3 * 5)\n      M15 = I - (I/15)*15\n      IF (M15)\
      \ 10, 5, 10\n    5 PRINT 501\n      GO TO 100\nC     CHECK FOR 3\n   10 M3 =\
      \ I - (I/3)*3\n      IF (M3) 20, 15, 20\n   15 PRINT 502\n      GO TO 100\n\
      C     CHECK FOR 5\n   20 M5 = I - (I/5)*5\n      IF (M5) 30, 25, 30\n   25 PRINT\
      \ 503\n      GO TO 100\nC     PRINT THE NUMBER\n   30 PRINT 504, I\n  100 CONTINUE\n\
      C     FORMAT STATEMENTS FOR THE TELETYPE\n  501 FORMAT (8HFIZZBUZZ)\n  502 FORMAT\
      \ (4HFIZZ)\n  503 FORMAT (4HBUZZ)\n  504 FORMAT (I3)\n      STOP```"
