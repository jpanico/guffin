  text: '[Acknowledgments](x-guffin:vertex/qmplSzgnD)'
  heading_level: 2
- vertex_type: guffin/text
  uid: snXG7pnjI
  text: '**Unto the Honorable, Prudent, and Wise Magistrates of the Free Imperial
    City of Nuremberg, and to all curious Christian Readers, grace and peace.**'
- vertex_type: guffin/text
  uid: IACS5F7wi
  text: Herein is completed the noble and wondrous Book of the magnificent Venetian,
    Messer Marco Polo, which declareth the great marvels of the East, of Cathay, and
    of the mighty Khan of the Tartars.
- vertex_type: guffin/text
  uid: WM9mjgmUj
  text: First and foremost, let boundless thanks be rendered unto Almighty God, who
    in these latter days hath bestowed upon mankind the ingenious and subtle art of
    impressing letters by metal without the stroke of a quill, whereby such profitable
    knowledge might be multiplied and spread among the principalities of the earth.
- vertex_type: guffin/text
  uid: OPAjTYc1n
  text: I must humbly acknowledge the labor of the learned Master Heinrich, who took
    it upon himself to turn this history from the Latin tongue into our own plain
    German, that the burghers and merchants of this city might read of the spices
    and silks of the Orient without the barrier of a scholar’s language.
- vertex_type: guffin/text
  uid: vALZLA1Jn
  text: Likewise, my gratitude is bound to the worshipful Herr Sebaldus of the Merchant
    Guild, whose generous purse did furnish the stout rag paper and the fine lamp-black
    ink required to bring this heavy labor to the press. Without his patronage, these
    marvels of India and Persia would have remained locked within the dusty scriptoriums
    of the monasteries.
- vertex_type: guffin/text
  uid: eiAZVhVrz
  text: Finally, I commend the diligent journeymen of my workshop, who stood long
    hours at the press to strike these pages clean and true.
