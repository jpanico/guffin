  text: 'Chapter 24: How the Old Man Used to Train His Assassins.'
  heading_level: 2
- vertex_type: guffin/text
  uid: NKu0uhm6E
  text: '**The Deception:** The Old Man of the Mountain maintained a beautiful, secret
    garden modeled after the Islamic concept of Paradise. He would gather young men
    from the region and secretly dose them with a powerful sleeping potion. While
    they were unconscious, his servants would carry the youths into this hidden valley.'
- vertex_type: guffin/text
  uid: GW0a1qLts
  text: '**The Awakening:** When the young men awoke, they found themselves surrounded
    by magnificent palaces, flowing runnels of milk and wine, and beautiful women
    singing and dancing. Believing the stories they had been told, the young men were
    fully convinced they had awakened in Paradise.'
- vertex_type: guffin/text
  uid: XTruep-9v
  text: '**The Return to Court:** After a few days of indulging in the garden''s pleasures,
    the Old Man would have them drugged again and returned to his standard court.
    When they awoke, they were deeply disappointed to find themselves back in the
    mortal world.'
- vertex_type: guffin/text
  uid: 4PUfPgyEm
  text: '**The Oath of the Assassin:** The Old Man would interrogate the youths before
    his court, and they would eagerly testify that they had seen Paradise. He would
    then promise them that if they assassinated his enemies, his angels would carry
    them straight back to the garden—whether they survived the mission or were killed
    in the attempt.'
- vertex_type: guffin/text
  uid: SGPVZag6N
  text: '**The Resulting Terror:** Believing wholeheartedly in this promise, the assassins
    became fearless, willing to undertake any murder requested by the Old Man. Consequently,
    he became feared by kings and princes throughout the region.'
- vertex_type: guffin/block-quote
  uid: ChlIfjFoZ
  refs:
  - OexZiLR_O
  text: 'Go thou and slay So and So; and when thou returnest my Angels shall bear
    thee into Paradise. And shouldst thou die, natheless even so will I send my Angels
    to carry thee back into Paradise.


    – The Old Man'
