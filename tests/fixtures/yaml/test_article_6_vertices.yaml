    \ their parent vertex's attribute_assignments field\n        # (see _resolve_attribute_assignments),\
    \ not transcribed as standalone vertices.\n        if node_type(node) is NodeType.ATTRIBUTE_BLOCK:\n\
    \            continue\n        if node_type(node) == NodeType.NATIVE_TABLE:\n\
    \            table_vertex, nodes_consumed = to_table_vertex(node, node_tree)\n\
    \            consumed.update(nodes_consumed)\n            vertices.append(table_vertex)\n\
    \        else:\n            vertices.append(transcribe_standalone_node(node, node_tree,\
    \ heading_offset))\n    ref_vertices: Final[list[Vertex]] = []\n    ref_consumed:\
    \ Final[set[Id]] = set()\n    # Native tables are multi-node constructs: consume\
    \ each referenced table together with its\n    # row/cell descendants first, so\
