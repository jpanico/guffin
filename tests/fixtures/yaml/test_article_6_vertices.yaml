- vertex_type: guffin/callout
  uid: y6pLmW1tO
  refs:
  - OexZiLR_O
  - ZgUWBRb7j
  callout_type: info
  title: Lesser Hermenia (Cilician Armenia) vs. Turkomania (Anatolia)
  body: When Marco Polo traveled, he didn't view these as overlapping regions. He
    landed his ship at the busy port city of **Layas (Ayas)** on the coast of Lesser
    Hermenia. To get to Turkomania, his caravan had to travel north from the coast,
    climb through the treacherous mountain passes of the Taurus Mountains (such as
    the famous Cilician Gates), and emerge onto the high inland plateau of Turkomania
    to continue their journey east toward the Mongol Empire.
- vertex_type: guffin/text
  uid: RLZWs0m0N
  text: In Turkomania there are three classes of people. First, there are the Turkomans;
    these are worshippers of Mahommet, a rude people with an uncouth language of their
    own. They dwell among mountains and downs where they find good pasture, for their
    occupation is cattle-keeping. Excellent horses, known as Turquans, are reared
    in their country, and also very valuable mules.
- vertex_type: guffin/text
  uid: NJvMlfH-t
  text: The other two classes are the Armenians and the Greeks, who live mixt with
    the former in the towns and villages, occupying themselves with trade and handicrafts.
    They weave the finest and handsomest carpets in the world, and also a great quantity
    of fine and rich silks of cramoisy and other colours, and plenty of other stuffs.
- vertex_type: guffin/text
  uid: tBcm3XuC9
  text: Their chief cities are Kogni, Kaisariah, and Sevasta, of which last Saint
    Blaise was Bishop. They are all subject to the Great Kaan, who chooses a king
    to rule over them. And now we will leave this province, and speak of the Greater
    Hermenia.
