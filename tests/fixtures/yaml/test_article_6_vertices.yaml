  text: An Epistle to the Reader, from the Printer
  heading_level: 2
- vertex_type: guffin/text
  uid: doB1NIOh9
  text: To the curious and patient reader, greetings.
- vertex_type: guffin/text
  uid: xDLdP7phb
  text: Before you embark upon the text that follows, it is proper that you are given
    some instruction on how to receive it. We have labored at great length to strike
    these pages from metal type, bringing the words of the Venetian, Messer Marco
    Polo, into our plain German tongue. But the architecture of these Eastern realms
    is exceedingly complex, and to comprehend such vast and foreign territories without
    guidance places a heavy burden upon the mind.
- vertex_type: guffin/text
  uid: ROYjinXfM
  text: You will find no familiar landmarks here. The author speaks of kingdoms that
    dwarf our own Holy Roman Empire, of cities crisscrossed by bridges of marble,
    of stones that burn like wood, and of paper that commands the value of gold.
- vertex_type: guffin/text
  uid: 24R3MJ1pP
  text: It is natural for the mind to rebel against such claims, to assume them to
    be the fictions of a romancer. Yet I urge you to approach this topography with
    a clear and open judgment. Marco Polo was not a poet, but a merchant and an administrator
    in the court of the Great Khan. His accounts are laid out not for idle entertainment,
    but as a systematic record of provinces, revenues, and trade routes.
- vertex_type: guffin/text
  uid: 4nmDcSocA
  text: Therefore, do not attempt to swallow this book whole. Read it measure by measure.
    Allow the structure of his journey—from the deserts of Persia to the high plains
    of the Tartars, and onward to the coastlines of the Indies—to build a new map
    within your thoughts.
- vertex_type: guffin/text
  uid: vK5kBX3Dr
  text: We have placed this volume before you so that the boundaries of your world
    might be expanded. Bear the weight of its strangeness, and your understanding
    shall be greatly enriched.
- vertex_type: guffin/text
  uid: mwRFIaxIs
  text: God preserve you in your reading.
- vertex_type: guffin/text
  uid: RoZyY87Nr
  text: '*— F.C., Nuremberg.*'
