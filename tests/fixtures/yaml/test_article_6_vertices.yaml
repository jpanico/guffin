- vertex_type: guffin/text
  uid: AyYZmSD81
  children:
  - 87HpA1p5c
  text: '**A Vast Land:** He describes Greater Hermenia as an enormous country, noting
    that it contains many cities and villages.'
- vertex_type: guffin/text
  uid: 87HpA1p5c
  children:
  - kBmKYNQdA
  - NpUnOxvu-
  - UU52OcnaE
  - wUeKNObXg
  - SaO7N17e6
  - DDP39vx_z
  - vf0E7bSFT
  - CnG6fOf_E
  - lnnmSQv8m
  - ybQyyVAso
  text: 'Here is a list of 10 cities mentioned by Marco Polo in *The Travels*, along
    with their modern-day equivalents and brief context:'
- vertex_type: guffin/text
  uid: kBmKYNQdA
  text: '**Layas (Ayas):** The bustling port city on the Mediterranean coast of Lesser
    Hermenia where the Polos began their overland journey.'
- vertex_type: guffin/text
  uid: NpUnOxvu-
  text: '**Kogni (Konya):** A major inland city on the Anatolian plateau (Turkomania)
    noted for its urban commerce and fine carpets.'
- vertex_type: guffin/text
  uid: UU52OcnaE
  text: '**Kaisariah (Kayseri):** Another prominent trade and craftsmanship city in
    Turkomania.'
- vertex_type: guffin/text
  uid: wUeKNObXg
  text: '**Kinsay (Hangzhou):** Described by Polo as the most splendid and magnificent
    city in the world, located in eastern China.'
- vertex_type: guffin/text
  uid: SaO7N17e6
  text: '**Cambaluc (Beijing):** The grand winter capital of Kublai Khan''s vast Mongol
    Empire.'
- vertex_type: guffin/text
  uid: DDP39vx_z
  text: '**Ciandu / Shangtu (Xanadu):** The famous summer capital of Kublai Khan''s
    empire, noted for its magnificent marble palace.'
- vertex_type: guffin/text
  uid: vf0E7bSFT
  text: '**Ormuz (Hormuz):** A wealthy, strategically important port city on the Persian
    Gulf, crucial for the maritime spice trade.'
- vertex_type: guffin/text
  uid: CnG6fOf_E
  text: '**Baudas (Baghdad):** The ancient city whose siege, capture, and destruction
    by the Mongols Polo recounts in detail.'
- vertex_type: guffin/text
  uid: lnnmSQv8m
  text: '**Samarcan (Samarkand):** A major, heavily populated trade hub along the
    Silk Road in Central Asia.'
- vertex_type: guffin/text
  uid: ybQyyVAso
  text: '**Zaiton (Quanzhou):** A massive Chinese port city, described as one of the
    busiest havens in the world, from which the Polos eventually sailed on their journey
    back to Europe.'
- vertex_type: guffin/text
  uid: icYzlHriz
  text: '**Tartar Encampments:** Polo mentions that during the summer months, the
    region is highly favored by the Tartar (Mongol) armies because of its excellent
    pastures for their livestock. However, they abandon the area in the winter when
    heavy snows make the cold intolerable.'
- vertex_type: guffin/text
  uid: zO6VlUygf
  children:
  - R2Vp_85ad
  - HNGnXbA3_
  - _Aea4kPt1
  - qLnEJdFA5
  - MQo4ub4XQ
  text: '**Mount Ararat and Noah''s Ark:** The most famous detail in this chapter
    is Polo''s reference to a massive, snow-capped mountain shaped like a cube. He
    notes that the mountain is so huge and the snow never melts, making it impossible
    to climb, and explicitly identifies it as the resting place of Noah''s Ark.'
