  text: '[Who is this Book for?](x-guffin:vertex/GuHqKi9Y_)'
  heading_level: 2
- vertex_type: guffin/text
  uid: v_yb2JFwl
  text: '**The Enterprising Merchant:** If your trade involves the acquisition of
    pepper, ginger, silk, or precious stones, this book serves as a practical geographical
    manual. You will find detailed accounts of the major trading hubs from Hormuz
    to Cathay, including the preferred currencies (such as the Great Khan’s paper
    money), safe routes, and the relative dangers of bandits and deserts along the
    Silk Road.'
- vertex_type: guffin/text
  uid: Gn10okg1P
  text: '**The Sovereign and the Statesman:** For kings, princes, and dukes who wish
    to understand the geopolitical architecture of the world beyond the Levant. This
    text offers a comprehensive operational overview of the Mongol Empire under Kublai
    Khan, detailing his military structure, courier system, administrative laws, and
    the unfathomable scale of his revenues.'
- vertex_type: guffin/text
  uid: 09l1XWuD3
  text: '**The Cartographer and Cosmographer:** If you are tasked with updating the
    *mappae mundi* (world maps), this document will radically expand your borders.
    It provides definitive proof of navigable seas to the east of Asia, island nations
    such as Cipangu (Japan), and detailed distances measured in days of travel.'
- vertex_type: guffin/text
  uid: i8m_qcu2R
  text: '**The Theologian and the Friar:** For those tracking the spread of Christendom
    or seeking alliances against the Saracens. You will find intelligence on the locations
    of Nestorian Christians, the religious tolerance of the Tartars, and the various
    idolaters that populate the Indies.'
