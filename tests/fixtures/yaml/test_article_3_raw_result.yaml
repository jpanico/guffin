- - string: When you leave the Bridge, and ride towards the west, finding all the
      way excellent hostelries for travellers, with fine vineyards, fields, and gardens,
      and springs of water, you come after 30 miles to a fine large city called Juju,
      where there are many abbeys of idolaters, and the people live by trade and manufactures.
      They weave cloths of silk and gold, and very fine taffetas.{1} Here too there
      are many hostelries for travellers.{2} After riding a mile beyond this city
      you find two roads, one of which goes west and the other south-east. The westerly
      road is that through Cathay, and the south-easterly one goes towards the province
      of Manzi.{3} Taking the westerly one through Cathay, and travelling by it for
      ten days, you find a constant succession of cities and boroughs, with numerous
      thriving villages, all abounding with trade and manufactures, besides the fine
      fields and vineyards and dwellings of civilized people; but nothing occurs worthy
      of special mention; and so I will only speak of a kingdom called Taianfu. Note
      1.—The word is sendaus (Pauthier), pl. of sendal, and in G. T. sandal. It does
      not seem perfectly known what this silk texture was, but as banners were made
      of it, and linings for richer stuffs, it appears to have been a light material,
      and is generally rendered taffetas. In Richard Cœur de Lion we find “Many a
      pencel of sykelatoun And of sendel of grene and broun,”
