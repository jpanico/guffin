I1QOMCtdJ:
  uid: I1QOMCtdJ
  id: 11133
  string: '[[>]] [[!INFO]] THIS PAGE IS USED FOR TESTING [GUFFIN](https://github.com/jpanico/guffin)
    – DO NOT REMOVE

    Features:

    - an exhaustive matrix of Roam `refs` and `embeds`: inline vs. standalone × internal
    (in-page) vs. external (out-of-page) × target kind

    - `Feature Content` section holds the reference targets:

    -- styled text runs: plain, italics, bold, strikethrough, highlight, inline-code

    -- `color spans`: text color, highlight color, underline, box

    -- a fenced Python `code block`, a standalone `image`, a Roam `callout`, a native
    `{{table}}`

    -- `block quotes` (Markdown and Roam native, single- and multi-line) and Roam
    `pull quotes`

    - `Internal (in-page) links:` section: inline refs to the styled/colored targets,
    plus standalone refs to page / block / parent block / header and to every block-level
    target above, plus a block embed

    - `External (out-of-page) links:` section: the same matrix against Test Article
    1 and Test Article 2, plus a Daily Notes Page ref, a page embed, a callout embed,
    and a standalone ref to a Test Article 1 PDF block tagged `guffin-meta:: pdf-render:
    "inline"` at the reference site (the site''s tag drives the PDF format''s inline
    placement)

    - this INFO `Callout box`, which contains Roam `page references`'
