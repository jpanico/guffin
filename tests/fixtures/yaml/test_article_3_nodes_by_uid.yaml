d9f4W5Rfl:
  uid: d9f4W5Rfl
  id: 12809
  string: '[La Curne, Dict., s.v. Sendaus has: Silk stuff: “Somme de la delivrance
    des sendaus.” (Nouv. Compt. de l’Arg. p. 19).—Godefroy, Dict., gives: “Sendain,
    adj., made with the stuff called cendal: Drap d’or sendains (1392, Test. de Blanche,
    duch d’Orl., Ste-Croix, Arch. Loiret).” He says s.v. Cendal, “cendau, cendral,
    cendel, ... sendail, ... étoffe légère de soie unie qui paraît avoir été analogue
    au taffetas.” “‘On faisait des cendaux forts ou faibles, et on leur donnait toute
    sorte de couleurs. On s’en servait surtout pour vêtements et corsets, pour doublures
    de draps, de fourrures et d’autres étoffes de soie plus précieuses, enfin pour
    tenture d’appartements.’ (Bourquelot, Foir. de Champ. I. 261).” “J’ay de toilles
    de mainte guise, De sidonnes et de cendaulx. Soyes, satins blancs et vermaulx.”
    —Greban, Mist. de la Pass., 26826, G. Paris.—H. C.]'
  order: 4
