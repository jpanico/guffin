LFOf7Pdvc:
  uid: LFOf7Pdvc
  id: 12810
  string: The origin of the word seems also somewhat doubtful. The word Σενδἑς occurs
    in Constant. Porphyrog. de Ceremoniis (Bonn, ed. I. 468), and this looks like
    a transfer of the Arabic Săndăs or Sundus, which is applied by Bakui to the silk
    fabrics of Yezd. (Not. et Ext. II. 469.) Reiske thinks this is the origin of the
    Frank word, and connects its etymology with Sind. Others think that sendal and
    the other forms are modifications of the ancient Sindon, and this is Mr. Marsh’s
    view. (See also Fr.-Michel, Recherches, etc. I. 212; Dict. des Tissus, II. 171
    seqq.)
