  '14494':
    uid: 6hmXo4GYL
    id: 14494
    string: '**What it is** — snapshots source code from GitHub into an ordinary Roam
      fenced code block, with provenance recorded as guffin''s `code-source::` tag
      (blob URL, resolved commit SHA, fetch date) under a `guffin-meta::` child. Built
      on [[SmartBlocks]] plus a custom `roam/js` script. The snippet is real block
      content: searchable, readable offline, and exported by guffin as a first-class
      sourced code block.'
