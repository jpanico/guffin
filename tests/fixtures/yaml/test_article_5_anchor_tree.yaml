  '14519':
    uid: -jw3OTbfC
    id: 14519
    string: 'The `code-source::` tag is a guffin-domain attribute: it never renders
      as a pill in exported output, and the attribution line (SHA-pinned GitHub link
      + fetch date below the listing) renders only with `--code-sources` (default
      off)'
