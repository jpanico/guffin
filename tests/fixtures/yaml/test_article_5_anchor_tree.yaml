  '14512':
    uid: CSQkzdtL5
    id: 14512
    string: 'Unauthenticated API limit: 60 requests/hour per IP. Resolutions are memoized
      for 60 seconds per repo+ref (the insert workflow''s two commands share one call,
      and refreshing many snippets that track one branch costs a single call), and
      full-SHA-pinned snippets never touch the API'
    order: 2
    heading: null
    children: null
    refs: null
    page:
      id: 14489
    children_view_type: null
