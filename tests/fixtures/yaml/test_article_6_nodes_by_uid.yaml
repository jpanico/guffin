Ee4-D9SSG:
  uid: Ee4-D9SSG
  id: 12627
  string: Note 3.—Umbrella. The phrase in Pauthier’s text is “Palieque que on dit
    ombrel.” The Latin text of the Soc. de Géographie has “unum pallium de auro,”
    which I have adopted as probably correct, looking to Burma, where the old etiquettes
    as to umbrellas are in full force. These etiquettes were probably in both countries
    of old Hindu origin. Pallium, according to Muratori, was applied in the Middle
    Ages to a kind of square umbrella, by which is probably meant rather a canopy
    on four staves, which was sometimes assigned by authority as an honourable privilege.
    But the genuine umbrella would seem to have been used also, for Polo’s contemporary,
    Martino da Canale, says that, when the Doge goes forth of his palace, “si vait
    apres lui un damoiseau qui porte une umbrele de dras à or sur son chief,” which
    umbrella had been given by “Monseigneur l’Apostoille.” There is a picture by Girolamo
    Gambarota, in the Sala del Gran Consiglio, at Venice, which represents the investiture
    of the Doge with the umbrella by Pope Alexander III., and Frederick Barbarossa
    (concerning which see Sanuto Junior, in Muratori, XXII. 512). The word Parasol
    also occurs in the Petrarchian vocabulary, (14th century) as the equivalent of
    saioual (Pers. sáyában or sáiwán, an umbrella). Carpini notices that umbrellas
    (solinum vel tentoriolum in hastâ) were carried over the Tartar nobles and their
    wives, even on horseback; and a splendid one, covered with jewels, was one of
    the presents made to Kuyuk Kaan on his enthronement. With respect to the honorary
    character attaching to umbrellas in China, I may notice that recently an English
    resident of Ningpo, on his departure for Europe, was presented by the Chinese
    citizens, as a token of honour, with a pair of Wan min sàn, umbrellas of enormous
    size. The umbrella must have gone through some curious vicissitudes; for at one
    time we find it familiar, at a later date apparently unknown, and then reintroduced
    as some strange novelty. Arrian speaks of the σκιάδια, or umbrellas, as used by
    all Indians of any consideration; but the thing of which he spoke was familiar
    to the use of Greek and Roman ladies, and many examples of it, borne by slaves
    behind their mistresses, are found on ancient vase-paintings. Athenaeus quotes
    from Anacreon the description of a “beggar on horseback” who “like a woman bears
    An ivory parasol over his delicate head.”
