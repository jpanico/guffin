  string: Kaan has such a quantity of this kind of plate, and of gold and silver in
    other shapes, as no one ever before saw or heard tell of, or could believe.{3}
    [There are certain Barons specially deputed to see that foreigners, who do not
    know the customs of the Court, are provided with places suited to their rank;
    and these Barons are continually moving to and fro in the hall, looking to the
    wants of the guests at table, and causing the servants to supply them promptly
    with wine, milk, meat, or whatever they lack. At every door of the hall (or, indeed,
    wherever the Emperor may be) there stand a couple of big men like giants, one
    on each side, armed with staves. Their business is to see that no one steps upon
    the threshold in entering, and if this does happen, they strip the offender of
    his clothes, and he must pay a forfeit to have them back again; or in lieu of
    taking his clothes, they give him a certain number of blows. If they are foreigners
    ignorant of the order, then there are Barons appointed to introduce them, and
    explain it to them. They think, in fact, that it brings bad luck if any one touches
    the threshold. Howbeit, they are not expected to stick at this in going forth
    again, for at that time some are like to be the worse for liquor, and incapable
    of looking to their steps.{4}]
