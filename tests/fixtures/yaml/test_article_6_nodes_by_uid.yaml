  string: '{2} were disposed of); and the whole plain seemed to be covered with his
    forces. So it was thus that the Great Kaan’s army was arrayed for battle. When
    Nayan and his people saw what had happened, they were sorely confounded, and rushed
    in haste to arms. Nevertheless they made them ready in good style and formed their
    troops in an orderly manner. And when all were in battle array on both sides as
    I have told you, and nothing remained but to fall to blows, then might you have
    heard a sound arise of many instruments of various music, and of the voices of
    the whole of the two hosts loudly singing. For this is a custom of the Tartars,
    that before they join battle they all unite in singing and playing on a certain
    two-stringed instrument of theirs, a thing right pleasant to hear. And so they
    continue in their array of battle, singing and playing in this pleasing manner,
    until the great Naccara of the Prince is heard to sound. As soon as that begins
    to sound the fight also begins on both sides; and in no case before the Prince’s
    Naccara sounds dare any commence fighting.{3}'
