8jdnheysF:
  uid: 8jdnheysF
  id: 12250
  string: Note 2.—The horses exported to India, of which we shall hear more hereafter,
    were probably the same class of “Gulf Arabs” that are now carried thither. But
    the Turkman horses of Persia are also very valuable, especially for endurance.
    Kinneir speaks of one accomplishing 900 miles in eleven days, and Ferrier states
    a still more extraordinary feat from his own knowledge. In that case one of those
    horses went from Tehran to Tabriz, returned, and went again to Tabriz, within
    twelve days, including two days’ rest. The total distance is about 1100 miles.
