JUsffnSbz:
  uid: JUsffnSbz
  id: 12085
  string: Note 2.—Bolghar, our author’s Bolgara, was the capital of the region sometimes
    called Great Bulgaria, by Abulfeda Inner Bulgaria, and stood a few miles from
    the left bank of the Volga, in latitude about 54° 54′, and 90 miles below Kazan.
    The old Arab writers regarded it as nearly the limit of the habitable world, and
    told wonders of the cold, the brief summer nights, and the fossil ivory that was
    found in its vicinity. This was exported, and with peltry, wax, honey, hazel-nuts,
    and Russia leather, formed the staple articles of trade. The last item derived
    from Bolghar the name which it still bears all over Asia. (See Bk. II. ch. xvi.,
    and Note.) Bolghar seems to have been the northern limit of Arab travel, and was
    visited by the curious (by Ibn Batuta among others) in order to witness the phenomena
    of the short summer night, as tourists now visit Hammerfest to witness its entire
    absence.
