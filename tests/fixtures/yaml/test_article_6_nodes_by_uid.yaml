XRU-URUwP:
  uid: XRU-URUwP
  id: 12525
  string: So he marched with his army, and after advancing for 20 days they arrived
    at a great plain where Nayan lay with all his host, amounting to some 400,000
    horse. Now the Great Kaan’s forces arrived so fast and so suddenly that the others
    knew nothing of the matter. For the Kaan had caused such strict watch to be made
    in every direction for scouts that every one that appeared was instantly captured.
    Thus Nayan had no warning of his coming and was completely taken by surprise;
    insomuch that when the Great Kaan’s army came up, he was asleep in the arms of
    a wife of his of whom he was extravagantly fond. So thus you see why it was that
    the Emperor equipped his force with such speed and secrecy.
