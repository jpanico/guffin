TxzUuIjvZ:
  uid: TxzUuIjvZ
  id: 12399
  string: Note 4.—The Kataghan breed of horses from Badakhshan and Kunduz has still
    a high reputation. They do not often reach India, as the breed is a favourite
    one among the Afghan chiefs, and the horses are likely to be appropriated in transit.
    (Lumsden, Mission to Kandahar, p. 20.) [The Kirghiz between the Yangi Hissar River
    and Sirikol are the only people using the horse generally in the plough, oxen
    being employed in the plains, and yaks in Sirikol. (LieutenantColonel Gordon,
    p. 222, Forsyth’s Mission.)—H. C.] What Polo heard of the Bucephalid strain was
    perhaps but another form of a story told by the Chinese, many centuries earlier,
    when speaking of this same region. A certain cave was frequented by a wonderful
    stallion of supernatural origin. Hither the people yearly brought their mares,
    and a famous breed was derived from the foals. (Rém. N. Mél. As. I. 245.)
