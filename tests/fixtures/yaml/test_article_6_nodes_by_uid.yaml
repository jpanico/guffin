-2kc3puea:
  uid: -2kc3puea
  id: 12478
  string: There are numbers of wild beasts of all sorts in this region. And when you
    leave this little country, and ride three days north-east, always among mountains,
    you get to such a height that ’tis said to be the highest place in the world!
    And when you have got to this height you find [a great lake between two mountains,
    and out of it] a fine river running through a plain clothed with the finest pasture
    in the world; insomuch that a lean beast there will fatten to your heart’s content
    in ten days. There are great numbers of all kinds of wild beasts; among others,
    wild sheep of great size, whose horns are good six palms in length. From these
    horns the shepherds make great bowls to eat from, and they use the horns also
    to enclose folds for their cattle at night. [Messer Marco was told also that the
    wolves were numerous, and killed many of those wild sheep. Hence quantities of
    their horns and bones were found, and these were made into great heaps by the
    way-side, in order to guide travellers when snow was on the ground.] The plain
    is called Pamier, and you ride across it for twelve days together, finding nothing
    but a desert without habitations or any green thing, so that travellers are obliged
    to carry with them whatever they have need of. The region is so lofty and cold
    that you do not even see any birds flying. And I must notice also that because
    of this great cold, fire does not burn so brightly, nor give out so much heat
    as usual, nor does it cook food so effectually.{2} Now, if we go on with our journey
    towards the east-north-east, we travel a good forty days, continually passing
    over mountains and hills, or through valleys, and crossing many rivers and tracts
    of wilderness. And in all this way you find neither habitation of man, nor any
    green thing, but must carry with you whatever you require. The country is called
    Bolor. The people dwell high up in the mountains, and are savage Idolaters, living
    only by the chase, and clothing themselves in the skins of beasts. They are in
    truth an evil race.{3}
