3tYM4fGbR:
  uid: 3tYM4fGbR
  id: 12341
  string: '113 of Kermán to this descent the cold in winter is very great,” that is,
    from Kermán to near Jíruft. The winter at Kermán itself is fairly severe; from
    the town the ground gradually but steadily rises, the absolute altitudes of the
    passes crossing the mountains to the south varying from 8000 to 11,000 feet. These
    passes are up to the month of March always very cold; in one it froze slightly
    in the beginning of June. The Sárdú Pass lies lower than the others. The name
    is Sárdú, not Sardú from sard, “cold.” Major Sykes (Persia, ch. xxiii.) comes
    to the same conclusion: “In 1895, and again in 1900, I made a tour partly with
    the object of solving this problem, and of giving a geographical existence to
    Sárdu, which appropriately means the ‘Cold Country.’ I found that there was a
    route which exactly fitted Marco’s conditions, as at Sarbizan the Sárdu plateau
    terminates in a high pass of 9200 feet, from which there is a most abrupt descent
    to the plain of Jíruft, Komádin being about 35 miles, or two days’ journey from
    the top of the pass. Starting from Kermán, the stages would be as follows:—I.
    Jupár (small town); 2. Bahrámjird (large village); 3. Gudar (village); 4. Ráin
    (small town).... Thence to the Sarbizan pass is a distance of 45 miles, or three
    desert stages, thus constituting a total of 110 miles for the seven days. This
    is the camel route to the present day, and absolutely fits in with the description
    given.... The question to be decided by this section of the journey may then,
    I think, be considered to be finally and most satisfactorily settled, the route
    proving to lie between the two selected by Colonel Yule, as being the most suitable,
    although he wisely left the question open.”—H. C.] In the abstract of Major Smith’s
    Itinerary as we have given it, we do not find Polo’s city of Camadi. Major Smith
    writes to me, however, that this is probably to be sought in “the ruined city,
    the traces of which I observed in the plain of Jíruft near Kerimabad. The name
    of the city is now apparently lost.” It is, however, known to the natives as the
    City of Dakiánús, as Mr. Abbott, who visited the site, informs us. This is a name
    analogous only to the Arthur’s ovens or Merlin’s caves of our own country, for
    all over Mahomedan Asia there are old sites to which legend attaches the name
    of Dakianus or the Emperor Decius, the persecuting tyrant of the Seven Sleepers.
    “The spot,” says Abbott, “is an elevated part of the plain on the right bank of
    the Hali Rúd, and is thickly strewn with kiln-baked bricks, and shreds of pottery
    and glass.... After heavy rain the peasantry search amongst the ruins for ornaments
    of stone, and rings and coins of gold, silver, and copper. The popular tradition
    concerning the city is that it was destroyed by a flood long before the birth
    of Mahomed.” [General Houtum-Schindler, in a paper in the Jour. R. As. Soc., Jan.
    1898, p. 43, gives an abstract of Dr. Houtsma’s (of Utrecht) memoir, Zur Geschichte
    der Saljuqen von Kerman, and comes to the conclusion that “from these statements
    we can safely identify Marco Polo’s Camadi with the suburb Qumādīn, or, as I would
    read it, Qamādīn, of the city of Jíruft.”—(Cf. Major Sykes’ Persia, chap. xxiii.:
    “Camadi was sacked for the first time, after the death of Toghrul Shah of Kermán,
    when his four sons reduced the province to a condition of anarchy.”) Major P.
    Molesworth Sykes, Recent Journeys in Persia (Geog. Journal, X. 1897, p. 589),
    says: “Upon arrival in Rudbar, we turned northwards and left the Farman Farma,
    in order to explore the site of Marco Polo’s ‘Camadi.’... We came upon a huge
    area littered with yellow bricks eight inches square, while not even a broken
    wall is left to mark the site of what was formerly a great city, under the name
    of the Sher-i-Jiruft.”—H. C.] The actual distance from Bamm to the City of Dakianus
    is, by Abbott’s Journal, about 66 miles. The name of Reobarles, which Marco applies
    to the plain intermediate between the two descents, has given rise to many conjectures.
    Marsden pointed to Rúdbár, a name frequently applied in Persia to a district on
    a river, or intersected by streams—a suggestion all the happier that he was not
    aware of the fact that there is a district of Rudbar exactly in the required position.
    The last syllable still requires explanation. I ventured formerly to suggest that
    it was the Arabic Laṣṣ, or, as Marco would certainly have written it, Les, a robber.
    Reobarles would then be Rudbar-i-Laṣṣ, “Robber’s River District.” The appropriateness
    of the name Marco has amply illustrated; and it appeared to me to survive in that
    of one of the rivers of the plain, which is mentioned by both Abbott and Smith
    under the title of Rúdkhánah-i-Duzdi, or Robbery River, a name also applied to
    a village and old fort on the banks of the stream. This etymology was, however,
    condemned as an inadmissible combination of Persian and Arabic by two very high
    authorities both as travellers and scholars—Sir H. Rawlinson and Mr. Khanikoff.
    The Les, therefore, has still to be explained.[1]'
