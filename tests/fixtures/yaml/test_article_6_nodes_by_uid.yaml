FJ42n05XS:
  uid: FJ42n05XS
  id: 12652
  string: You must know that beside the Palace (that we have been describing), i.e.
    the Great Palace, the Emperor has caused another to be built just like his own
    in every respect, and this he hath done for his son when he shall reign and be
    Emperor after him.{14} Hence it is made just in the same fashion and of the same
    size, so that everything can be carried on in the same manner after his own death.
    [It stands on the other side of the lake from the Great Kaan’s Palace, and there
    is a bridge crossing the water from one to the other.]{15} The Prince in question
    holds now a Seal of Empire, but not with such complete authority as the Great
    Kaan, who remains supreme as long as he lives. Now I am going to tell you of the
    chief city of Cathay, in which these Palaces stand; and why it was built, and
    how. Note 1.—[According to the Ch’ue keng lu, translated by Bretschneider, 25,
    “the wall surrounding the palace ... is constructed of bricks, and is 35 ch’i
    in height. The construction was begun in a.d. 1271, on the 17th of the 8th month,
    between three and five o’clock in the afternoon, and finished next year on the
    15th of the 3rd month.”—H. C.] Note 2.—Tarcasci (G. T.). This word is worthy of
    note as the proper form of what has become in modern French carquois. The former
    is a transcript of the Persian Tărkăsh; the latter appears to be merely a corruption
    of it, arising perhaps clerically from the constant confusion of c and t in MSS.
    (See Defrémery, quoted by Pauthier, in loco.) [Old French tarquais (13th century),
    Hatzfeldt and Darmesteter’s Dict. gives; “Coivres orent ceinz et tarchais.” (Wace,
    Rou, III., 7698; 12th century).]
