qqnt1TH5A:
  uid: qqnt1TH5A
  id: 12203
  string: 'Wassáf’s narrative is interesting:—“Two days after his capture the Khalif
    was at his morning prayer, and began with the verse (Koran, III. 25), ‘Say God
    is the Possessor of Dominion! It shall be given to whom He will; it shall be taken
    from whom He will: whom He will He raiseth to honour; whom He will He casteth
    to the ground.’ Having finished the regular office he continued still in prayer
    with tears and importunity. Bystanders reported to the Ilkhan the deep humiliation
    of the Khalif’s prayers, and the text which seemed to have so striking an application
    to those two princes. Regarding what followed there are different stories. Some
    say that the Ilkhan ordered food to be withheld from the Khalif, and that when
    he asked for food the former bade a dish of gold be placed before him, etc. Eventually,
    after taking counsel with his chiefs, the Padishah ordered the execution of the
    Khalif. It was represented that the blood-drinking sword ought not to be stained
    with the gore of Mosta’sim. He was therefore rolled in a carpet, just as carpets
    are usually rolled up, insomuch that his limbs were crushed.” The avarice of the
    Khalif was proverbial. When the Mongol army was investing Miafaraḳain, the chief,
    Malik Kamál, told his people that everything he had should be at the service of
    those in need: “Thank God, I am not like Mosta’sim, a worshipper of silver and
    gold!” (Hayton in Ram. ch. xxvi.; Per. Quat. 121; Pachym. Mic. Palaeol. II. 24;
    Joinville, p. 182; Sanuto, p. 238; J. As. sér. V. tom. xi. 490, and xvi. 291;
    D’Ohsson, III. 243; Hammer’s Wassáf, 75– 76; Quat. Rashid. 305.)'
