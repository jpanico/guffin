pZmzyz_3x:
  uid: pZmzyz_3x
  id: 12450
  string: In the account which the Mahawanso gives of the consecration of the great
    Tope at Ruanwelli, by Dutthagamini, King of Ceylon (b.c. 157), 280,000 priests
    (!) come from Káshmir, a far greater number than is assigned to any other country
    except one. (J. A. S. B. VII. 165.) It is thus very intelligible how Marco learned
    from the Mongols and the Lamas with whom he came in contact to regard Káshmir
    as “the very original source from which their Religion had spread abroad.” The
    feeling with which they looked to Káshmir must have been nearly the same as that
    with which the Buddhists of Burma look to Ceylon. But this feeling towards Káshmir
    does not now, I am informed, exist in Tibet. The reverence for the holy places
    has reverted to Bahár and the neighbouring “cradle-lands” of Buddhism.
