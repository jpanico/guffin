  id: 12324
  string: Their ships are wretched affairs, and many of them get lost; for they have
    no iron fastenings, and are only stitched together with twine made from the husk
    of the Indian nut. They beat this husk until it becomes like horse-hair, and from
    that they spin twine, and with this stitch the planks of the ships together. It
    keeps well, and is not corroded by the seawater, but it will not stand well in
    a storm. The ships are not pitched, but are rubbed with fish-oil. They have one
    mast, one sail, and one rudder, and have no deck, but only a cover spread over
    the cargo when loaded. This cover consists of hides, and on the top of these hides
    they put the horses which they take to India for sale. They have no iron to make
    nails of, and for this reason they use only wooden trenails in their shipbuilding,
    and then stitch the planks with twine as I have told you. Hence ’tis a perilous
    business to go a voyage in one of those ships, and many of them are lost, for
    in that Sea of India the storms are often terrible.{3} The people are black, and
    are worshippers of Mahommet. The residents avoid living in the cities, for the
    heat in summer is so great that it would kill them. Hence they go out (to sleep)
    at their gardens in the country, where there are streams and plenty of water.
    For all that they would not escape but for one thing that I will mention. The
    fact is, you see, that in summer a wind often blows across the sands which encompass
    the plain, so intolerably hot that it would kill everybody, were it not that when
    they perceive that wind coming they plunge into water up to the neck, and so abide
    until the wind have ceased.{4} [And to prove the great heat of this wind, Messer
    Mark related a case that befell when he was there. The Lord of Hormos, not having
    paid his tribute to the King of Kerman the latter resolved to claim it at the
    time when the people of Hormos were residing away from the city. So he caused
    a force of 1600 horse and 5000 foot to be got ready, and sent them by the route
    of Reobarles to take the others by surprise. Now, it happened one day that through
    the fault of their guide they were not able to reach the place appointed for their
    night’s halt, and were obliged to bivouac in a wilderness not far from Hormos.
    In the morning as they were starting on their march they were caught by that wind,
    and every man of them was suffocated, so that not one survived to carry the tidings
    to their Lord. When the people of Hormos heard of this they went forth to bury
    the bodies lest they should breed a pestilence.
