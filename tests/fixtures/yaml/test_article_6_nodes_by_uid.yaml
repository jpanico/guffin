rZJIBxWwD:
  uid: rZJIBxWwD
  id: 12248
  string: VII. Shawánkára or Shabánkára. The G. T. has Soucara, but the Crusca gives
    the true reading Soncara. It is the country of the Shawánkárs, a people coupled
    with the Shúls and Lúrs in mediæval Persian history, and like them of Kurd affinities.
    Their princes, of a family Faslúyah, are spoken of as influential before the Mahomedan
    conquest, but the name of the people comes prominently forward only during the
    Mongol era of Persian history. [Shabánkára was taken in 1056 from the Buyid Dynasty,
    who ruled from the 10th century over a great part of Persia, by Fazl ibn Hassan
    (Fazluïeh-Hasunïeh). Under the last sovereign, Ardeshir, Shabánkára was taken
    in 1355 by the Modhafferians, who reigned in ’Irák, Fars, and Kermán, one of the
    Dynasties established at the expense of the Mongol Ilkhans after the death of
    Abu Saïd (1335), and were themselves subjugated by Timur in 1392.—H. C.] Their
    country lay to the south of the great salt lake east of Shíráz, and included Niriz
    and Darábjird, Fassa, Forg, and Tárum. Their capital was I′g or I′j, called also
    Irej, about 20 miles north-west of Daráb, with a great mountain fortress; it was
    taken by Hulaku in 1259. The son of the prince was continued in nominal authority,
    with Mongol administrators. In consequence of a rebellion in 1311 the Dynasty
    seems to have been extinguished. A descendant attempted to revive their authority
    about the middle of the same century. The latest historical mention of the name
    that I have found is in Abdurrazzák’s History of Shah Rukh, under the year H.
    807 (1404). (See Jour. As. 3d. s. vol. ii. 355.) But a note by Colonel Pelly informs
    me that the name Shabánkára is still applied (1) to the district round the towns
    of
