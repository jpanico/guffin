pkmNYqweM:
  uid: pkmNYqweM
  id: 12542
  string: 'Joinville also speaks of the Nakkara as the signal for action: “So he was
    setting his host in array till noon, and then he made those drums of theirs to
    sound that they call Nacaires, and then they set upon us horse and foot.” The
    Great Nakkara of the Tartars appears from several Oriental histories to have been
    called Ḳúrḳah. I cannot find this word in any dictionary accessible to me, but
    it is in the Ain Akbari (Kawargah) as distinct from the Naḳḳárah. Abulfazl tells
    us that Akbar not only had a rare knowledge of the science of music, but was likewise
    an excellent performer— especially on the Naḳḳárah!'
