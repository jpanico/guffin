  id: 12678
  string: Note 3.—This height is from Pauthier’s Text; the G. Text has, “twenty paces,”
    i.e. 100 feet. A recent French paper states the dimensions of the existing walls
    as 14 mètres (45½ feet) high, and 14·50 (47¼ feet) thick, “the top forming a paved
    promenade, unique of its kind, and recalling the legendary walls of Thebes and
    Babylon.” (Ann. d’Hygiène Publique, 2nd s. tom. xxxii. for 1869, p. 21.) [According
    to the French astronomers (Fleuriais and Lapied) sent to Peking for the Transit
    of Venus in December, 1875, the present Tartar city is 23 kil. 55 in circuit,
    viz. if 1 li = 575 m., 41 li; from the north to the south 5400 mètres; from east
    to west 6700 mètres; the wall is 13 mètres in height and 12 mètres in width.—H.
    C.]
