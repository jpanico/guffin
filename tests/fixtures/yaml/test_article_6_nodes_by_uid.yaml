  string: Having stayed a while at Soldaia, they considered the matter, and thought
    it well to extend their journey further. So they set forth from Soldaia and travelled
    till they came to the Court of a certain Tartar Prince, Barca Kaan by name, whose
    residences were at Sara{1} and at Bolgara [and who was esteemed one of the most
    liberal and courteous Princes that ever was among the Tartars.]{2} This Barca
    was delighted at the arrival of the Two Brothers, and treated them with great
    honour; so they presented to him the whole of the jewels that they had brought
    with them. The Prince was highly pleased with these, and accepted the offering
    most graciously, causing the Brothers to receive at least twice its value. After
    they had spent a twelvemonth at the court of this Prince there broke out a great
    war between Barca and Aláu, the Lord of the Tartars of the Levant, and great hosts
    were mustered on either side.{3}
