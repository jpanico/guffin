gwF7vyF17:
  uid: gwF7vyF17
  id: 12539
  string: 'Now you must know that Nayan was a baptized Christian, and bore the cross
    on his banner; but this nought availed him, seeing how grievously he had done
    amiss in rebelling against his Lord. For he was the Great Kaan’s liegeman,{5}
    and was bound to hold his lands of him like all his ancestors before him.{6} Note
    1.—“Une grande bretesche.” Bretesche, Bertisca (whence old English Brattice, and
    Bartizan), was a term applied to any boarded structure of defence or attack, but
    especially to the timber parapets and roofs often placed on the top of the flanking-towers
    in mediæval fortifications; and this use quite explains the sort of structure
    here intended. The term and its derivative Bartizan came later to be applied to
    projecting guérites or watch-towers of masonry. Brattice in English is now applied
    to a fence round a pit or dangerous machinery. (See Muratori, Dissert. I. 334;
    Wedgwood’s Dict. of Etym. sub. v. Brattice; Viollet le Duc, by Macdermott, p.
    40; La Curne de Sainte-Palaye, Dict.; F. Godefroy, Dict.) [John Ranking (Hist.
    Res. on the Wars and Sports of the Mongols and Romans) in a note regarding this
    battle writes (p. 60): “It appears that it is an old custom in Persia, to use
    four elephants a-breast.” The Senate decreed Gordian III. to represent him triumphing
    after the Persian mode, with chariots drawn with four elephants. Augustan Hist.
    vol. ii. p. 65. See plate, p. 52.— H. C.]'
