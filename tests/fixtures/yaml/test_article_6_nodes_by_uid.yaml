gN8LMc5jG:
  uid: gN8LMc5jG
  id: 12267
  string: In the mountains of Kerman are found the best falcons in the world. They
    are inferior in size to the Peregrine, red on the breast, under the neck, and
    between the thighs; their flight so swift that no bird can escape them.{5} On
    quitting the city you ride on for seven days, always finding towns, villages,
    and handsome dwelling-houses, so that it is very pleasant travelling; and there
    is excellent sport also to be had by the way in hunting and hawking. When you
    have ridden those seven days over a plain country, you come to a great mountain;
    and when you have got to the top of the pass you find a great descent which occupies
    some two days to go down. All along you find a variety and abundance of fruits;
    and in former days there were plenty of inhabited places on the road, but now
    there are none; and you meet with only a few people looking after their cattle
    at pasture. From the city of Kerman to this descent the cold in winter is so great
    that you can scarcely abide it, even with a great quantity of clothing.{6}
