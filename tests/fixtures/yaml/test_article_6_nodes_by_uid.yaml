uMCb0ordG:
  uid: uMCb0ordG
  id: 12658
  string: 'Note 7.—[“Near the southern face of the wall are barracks for the Life
    Guards.” (Ch’ue keng lu, translated by Bretschneider, 25.)—H. C.] Note 8.—This
    description of palace (see opposite cut), an elevated basement of masonry with
    a superstructure of timber (in general carved and gilded), is still found in Burma,
    Siam, and Java, as well as in China. If we had any trace of the palaces of the
    ancient Asokas and Vikramadityas of India, we should probably find that they were
    of the same character. It seems to be one of those things that belonged to some
    ancient Panasiatic fashion, as the palaces of Nineveh were of a somewhat similar
    construction. In the Audience Halls of the Moguls at Delhi and Agra we can trace
    the ancient form, though the superstructure has there become an arcade of marble
    instead of a pavilion on timber columns. [“The Ta-ming tien (Hall of great brightness)
    is without doubt what Marco Polo calls ‘the Lord’s Great Palace.’... He states,
    that it ‘hath no upper story’; and indeed, the palace buildings which the Chinese
    call tien are always of one story. Polo speaks also of a ‘very fine pillared balustrade’
    (the chu lang, pillared verandah, of the Chinese author). Marco Polo states that
    the basement of the great palace ‘is raised some ten palms above the surrounding
    soil.’ We find in the Ku kung i lu: ‘The basement of the Ta-ming tien is raised
    about 10 ch’i above the soil.’ There can also be no doubt that the Ta-ming tien
    stood at about the same place where now the T’ai-ho tien, the principal hall of
    the palace, is situated.” (Bretschneider, Peking, 28, note.)'
