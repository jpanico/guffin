K-LnFnNio:
  uid: K-LnFnNio
  id: 12553
  string: What shall I say about it? When day had well broken, there was the Kaan
    with all his host upon a hill overlooking the plain where Nayan lay in his tent,
    in all security, without the slightest thought of any one coming thither to do
    him hurt. In fact, this confidence of his was such that he kept no vedettes whether
    in front or in rear; for he knew nothing of the coming of the Great Kaan, owing
    to all the approaches having been completely occupied as I told you. Moreover,
    the place was in a remote wilderness, more than thirty marches from the Court,
    though the Kaan had made the distance in twenty, so eager was he to come to battle
    with Nayan.
