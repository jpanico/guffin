U_BOJn4ug:
  uid: U_BOJn4ug
  id: 12649
  string: The Hall of the Palace is so large that it could easily dine 6000 people;
    and it is quite a marvel to see how many rooms there are besides. The building
    is altogether so vast, so rich, and so beautiful, that no man on earth could design
    anything superior to it. The outside of the roof also is all coloured with vermilion
    and yellow and green and blue and other hues, which are fixed with a varnish so
    fine and exquisite that they shine like crystal, and lend a resplendent lustre
    to the Palace as seen for a great way round.{9} This roof is made too with such
    strength and solidity that it is fit to last for ever. [On the interior side of
    the Palace are large buildings with halls and chambers, where the Emperor’s private
    property is placed, such as his treasures of gold, silver, gems, pearls, and gold
    plate, and in which reside the ladies and concubines. There he occupies himself
    at his own convenience, and no one else has access.]
