tPZRHnWUs:
  uid: tPZRHnWUs
  id: 12656
  string: Note 5.—The two gates near the corners apparently do not exist in the Palace
    now. “On the south side there are three gates to the Palace, both in the inner
    and the outer walls. The middle one is absolutely reserved for the entrance or
    exit of the Emperor; all other people pass in and out by the gate to the right
    or left of it.” (Trigautius, Bk. I. ch. vii.) This custom is not in China peculiar
    to Royalty. In private houses it is usual to have three doors leading from the
    court to the guest-rooms, and there is a great exercise of politeness in reference
    to these; the guest after much pressing is prevailed on to enter the middle door,
    whilst the host enters by the side. (See Deguignes, Voyages, I. 262.) [See also
    H. Cordier’s Hist. des Relat. de la Chine, III. ch. x. Audience Impériale.] [“It
    seems Polo took the three gateways in the middle gate (Ta-ming men) for three
    gates, and thus speaks of five gates instead of three in the southern wall.” (Bretschneider,
    Peking, 27, note.) —H. C.]
