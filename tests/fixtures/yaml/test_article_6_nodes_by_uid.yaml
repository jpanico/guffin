JdToFRz_G:
  uid: JdToFRz_G
  id: 12513
  string: Now this Cublay Kaan is of the right Imperial lineage, being descended from
    Chinghis Kaan, the first sovereign of all the Tartars. And he is the sixth Lord
    in that succession, as I have already told you in this book. He came to the throne
    in the year of Christ, 1256, and the Empire fell to him because of his ability
    and valour and great worth, as was right and reason.{1} His brothers, indeed,
    and other kinsmen disputed his claim, but his it remained, both because maintained
    by his great valour, and because it was in law and right his, as being directly
    sprung of the imperial line. Up to the year of Christ now running, to wit 1298,
    he hath reigned two-and-forty years, and his age is about eighty-five, so that
    he must have been about forty-three years of age when he first came to the throne.{2}
    Before that time he had often been to the wars, and had shown himself a gallant
    soldier and an excellent captain. But after coming to the throne he never went
    to the wars in person save once.{3} This befel in the year of Christ, 1286, and
    I will tell you why he went.
