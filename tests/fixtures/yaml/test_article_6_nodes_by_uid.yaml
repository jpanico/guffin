WAFXG2Y_5:
  uid: WAFXG2Y_5
  id: 12249
  string: Runiz and Gauristan near Bandar Abbas; (2) to a village near Maiman, in
    the old country of the tribe; (3) to a tribe and district of Dashtistan, 38 farsakhs
    west of Shíráz. With reference to the form in the text, Soncara, I may notice
    that in two passages of the Masálak-ul-Absár, translated by Quatremère, the name
    occurs as Shankárah. (Q. R. pp. 380, 440 seqq.; N. et E. XIII.; Ilch. I. 71 and
    passim; Ouseley’s Travels, II. 158 seqq.) VIII. Tún-o-Káin, the eastern Kuhistán
    or Hill country of Persia, of which Tún and Káin are chief cities. The practice
    of indicating a locality by combining two names in this way is common in the East.
    Elsewhere in this book we find Ariora-Keshemur and Kes-macoran (Kij-Makrán). Upper
    Sind is often called in India by the Sepoys Rori-Bakkar, from two adjoining places
    on the Indus; whilst in former days, Lower Sind was often called Diul-Sind. Karra-Mánikpúr,
    UchMultán, Kunduz-Baghlán are other examples. The exact expression Tún-o-Káin
    for the province here in question is used by Baber, and evidently also by some
    of Hammer’s authorities. (Baber, pp. 201, 204; see Ilch. II. 190; I. 95, 104,
    and Hist. de l’Ordre des Assassins, p. 245.) [We learn from (Sir) C. Macgregor’s
    (1875) Journey through Khorasan (I. p. 127) that the same territory including
    Gháín or Kaïn is now called by the analogous name of Tabas-o-Tún. Tún and Kaïn
    (Gháín) are both described in their modern state, by Macgregor. (Ibid. pp. 147
    and 161.)— H. C.] Note that the identification of Suolstan is due to Quatremère
    (see N. et E. XIII. i. circa p. 332); that of Soncara to Defréméry (J. As. sér.
    IV. tom. xi. p. 441); and that of Tunocain to Malte-Brun. (N. Ann. des V. xviii.
    p. 261.) I may add that the Lúrs, the Shúls, and the Shabánkáras are the subjects
    of three successive sections in the Masálak-al-Absár of Shihábuddin Dimishki,
    a work which reflects much of Polo’s geography. (See N. et E. XIII. i. 330–333;
    Curzon, Persia, II. pp. 248 and 251.)
