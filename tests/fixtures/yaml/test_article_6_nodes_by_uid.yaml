EF6nyb1vF:
  uid: EF6nyb1vF
  id: 12176
  string: 'Like circumstances would produce the same effect in a variety of lakes,
    and I have not been able to identify the convent of St. Leonard’s. Indeed Leonard
    (Sant Lienard, G. T.) seems no likely name for an Armenian Saint; and the patroness
    of the convent (as she is of many others in that country) was perhaps Saint Nina,
    an eminent personage in the Armenian Church, whose tomb is still a place of pilgrimage;
    or possibly St. Helena, for I see that the Russian maps show a place called Elenovka
    on the shores of Lake Sevan, N.E. of Erivan. Ramusio’s text, moreover, says that
    the lake was four days in compass, and this description will apply, I believe,
    to none but the lake just named. This is, according to Monteith, 47 miles in length
    and 21 miles in breadth, and as far as I can make out he travelled round it in
    three very long marches. Convents and churches on its shores are numerous, and
    a very ancient one occupies an island on the lake. The lake is noted for its fish,
    especially magnificent trout. (Tavern. Bk. III. ch. iii.; J. R. G. S. X. 897;
    Pereg. Quat. p. 179; Khanikoff, 15; Moorcroft, II. 382; J. R. G. S. III. 40 seqq.)
    Ramusio has: “In this province there is a fine city called Tiflis, and round about
    it are many castles and walled villages. It is inhabited by Christians, Armenians,
    Georgians, and some Saracens and Jews, but not many.”'
