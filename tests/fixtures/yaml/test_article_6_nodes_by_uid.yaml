rJmEPmgcw:
  uid: rJmEPmgcw
  id: 12642
  string: The Emperor hath, by those four wives of his, twenty-two male children;
    the eldest of whom was called Chinkin for the love of the good Chinghis Kaan,
    the first Lord of the Tartars. And this Chinkin, as the Eldest Son of the Kaan,
    was to have reigned after his father’s death; but, as it came to pass, he died.
    He left a son behind him, however, whose name is Temur, and he is to be the Great
    Kaan and Emperor after the death of his Grandfather, as is but right; he being
    the child of the Great Kaan’s eldest son. And this Temur is an able and brave
    man, as he hath already proven on many occasions.{1}
