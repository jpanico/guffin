aB8RXjgat:
  uid: aB8RXjgat
  id: 12390
  string: In this kingdom there are many strait and perilous passes, so difficult
    to force that the people have no fear of invasion. Their towns and villages also
    are on lofty hills, and in very strong positions.{8} They are excellent archers,
    and much given to the chase; indeed, most of them are dependent for clothing on
    the skins of beasts, for stuffs are very dear among them. The great ladies, however,
    are arrayed in stuffs, and I will tell you the style of their dress! They all
    wear drawers made of cotton cloth, and into the making of these some will put
    60, 80, or even 100 ells of stuff. This they do to make themselves look large
    in the hips, for the men of those parts think that to be a great beauty in a woman.{9}
