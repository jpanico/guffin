kQ9V7JV9P:
  uid: kQ9V7JV9P
  id: 12325
  string: But when they laid hold of them by the arms to drag them to the pits, the
    bodies proved to be so baked, as it were, by that tremendous heat, that the arms
    parted from the trunks, and in the end the people had to dig graves hard by each
    where it lay, and so cast them in.]{5} The people sow their wheat and barley and
    other corn in the month of November, and reap it in the month of March. The dates
    are not gathered till May, but otherwise there is no grass nor any other green
    thing, for the excessive heat dries up everything. When any one dies they make
    a great business of the mourning, for women mourn their husbands four years. During
    that time they mourn at least once a day, gathering together their kinsfolk and
    friends and neighbours for the purpose, and making a great weeping and wailing.
    [And they have women who are mourners by trade, and do it for hire.] Now, we will
    quit this country. I shall not, however, now go on to tell you about India; but
    when time and place shall suit we shall come round from the north and tell you
    about it. For the present, let us return by another road to the aforesaid city
    of Kerman, for we cannot get at those countries that I wish to tell you about
    except through that city.
