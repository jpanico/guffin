sLpu_Qk2h:
  uid: sLpu_Qk2h
  id: 12629
  string: An Indian prince, in a Sanskrit inscription of the 9th century, boasts of
    having wrested from the King of Márwár the two umbrellas pleasing to Parvati,
    and white as the summer moonbeams. Prithi Ráj, the last Hindu king of Delhi, is
    depicted by the poet Chand as shaded by a white umbrella on a golden staff. An
    unmistakable umbrella, copied from a Saxon MS. in the Harleian collection, is
    engraved in Wright’s History of Domestic Manners, p. 75. The fact that the gold
    umbrella is one of the paraphernalia of high church dignitaries in Italy seems
    to presume acquaintance with the thing from a remote period. A decorated umbrella
    also accompanies the host when sent out to the sick, at least where I write, in
    Palermo. Ibn Batuta says that in his time all the people of Constantinople, civil
    and military, great and small, carried great umbrellas over their heads, summer
    and winter. Ducange quotes, from a MS. of the Paris Library, the Byzantine court
    regulations about umbrellas, which are of the genuine Pan-Asiatic spirit;—σκιάδια
    χρυσοκóκκινα extend from the Hypersebastus to the grand Stratopedarchus, and so
    on; exactly as used to be the case, with different titles, in Java. And yet it
    is curious that John Marignolli, Ibn Batuta’s contemporary in the middle of the
    14th century, and Barbosa in the 16th century, are alike at pains to describe
    the umbrella as some strange object. And in our own country it is commonly stated
    that the umbrella was first used in the last century, and that Jonas Hanway (died
    1786) was one of the first persons who made a practice of carrying one. The word
    umbrello is, however, in Minsheu’s dictionary. [See Hobson-Jobson, s.v. Umbrella.—H.
    C.]
