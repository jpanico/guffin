L-BHFco0z:
  uid: L-BHFco0z
  id: 12480
  string: '“Therefore he must have left the Aksu Valley to cross the Pass of Tagharma,
    about 50 or 60 kilometres to the north of the Neza Tash Pass; thence to Kashgar,
    the distance, in a straight line, is about 200 kilometres, and less than 300 by
    the shortest route which runs from the Tagharma Pass to little Kara Kul, and from
    there down to Yangi Hissar, along the Ghidjik. And Marco Polo assigns forty days
    for this route, while he allows but thirty for the journey of 500 kilometres (at
    least) from Jerm to the foot of the Tagharma Pass.” Professor Paquier (Bul. Soc.
    Géog. 6e Sér. XII. pp. 121–125) remarks that the Moonshee, sent by Captain Trotter
    to survey the Oxus between Ishkashm and Kila Wamár, could not find at the spot
    marked by Yule on his map, the mouth of the Shakh-Dara, but northward 7 or 8 miles
    from the junction of the Murghab with the Oxus, he saw the opening of an important
    water-course, the Suchnan River, formed by the Shakh-Dara and the Ghund-Dara.
    Marco arrived at a place between Northern Wakhán and Shihgnan; from the Central
    Pamir, Polo would have taken a route identical with that of the Mirza (1868–1869)
    by the Chichiklik Pass. Professor Paquier adds: “I have no hesitation in believing
    that Marco Polo was in the neighbourhood of that great commercial road, which
    by the Vallis Comedarum reached the foot of the Imaüs. He probably did not venture
    on a journey of fifty marches in an unknown country. At the top of the Shihgnan
    Valley, he doubtless found a road marked out to Little Bukharia. This was the
    road followed in ancient times from Bactrian to Serica; and Ptolemy has, so to
    speak, given us its landmarks after Marinus of Tyre, by the Vallis Comedarum (Valley
    of actual Shihgnan); the Turris Lapidea and the Statio Mercatorum, neighbourhood
    of Tásh Kurgán, capital of the present province of Sar-i-kol.” I must say that
    accepting, as I do, for Polo’s Itinerary, the route from Wakhán to Kashgar by
    the Taghdum-Bash Pamir, and Tásh Kurgán, I do not agree with Professor Paquier’s
    theory. But though I prefer Sir H. Yule’s route from Badakhshan, by the River
    Vardoj, the Pass of Ishkashm, the Panja, to Wakhán, I do not accept his views
    for the Itinerary from Wakhán to Kashgar; see p. 175.—H. C.] The river along which
    Marco travels from Badakhshan is no doubt the upper stream of the Oxus, known
    locally as the Panja, along which Wood also travelled, followed of late by the
    Mirza and Faiz Bakhsh. It is true that the river is reached from Badaskhshan Proper
    by ascending another river (the Vardoj) and crossing the Pass of Ishkáshm, but
    in the brief style of our narrative we must expect such condensation.'
