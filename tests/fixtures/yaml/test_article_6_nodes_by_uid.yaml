A3MnG4Vgl:
  uid: A3MnG4Vgl
  id: 12982
  string: “It is your best work, Basil, the best thing you have ever done,” said Lord
    Henry languidly. “You must certainly send it next year to the Grosvenor. The Academy
    is too large and too vulgar. Whenever I have gone there, there have been either
    so many people that I have not been able to see the pictures, which was dreadful,
    or so many pictures that I have not been able to see the people, which was worse.
    The Grosvenor is really the only place.”
