  id: 12277
  string: Note 4.—Paulus Jovius in the 16th century says, I know not on what authority,
    that Kermán was then celebrated for the fine temper of its steel in scimitars
    and lance-points. These were eagerly bought at high prices by the Turks, and their
    quality was such that one blow of a Kermán sabre would cleave an European helmet
    without turning the edge. And I see that the phrase, “Kermání blade” is used in
    poetry by Marco’s contemporary Amír Khusrú of Delhi. (P. Jov. Hist. of his own
    Time, Bk. XIV.; Elliot, III. 537.)
