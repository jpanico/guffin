XE5cHpBNa:
  uid: XE5cHpBNa
  id: 12541
  string: 'Note 3.—The specification of the Tartar instrument of two strings is peculiar
    to Pauthier’s texts. It was no doubt what Dr. Clarke calls “the balalaika or two-stringed
    lyre,” the most common instrument among the Kalmaks. The sounding of the Nakkára
    as the signal of action is an old Pan-Asiatic custom, but I cannot find that this
    very striking circumstance of the whole host of Tartars playing and singing in
    chorus, when ordered for battle and waiting the signal from the boom of the Big
    Drum, is mentioned by any other author. The Naḳḳárah or Nagárah was a great kettledrum,
    formed like a brazen caldron, tapering to the bottom and covered with buffalo-hide—at
    least 3½ or 4 feet in diameter. Bernier, indeed, tells of Naḳḳáras in use at the
    Court of Delhi that were not less than a fathom across; and Tod speaks of them
    in Rájpútána as “about 8 or 10 feet in diameter.” The Tartar Naḳḳárahs were usually,
    I presume, carried on a camel; but as Kúblái had begun to use elephants, his may
    have been carried on an elephant, as is sometimes the case in India. Thus, too,
    P. della Valle describes those of an Indian Embassy at Ispahan: “The Indian Ambassador
    was also accompanied by a variety of warlike instruments of music of strange kinds,
    and particularly by certain Naccheras of such immense size that each pair had
    an elephant to carry them, whilst an Indian astride upon the elephant between
    the two Naccheras played upon them with both hands, dealing strong blows on this
    one and on that; what a din was made by these vast drums, and what a spectacle
    it was, I leave you to imagine.”'
