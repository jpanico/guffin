xR2SkX0dj:
  uid: xR2SkX0dj
  id: 12083
  string: '[“Mesalek-al-absar (285, 287), says Sarai, meaning ‘the Palace,’ was founded
    by Bereké, brother of Batu. It stood in a salty plain, and was without walls,
    though the palace had walls flanked by towers. The town was large, had markets,
    madrasas—and baths. It is usually identified with Selitrennoyé Gorodok, about
    70 miles above Astrakhan.” (Rockhill, Rubruck, p. 260, note.)— H. C.] Several
    sites exhibiting extensive ruins near the banks of the Akhtuba have been identified
    with Sarai; two in particular. One of these is not far from the great elbow of
    the Volga at Tzaritzyn: the other much lower down, at Selitrennoyé Gorodok or
    Saltpetre-Town, not far above Astrakhan.'
