JQVKcYJKO:
  uid: JQVKcYJKO
  id: 12443
  string: The men are brown and lean, but the women, taking them as brunettes, are
    very beautiful. The food of the people is flesh, and milk, and rice. The clime
    is finely tempered, being neither very hot nor very cold. There are numbers of
    towns and villages in the country, but also forests and desert tracts, and strong
    passes, so that the people have no fear of anybody, and keep their independence,
    with a king of their own to rule and do justice.{4} There are in this country
    Eremites (after the fashion of those parts), who dwell in seclusion and practise
    great abstinence in eating and drinking. They observe strict chastity, and keep
    from all sins forbidden in their law, so that they are regarded by their own folk
    as very holy persons. They live to a very great age.{5}
