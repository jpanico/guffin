  id: 12099
  string: 'After they had passed the desert, they arrived at a very great and noble
    city called Bocara, the territory of which belonged to a king whose name was Barac,
    and is also called Bocara. The city is the best in all Persia.{1} And when they
    had got thither, they found they could neither proceed further forward nor yet
    turn back again; wherefore they abode in that city of Bocara for three years.
    And whilst they were sojourning in that city, there came from Alau, Lord of the
    Levant, Envoys on their way to the Court of the Great Kaan, the Lord of all the
    Tartars in the world. And when the Envoys beheld the Two Brothers they were amazed,
    for they had never before seen Latins in that part of the world. And they said
    to the Brothers: “Gentlemen, if ye will take our counsel, ye will find great honour
    and profit shall come'
