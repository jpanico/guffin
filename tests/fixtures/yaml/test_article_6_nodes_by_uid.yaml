g9ifwFqvG:
  uid: g9ifwFqvG
  id: 12219
  string: Now I have told you something of Baudas. I could easily indeed have told
    you first of the affairs and the customs of the people there. But it would be
    too long a business, looking to the great and strange things that I have got to
    tell you, as you will find detailed in this Book. So now I will tell you of the
    noble city of Tauris. Note 1.—We may remember that at a date only three years
    before Marco related this story (viz. in 1295), the cottage of Loreto is asserted
    to have changed its locality for the third and last time by moving to the site
    which it now occupies. Some of the old Latin copies place the scene at Tauris.
    And I observe that a missionary of the 16th century does the same. The mountain,
    he says, is between Tauris and Nakhshiwan, and is called Manhuc. (Gravina, Christianità
    nell’ Armenia, etc., Roma, 1605, p. 91.)
