twpddhZKC:
  uid: twpddhZKC
  id: 12538
  string: So then, as they were thus singing and playing, though ordered and ready
    for battle, the great Naccara of the Great Khan began to sound. And that of Nayan
    also began to sound. And thenceforward the din of battle began to be heard loudly
    from this side and from that. And they rushed to work so doughtily with their
    bows and their maces, with their lances and swords, and with the arblasts of the
    footmen, that it was a wondrous sight to see. Now might you behold such flights
    of arrows from this side and from that, that the whole heaven was canopied with
    them and they fell like rain. Now might you see on this side and on that full
    many a cavalier and man-at-arms fall slain, insomuch that the whole field seemed
    covered with them. From this side and from that such cries arose from the crowds
    of the wounded and dying that had God thundered, you would not have heard Him!
    For fierce and furious was the battle, and quarter there was none given.{4} But
    why should I make a long story of it? You must know that it was the most parlous
    and fierce and fearful battle that ever has been fought in our day. Nor have there
    ever been such forces in the field in actual fight, especially of horsemen, as
    were then engaged—for, taking both sides, there were not fewer than 760,000 horsemen,
    a mighty force! and that without reckoning the footmen, who were also very numerous.
    The battle endured with various fortune on this side and on that from morning
    till noon. But at the last, by God’s pleasure and the right that was on his side,
    the Great Khan had the victory, and Nayan lost the battle and was utterly routed.
    For the army of the Great Kaan performed such feats of arms that Nayan and his
    host could stand against them no longer, so they turned and fled. But this availed
    nothing for Nayan; for he and all the barons with him were taken prisoners, and
    had to surrender to the Kaan with all their arms.
