pRwryji2b:
  uid: pRwryji2b
  id: 13028
  string: “My dear fellow, I am not quite serious. But I can’t help detesting my relations.
    I suppose it comes from the fact that none of us can stand other people having
    the same faults as ourselves. I quite sympathize with the rage of the English
    democracy against what they call the vices of the upper orders. The masses feel
    that drunkenness, stupidity, and immorality should be their own special property,
    and that if any one of us makes an ass of himself, he is poaching on their preserves.
    When poor Southwark got into the divorce court, their indignation was quite magnificent.
    And yet I don’t suppose that ten percent of the proletariat live correctly.”
  order: 50
