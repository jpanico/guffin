90akSRzHl:
  uid: 90akSRzHl
  id: 12516
  string: Note 2.—Kúblái was born in the eighth month of the year corresponding to
    1216, and had he lived to 1298 would have been eighty-two years old. [According
    to Dr. E. Bretschneider (Peking, 30), quoting the Yuen-Shi, Kúblái died at Khanbaligh,
    in the Tze-t’an tien in February, 1294.— H. C.] But by Mahomedan reckoning he
    would have been close upon eighty-five. He was the fourth son of Tuli, who was
    the youngest of Chinghiz’s four sons by his favourite wife Burté Fujin. (See De
    Mailla, IX. 255, etc.) Note 3.—This is not literally true; for soon after his
    accession (in 1261) Kúblái led an army against his brother and rival Arikbuga,
    and defeated him. And again in his old age, if we credit the Chinese annalist,
    in 1289, when his grandson Kanmala (or Kambala) was beaten on the northern frontier
    by Kaidu, Kúblái took the field himself, though on his approach the rebels disappeared.
    Kúblái and his brother Hulaku, young as they were, commenced their military career
    on Chinghiz’s last expedition (1226–1227). His most notable campaign was the conquest
    of Yunnan in 1253–1254. (De Mailla, IX. 298, 441.)
