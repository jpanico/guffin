nGIAATY3T:
  uid: nGIAATY3T
  id: 12452
  string: 'Note 4.—The people of Káshmir retain their beauty, but they are morally
    one of the most degraded races in Asia. Long oppression, now under the Lords of
    Jamu as great as ever, has no doubt aggravated this. Yet it would seem that twelve
    hundred years ago the evil elements were there as well as the beauty. The Chinese
    traveller says: “Their manners are light and volatile, their characters effeminate
    and pusillanimous.... They are very handsome, but their natural bent is to fraud
    and trickery.” (Pèl. Boud. II. 167–168.) Vigne’s account is nearly the same. (II.
    142–143.) “They are as mischievous as monkeys, and far more malicious,” says Mr.
    Shaw (p. 292). [Bernier says: “The women [of Kachemire] especially are very handsome;
    and it is from this country that nearly every individual, when first admitted
    to the court of the Great Mogul, selects wives or concubines, that his children
    may be whiter than the Indians, and pass for genuine Moguls. Unquestionably, there
    must be beautiful women among the higher classes, if we may judge by those of
    the lower orders seen in the streets and in the shops.” (Travels in the Mogul
    Empire, edited by Archibald Constable, 1891, p. 404.)]'
