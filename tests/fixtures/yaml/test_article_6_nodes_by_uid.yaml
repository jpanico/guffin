PaVDjs_S8:
  uid: PaVDjs_S8
  id: 12526
  string: Note 1.—I am afraid Marco, in his desire to impress on his readers the great
    power of the Kaan, is here giving the reins to exaggeration on a great scale.
    Ramusio has here the following explanatory addition:—“You must know that in all
    the Provinces of Cathay and Mangi, and throughout the Great Kaan’s dominions,
    there are too many disloyal folk ready to break into rebellion against their Lord,
    and hence it is needful in every province containing large cities and much population,
    to maintain garrisons. These are stationed four or five miles from the cities,
    and the latter are not allowed to have walls or gates by which they might obstruct
    the entrance of the troops at their pleasure. These garrisons as well as their
    commanders the Great Kaan causes to be relieved every two years; and bridled in
    this way the people are kept quiet, and can make no disturbance. The troops are
    maintained not only by the pay which the Kaan regularly assigns from the revenues
    of each province, but also by the vast quantities of cattle which they keep, and
    by the sale of milk in the cities, which furnishes the means of buying what they
    require. They are scattered among their different stations, at distances of 30,
    40, or 60 days (from the capital); and had Cublay decided to summon but the half
    of them, the number would have been incredible,” etc. [Palladius says (p. 37)
    that in the Mongol-Chinese documents, the Mongol garrisons cantoned near the Chinese
    towns are mentioned under the name of Aolu, but no explanation of the term is
    given.—H. C.] The system of controlling garrisons, quartered at a few miles from
    the great cities, is that which the Chinese followed at Kashgar, Yarkand, etc.
    It is, in fact, our own system in India, as at Barrackpúr, Dinapúr, Sikandarábád,
    Mián Mír.
