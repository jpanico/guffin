  string: Note 8.—The Caspian is termed by Vincent of Beauvais Mare Seruanicum, the
    Sea of Shirwan, another of its numerous Oriental names, rendered by Marino Sanuto
    as Mare Salvanicum. (III. xi. ch. ix.) But it was generally known to the Franks
    in the Middle Ages as the Sea of Bacu. Thus Berni:— “Fuor del deserto la diritta
    strada Lungo il Mar di Bacu miglior pareva.” (Orl. Innam. xvii. 60.)
