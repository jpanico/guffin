nsNSMSU8i:
  uid: nsNSMSU8i
  id: 12674
  string: Moreover, in the middle of the city there is a great clock—that is to say,
    a bell—which is struck at night. And after it has struck three times no one must
    go out in the city, unless it be for the needs of a woman in labour, or of the
    sick.{6} And those who go about on such errands are bound to carry lanterns with
    them. Moreover, the established guard at each gate of the city is 1000 armed men;
    not that you are to imagine this guard is kept up for fear of any attack, but
    only as a guard of honour for the Sovereign, who resides there, and to prevent
    thieves from doing mischief in the town.{7} Note 1.— ✛ The history of the city
    on the site of Peking goes back to very old times, for it had been [under the
    name of Ki] the capital of the kingdom of Yen, previous to b.c. 222, when it was
    captured by the Prince of the T’sin Dynasty. [Under the T’ang dynasty (618–907)
    it was known under the name of Yu-chau.] It became one of the capitals of the
    Khitans in a.d. 936, and of the Kin sovereigns, who took it in 1125, in 1151 under
    the name of Chung-tu. Under the name of Yenking, [given to this city in 1013]
    it has a conspicuous place in the wars of Chinghiz against the latter dynasty.
    He captured it in 1215. In 1264, Kúblái adopted it as his chief residence, and
    founded in 1267, the new city of Tatu (“Great Court”), called by the Mongols Taidu
    or Daitu since 1271 (see Bk. I. ch. lxi. note 1), at a little distance—Odoric
    says half a mile—to the northeast of the old Yenking. Tatu was completed in the
    summer of 1267. Old Yenking had, when occupied by the Kin, a circuit of 27 li
    (commonly estimated at 9 miles, but in early works the li is not more than ⅕ of
    a mile), afterwards increased to 30 li. But there was some kind of outer wall
    about the city and its suburbs, the circuit of which is called 75 li. [“At the
    time of the Yuen the walls still existed, and the ancient city of the Kin was
    commonly called Nanch’eng (Southern city), whilst the Mongol capital was termed
    the northern city.” Bretschneider, Peking, 10.—H. C.] (Lockhart; and see Amyot,
    II. 553, and note 6 to last chapter.)
