3xs7n7qWg:
  uid: 3xs7n7qWg
  id: 12651
  string: From that corner of the enclosure which is towards the north-west there
    extends a fine Lake, containing foison of fish of different kinds which the Emperor
    hath caused to be put in there, so that whenever he desires any he can have them
    at his pleasure. A river enters this lake and issues from it, but there is a grating
    of iron or brass put up so that the fish cannot escape in that way.{11} Moreover
    on the north side of the Palace, about a bow-shot off, there is a hill which has
    been made by art [from the earth dug out of the lake]; it is a good hundred paces
    in height and a mile in compass. This hill is entirely covered with trees that
    never lose their leaves, but remain ever green. And I assure you that wherever
    a beautiful tree may exist, and the Emperor gets news of it, he sends for it and
    has it transported bodily with all its roots and the earth attached to them, and
    planted on that hill of his. No matter how big the tree may be, he gets it carried
    by his elephants; and in this way he has got together the most beautiful collection
    of trees in all the world. And he has also caused the whole hill to be covered
    with the ore of azure,{12} which is very green. And thus not only are the trees
    all green, but the hill itself is all green likewise; and there is nothing to
    be seen on it that is not green; and hence it is called the Green Mount; and in
    good sooth ’tis named well.{13} On the top of the hill again there is a fine big
    palace which is all green inside and out; and thus the hill, and the trees, and
    the palace form together a charming spectacle; and it is marvellous to see their
    uniformity of colour! Everybody who sees them is delighted. And the Great Kaan
    had caused this beautiful prospect to be formed for the comfort and solace and
    delectation of his heart.
