WZV2wpzK8:
  uid: WZV2wpzK8
  id: 12391
  string: Note 1.—“The population of Badakhshan Proper is composed of Tajiks, Turks,
    and Arabs, who are all Sunnis, following the orthodox doctrines of the Mahomedan
    law, and speak Persian and Turki, whilst the people of the more mountainous tracts
    are Tajiks of the Shiá creed, having separate provincial dialects or languages
    of their own, the inhabitants of the principal places combining therewith a knowledge
    of Persian. Thus, the Shighnáni [sometimes called Shighni] is spoken in Shignán
    and Roshán, the Ishkáshami in Ishkásham, the Wakhi in Wakhán, the Sanglichì in
    Sanglich and Zebák, and the Minjáni in Minján. All these dialects materially differ
    from each other.” (Pand. Manphul.) It may be considered almost certain that Badakhshan
    Proper also had a peculiar dialect in Polo’s time. Mr. Shaw speaks of the strong
    resemblance to Kashmírís of the Badakhshán people whom he had seen. The Legend
    of the Alexandrian pedigree of the Kings of Badakhshan is spoken of by Baber,
    and by earlier Eastern authors. This pedigree is, or was, claimed also by the
    chiefs of Karátegín, Darwáz, Roshán, Shighnán, Wakhán, Chitrál, Gilgít, Swát,
    and Khapolor in Bálti. Some samples of those genealogies may be seen in that strange
    document called “Gardiner’s Travels.”
