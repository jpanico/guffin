y6Sb4knJU:
  uid: y6Sb4knJU
  id: 12403
  string: Badashan is a Province inhabited by people who worship Mahommet, and have
    a peculiar language. It forms a very great kingdom, and the royalty is hereditary.
    All those of the royal blood are descended from King Alexander and the daughter
    of King Darius, who was Lord of the vast Empire of Persia. And all these kings
    call themselves in the Saracen tongue Zulcarniain, which is as much as to say
    Alexander; and this out of regard for Alexander the Great.{1} It is in this province
    that those fine and valuable gems the Balas Rubies are found. They are got in
    certain rocks among the mountains, and in the search for them the people dig great
    caves underground, just as is done by miners for silver. There is but one special
    mountain that produces them, and it is called Syghinan. The stones are dug on
    the king’s account, and no one else dares dig in that mountain on pain of forfeiture
    of life as well as goods; nor may any one carry the stones out of the kingdom.
    But the king amasses them all, and sends them to other kings when he has tribute
    to render, or when he desires to offer a friendly present; and such only as he
    pleases he causes to be sold. Thus he acts in order to keep the Balas at a high
    value; for if he were to allow everybody to dig, they would extract so many that
    the world would be glutted with them, and they would cease to bear any value.
    Hence it is that he allows so few to be taken out, and is so strict in the matter.{2}
    There is also in the same country another mountain, in which azure is found; ’tis
    the finest in the world, and is got in a vein like silver. There are also other
    mountains which contain a great amount of silver ore, so that the country is a
    very rich one; but it is also (it must be said) a very cold one.{3} It produces
    numbers of excellent horses, remarkable for their speed. They are not shod at
    all, although constantly used in mountainous country, and on very bad roads. [They
    go at a great pace even down steep descents, where other horses neither would
    nor could do the like. And Messer Marco was told that not long ago they possessed
    in that province a breed of horses from the strain of Alexander’s horse Bucephalus,
    all of which had from their birth a particular mark on the forehead. This breed
    was entirely in the hands of an uncle of the king’s; and in consequence of his
    refusing to let the king have any of them, the latter put him to death. The widow
    then, in despite, destroyed the whole breed, and it is now extinct.{4}]
