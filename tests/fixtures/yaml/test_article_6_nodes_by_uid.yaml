XsJBIlRJx:
  uid: XsJBIlRJx
  id: 12631
  string: Note 4.—I have not been able to find any allusion, except in our author,
    to tablets, with gerfalcons (shonḳár). The shonḳár appears, however, according
    to Erdmann, on certain coins of the Golden Horde, struck at Sarai. There is a
    passage from Wassáf used by Hammer, in whose words it runs that the Sayad Imámuddín,
    appointed (a.d. 683) governor of Shiraz by Arghun Khan, “was invested with both
    the Mongol symbols of delegated sovereignty, the Golden Lion’s Head, and the golden
    Cat’s Head.” It would certainly have been more satisfactory to find “Gerfalcon’s
    Head” in lieu of the latter; but it is probable that the same object is meant.
    The cut below exhibits the conventional effigy of a gerfalcon as sculptured over
    one of the gates of Iconium, Polo’s Conia. The head might easily pass for a conventional
    representation of a cat’s head, and is indeed strikingly like the grotesque representation
    that bears that name in mediæval architecture. (Erdmann, Numi Asiatici, I. 339;
    Ilch. I. 370.)
