yJzrsNJog:
  uid: yJzrsNJog
  id: 12163
  string: There is in this country a certain Convent of Nuns called St. Leonard’s,
    about which I have to tell you a very wonderful circumstance. Near the church
    in question there is a great lake at the foot of a mountain, and in this lake
    are found no fish, great or small, throughout the year till Lent come. On the
    first day of Lent they find in it the finest fish in the world, and great store
    too thereof; and these continue to be found till Easter Eve. After that they are
    found no more till Lent come round again; and so ’tis every year. ’Tis really
    a passing great miracle!{6}
