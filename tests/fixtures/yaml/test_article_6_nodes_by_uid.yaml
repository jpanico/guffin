IioymiceP:
  uid: IioymiceP
  id: 12181
  string: This name is introduced in Ramusio, but probably by interpolation, as well
    as the correction of the statement regarding Euphrates, which is perhaps a branch
    of the notion alluded to in Prologue, ch. ii. note 5. In a later chapter Marco
    calls it the Sea of Sarai, a title also given in the Carta Catalana. [Odorico
    calls it Sea of Bacuc (Cathay) and Sea of Bascon (Cordier). The latter name is
    a corruption of Abeskun, a small town and island in the S.E. corner of the Caspian
    Sea, not far from Ashurada.—H. C.] We have little information as to the Genoese
    navigation of the Caspian, but the great number of names exhibited along its shores
    in the map just named (1375) shows how familiar such navigation had become by
    that date. See also Cathay, p. 50, where an account is given of a remarkable enterprise
    by Genoese buccaneers on the Caspian about that time. Mas’udi relates an earlier
    history of how about the beginning of the 9th century a fleet of 500 Russian vessels
    came out of the Volga, and ravaged all the populous southern and western shores
    of the Caspian. The unhappy population was struck with astonishment and horror
    at this unlooked-for visitation from a sea that had hitherto been only frequented
    by peaceful traders or fishermen. (II. 18–24.)
