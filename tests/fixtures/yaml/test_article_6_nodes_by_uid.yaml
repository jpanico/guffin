xaR-gKVQ4:
  uid: xaR-gKVQ4
  id: 12301
  string: '(Gold. Horde, 214; Ilch. I. 17, 344, etc.; Erdmann, 168, 199, etc.; J.
    A. S. B. X. 96; Q. R. 130; Not. et Ext. XIV. 282; I. B. III. 201; Ed. Webbe, his
    Travailes, p. 17, 1590. Reprinted 1868.) As regards the account given by Marco
    of the origin of the Caraonas, it seems almost necessarily a mistaken one. As
    Khanikoff remarks, he might have confounded them with the Biluchis, whose Turanian
    aspect (at least as regards the Brahuis) shows a strong infusion of Turki blood,
    and who might be rudely described as a cross between Tartars and Indians. It is
    indeed an odd fact that the word Karáni (vulgo Cranny) is commonly applied in
    India at this day to the mixed race sprung from European fathers and Native mothers,
    and this might be cited in corroboration of Marsden’s reference to the Sanskrit
    Karana, but I suspect the coincidence arises in another way. Karana is the name
    applied to a particular class of mixt blood, whose special occupation was writing
    and accounts. But the prior sense of the word seems to have been “clever, skilled,”
    and hence a writer or scribe. In this sense we find Karáni applied in Ibn Batuta’s
    day to a ship’s clerk, and it is used in the same sense in the Aín Akbari. Clerkship
    is also the predominant occupation of the East-Indians, and hence the term Karáni
    is applied to them from their business, and not from their mixt blood. We shall
    see hereafter that there is a Tartar term Arghún, applied to fair children born
    of a Mongol mother and white father; it is possible that there may have been a
    correlative word like Ḳaráun (from Ḳará, black) applied to dark children born
    of Mongol father and black mother, and that this led Marco to a false theory.
    [Major Sykes (Persia) devotes a chapter (xxiv.) to The Karwán Expedition in which
    he says: “Is it not possible that the Karwánis are the Caraonas of Marco Polo?
    They are distinct from the surrounding Baluchis, and pay no tribute.”—H. C.]'
