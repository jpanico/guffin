GCn1By0vf:
  uid: GCn1By0vf
  id: 12395
  string: 'Note 2.—I have adopted in the text for the name of the country that one
    of the several forms in the G. Text which comes nearest to the correct name, viz.
    Badascian. But Balacian also appears both in that and in Pauthier’s text. This
    represents Balakhshán, a form also sometimes used in the East. Hayton has Balaxcen,
    Clavijo Balaxia, the Catalan Map Baldassia. From the form Balakhsh the Balas Ruby
    got its name. As Ibn Batuta says: “The Mountains of Badakhshan have given their
    name to the Badakhshi Ruby, vulgarly called Al Balaksh.” Albertus Magnus says
    the Balagius is the female of the Carbuncle or Ruby Proper, “and some say it is
    his house, and hath thereby got the name, quasi Palatium Carbunculi!” The Balais
    or Balas Ruby is, like the Spinel, a kind inferior to the real Ruby of Ava. The
    author of the Masálak al Absár says the finest Balas ever seen in the Arab countries
    was one presented to Malek ’Adil Ketboga, at Damascus; it was of a triangular
    form and weighed 50 drachms. The prices of Balasci in Europe in that age may be
    found in Pegolotti, but the needful problems are hard to solve. “No sapphire in
    Inde, no Rubie rich of price, There lacked than, nor Emeraud so grene, Balès,
    Turkès, ne thing to my device.” (Chaucer, ‘Court of Love.’) “L’altra letizia,
    che m’era già nota, Preclara cosa mi si fece in vista, Qual fin balascio in che
    lo Sol percuoto.” (Paradiso, ix. 67.)'
