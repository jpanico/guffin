ucshJ6TST:
  uid: ucshJ6TST
  id: 12517
  string: Note 4.—Nayan was no “uncle” of Kúblái’s, but a cousin in a junior generation.
    For Kúblái was the grandson of Chinghiz, and Nayan was the great-great-grandson
    of Chinghiz’s brother Uchegin, called in the Chinese annals Pilgutai. [Belgutai
    was Chinghiz’s step-brother. (Palladius.) —H. C.] On this brother, the great-uncle
    of Kúblái, and the commander of the latter’s forces against Arikbuga in the beginning
    of the reign, both Chinghiz and Kúblái had bestowed large territories in Eastern
    Tartary towards the frontier of Corea, and north of Liaotong towards the Manchu
    country. [“The situation and limits of his appanage are not clearly defined in
    history. According to Belgutai’s biography, it was between the Onon and Kerulen
    (Yuen shi), and according to Shin Yao’s researches (Lo fung low wen kao), at the
    confluence of the Argun and Shilka. Finally, according to Harabadur’s biography,
    it was situated in Abalahu, which geographically and etymologically corresponds
    to modern Butkha (Yuen shi); Abalahu, as Kúblái himself said, was rich in fish;
    indeed, after the suppression of Nayan’s rebellion, the governor of that country
    used to send to the Peking Court fishes weighing up to a thousand Chinese pounds
    (kin.). It was evidently a country near the Amur River.” (Palladius, l.c. 31.)—H.
    C.] Nayan had added to his inherited territory, and become very powerful. [“History
    has apparently connected Nayan’s appanage with that of Hatan (a grandson of Hachiun,
    brother of Chinghiz Khan), whose ordo was contiguous to Nayan’s, on the left bank
    of the Amur, hypothetically east of Blagovietschensk, on the spot, where still
    the traces of an ancient city can be seen. Nayan’s possessions stretched south
    to Kwang-ning, which belonged to his appanage, and it was from this town that
    he had the title of prince of Kwang-ning (Yuen shi).” (Palladius, l.c. 31.)—H.
    C.] Kaidu had gained influence over Nayan, and persuaded him to rise against Kúblái.
    A number of the other Mongol princes took part with him. Kúblái was much disquieted
    at the rumours, and sent his great lieutenant Bayan to reconnoitre. Bayan was
    nearly captured, but escaped to court and reported to his master the great armament
    that Nayan was preparing. Kúblái succeeded by diplomacy in detaching some of the
    princes from the enterprise, and resolved to march in person to the scene of action,
    whilst despatching Bayan to the Karakorum frontier to intercept Kaidu. This was
    in the summer of 1287. What followed will be found in a subsequent note (ch. iv.
    note 6). (For Nayan’s descent, see the Genealogical Table in the Appendix (A).)
