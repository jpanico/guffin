J9J6AIJ_P:
  uid: J9J6AIJ_P
  id: 12197
  string: 'The London prices of Chermisi and Baldacchini in the early part of the
    15th century will be found in Uzzano’s work, but they are hard to elucidate. Babylon,
    of which Baghdad was the representative, was famous for its variegated textures
    in very early days. We do not know the nature of the goodly Babylonish garment
    which tempted Achan in Jericho, but Josephus speaks of the affluence of rich stuffs
    carried in the triumph of Titus, “gorgeous with life-like designs from the Babylonian
    loom,” and he also describes the memorable Veil of the Temple as a πέπλος Βαβυλώνιος
    of varied colours marvellously wrought. Pliny says King Attalus invented the intertexture
    of cloth with gold; but the weaving of damasks of a variety of colours was perfected
    at Babylon, and thence they were called Babylonian. The brocades wrought with
    figures of animals in gold, of which Marco speaks, are still a spécialité at Benares,
    where they are known by the name of Shikárgáh or hunting-grounds, which is nearly
    a translation of the name Thard-wahsh “beast-hunts,” by which they were known
    to the mediæval Saracens. (See Q. Makrizi, IV. 69–70.) Plautus speaks of such
    patterns in carpets, the produce of Alexandria—“Alexandrina belluata conchyliata
    tapetia.” Athenaeus speaks of Persian carpets of like description at an extravagant
    entertainment given by Antiochus Epiphanes; and the same author cites a banquet
    given in Persia by Alexander, at which there figured costly curtains embroidered
    with animals. In the 4th century Asterius, Bishop of Amasia in Pontus, rebukes
    the Christians who indulge in such attire: “You find upon them lions, panthers,
    bears, huntsmen, woods, and rocks; whilst the more devout display Christ and His
    disciples, with the stories of His miracles,” etc. And Sidonius alludes to upholstery
    of like character: “Peregrina det supellex * * * * Ubi torvus, et per artem Resupina
    flexus ora, It equo reditque telo Simulacra bestiarum Fugiens fugansque Parthus.”
    (Epist. ix. 13.)'
