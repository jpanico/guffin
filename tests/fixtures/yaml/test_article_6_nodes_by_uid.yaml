t0c4q5FAN:
  uid: t0c4q5FAN
  id: 12672
  string: Now there was on that spot in old times a great and noble city called Cambaluc,
    which is as much as to say in our tongue “The city of the Emperor.”{1} But the
    Great Kaan was informed by his Astrologers that this city would prove rebellious,
    and raise great disorders against his imperial authority. So he caused the present
    city to be built close beside the old one, with only a river between them.{2}
    And he caused the people of the old city to be removed to the new town that he
    had founded; and this is called Taidu. [However, he allowed a portion of the people
    which he did not suspect to remain in the old city, because the new one could
    not hold the whole of them, big as it is.]
