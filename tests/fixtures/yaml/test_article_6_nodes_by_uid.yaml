  string: Hallward got up from the seat and walked up and down the garden. After some
    time he came back. “Harry,” he said, “Dorian Gray is to me simply a motive in
    art. You might see nothing in him. I see everything in him. He is never more present
    in my work than when no image of him is there. He is a suggestion, as I have said,
    of a new manner. I find him in the curves of certain lines, in the loveliness
    and subtleties of certain colours. That is all.”
