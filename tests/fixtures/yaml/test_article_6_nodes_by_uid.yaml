A9Norxk2a:
  uid: A9Norxk2a
  id: 12388
  string: 'The mountains of this country also supply Saker falcons of excellent flight,
    and plenty of Lanners likewise. Beasts and birds for the chase there are in great
    abundance. Good wheat is grown, and also barley without husk. They have no olive
    oil, but make oil from sesamé, and also from walnuts.{5} [In the mountains there
    are vast numbers of sheep—400, 500, or 600 in a single flock, and all of them
    wild; and though many of them are taken, they never seem to get aught the scarcer.{6}
    Those mountains are so lofty that ’tis a hard day’s work, from morning till evening,
    to get to the top of them. On getting up, you find an extensive plain, with great
    abundance of grass and trees, and copious springs of pure water running down through
    rocks and ravines. In those brooks are found trout and many other fish of dainty
    kinds; and the air in those regions is so pure, and residence there so healthful,
    that when the men who dwell below in the towns, and in the valleys and plains,
    find themselves attacked by any kind of fever or other ailment that may hap, they
    lose no time in going to the hills; and after abiding there two or three days,
    they quite recover their health through the excellence of that air. And Messer
    Marco said he had proved this by experience: for when in those parts he had been
    ill for about a year, but as soon as he was advised to visit that mountain, he
    did so and got well at once.{7}]'
