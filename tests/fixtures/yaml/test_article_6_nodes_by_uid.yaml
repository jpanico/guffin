xk9a5a8bM:
  uid: xk9a5a8bM
  id: 12171
  string: 'Among the questions that the Jews are said to have put, in order to test
    Mahommed’s prophetic character, was one series: “Who are Gog and Magog? Where
    do they dwell? What sort of rampart did Zu’lḳarnain build between them and men?”
    And in the Koran we find (ch. xviii. The Cavern): “They will question thee, O
    Mahommed, regarding Zu’lḳarnain. Reply: I will tell you his history”—and then
    follows the story of the erection of the Rampart of Yájúj and Májúj. In ch. xxi.
    again there is an allusion to their expected issue at the latter day. This last
    expectation was one of very old date. Thus the Cosmography of Aethicus, a work
    long believed (though erroneously) to have been abridged by St. Jerome, and therefore
    to be as old at least as the 4th century, says that the Turks of the race of Gog
    and Magog, a polluted nation, eating human flesh and feeding on all abominations,
    never washing, and never using wine, salt, nor wheat, shall come forth in the
    Day of Antichrist from where they lie shut up behind the Caspian Gates, and make
    horrid devastation. No wonder that the irruption of the Tartars into Europe, heard
    of at first with almost as much astonishment as such an event would produce now,
    was connected with this prophetic legend![1] The Emperor Frederic II., writing
    to Henry III. of England, says of the Tartars: “’Tis said they are descended from
    the Ten Tribes who abandoned the Law of Moses, and worshipped the Golden Calf.
    They are the people whom Alexander Magnus shut up in the Caspian Mountains.” [See
    the chapter Gog et Magog dans le roman en alexandrins, in Paul Meyer’s Alexandre
    le Grand dans la Littérature française, Paris, 1886, II. pp. 386–389.—H. C.]:
    “Gos et Margos i vienent de la tiere des Turs Et .cccc. m. hommes amenerent u
    plus, Il en jurent la mer dont sire est Neptunus Et le porte d’infier que garde
    Cerberus Que l’orguel d’Alixandre torneront a reüs Por çou les enclot puis es
    estres desus. Dusc’ al tans Antecrist n’en istera mais nus.”'
