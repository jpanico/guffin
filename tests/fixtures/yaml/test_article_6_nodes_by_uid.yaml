QqSawZNiQ:
  uid: QqSawZNiQ
  id: 12622
  string: Hammer gives regulations of Ghazan Khan’s on the subject of the Paizah,
    from which it is seen that the latter were of different kinds as well as degrees.
    Some were held by great governors and officers of state, and these were cautioned
    against letting the Paizah out of their own keeping; others were for officers
    of inferior order; and, again, “for persons travelling on state commissions with
    post-horses, particular paizah (which Hammer says were of brass) are appointed,
    on which their names are inscribed.” These last would seem therefore to be merely
    such permissions to travel by the Government post-horses as are still required
    in Russia, perhaps in lineal derivation from Mongol practice. The terms of Ghazan’s
    decree and other contemporary notices show that great abuses were practised with
    the Paizah, as an authority for living at free quarters and making other arbitrary
    exactions. The word Paizah is said to be Chinese, Pai-tseu, “a tablet.” A trace
    of the name and the thing still survives in Mongolia. The horse-Bai is the name
    applied to a certain ornament on the horse caparison, which gives the rider a
    title to be furnished with horses and provisions on a journey.
