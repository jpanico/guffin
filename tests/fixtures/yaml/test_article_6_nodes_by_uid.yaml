-k00SRaFO:
  uid: -k00SRaFO
  id: 12719
  string: 'And thus, as I have related, is celebrated the joyous feast of the Kaan’s
    birthday.{4} Now I will tell you of another festival which the Kaan holds at the
    New Year, and which is called the White Feast. Note 1.—The Chinese Year commences,
    according to Duhalde, with the New Moon nearest to the Sun’s Passage of the middle
    point of Aquarius; according to Pauthier, with the New Moon immediately preceding
    the Sun’s entry into Pisces. (These would almost always be identical, but not
    always.) Generally speaking, the first month will include part of February and
    part of March. The eighth month will then be September–October (v. ante, ch. ii.
    note 2). [According to Dr. S. W. Williams (Middle Kingdom, II. p. 70): “The year
    is lunar, but its commencement is regulated by the sun. New Year falls on the
    first new moon after the sun enters Aquarius, which makes it come not before January
    21st nor after February 19th.” “The beginning of the civil year, writes Peter
    Hoang (Chinese Calendar, p. 13), depends upon the good pleasure of the Emperors.
    Under the Emperor Hwang-ti (2697 b.c.) and under the Hsia Dynasty (2205 b.c.),
    it was made to commence with the 3rd month yin-yüeh [Pisces]; under the Shang
    Dynasty (1766 b.c.) with the 2nd month ch’ou-yüeh [Aquarius], and under the Chou
    Dynasty (1122 b.c.) with the 1st month tzu-yüeh [Capricorn].”—H. C.]'
