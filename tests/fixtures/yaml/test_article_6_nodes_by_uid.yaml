AWHGsLkFB:
  uid: AWHGsLkFB
  id: 12345
  string: The name Formosa is probably only Rusticiano’s misunderstanding of Harmuza,
    aided, perhaps, by Polo’s picture of the beauty of the plain. We have the same
    change in the old Mafomet for Mahomet, and the converse one in the Spanish hermosa
    for formosa. Teixeira’s Chronicle says that the city of Hormuz was founded by
    Xa Mahamed Dranku, i.e. Shah Mahomed Dirhem-Ko, in “a plain of the same name.”
    The statement in Ramusio that Hormuz stood upon an island, is, I doubt not, an
    interpolation by himself or some earlier transcriber. When the ships of Nearchus
    launched again from the mouth of the Anamis, their first day’s run carried them
    past a certain desert and bushy island to another which was large and inhabited.
    The desert isle was called Organa; the large one by which they anchored Oaracta.
    (Indica, 37.) Neither name is quite lost; the latter greater island is Kishm or
    Brakht; the former Jerún,[2] perhaps in old Persian Gerún or Gerán, now again
    desert though no longer bushy, after having been for three centuries the site
    of a city which became a poetic type of wealth and splendour. An Eastern saying
    ran, “Were the world a ring, Hormuz would be the jewel in it.” [“The Yüan shi
    mentions several seaports of the Indian Ocean as carrying on trade with China;
    Hormuz is not spoken of there. I may, however, quote from the Yüan History a curious
    statement which perhaps refers to this port. In ch. cxxiii., biography of Arsz-lan,
    it is recorded that his grandson Hurdutai, by order of Kubilai Khan, accompanied
    Bu-lo no-yen on his mission to the country of Ha-rh-ma-sz. This latter name may
    be intended for Hormuz. I do not think that by the Noyen Bulo, M. Polo could be
    meant, for the title Noyen would hardly have been applied to him. But Rashid-eddin
    mentions a distinguished Mongol, by name Pulad, with whom he was acquainted in
    Persia, and who furnished him with much information regarding the history of the
    Mongols. This may be the Bu-lo no-yen of the Yüan History.” (Bretschneider, Med.
    Res. II. p. 132.)—H. C.]
