9MFeNpuVz:
  uid: 9MFeNpuVz
  id: 12247
  string: Baron de Bode have visited other parts, but the country is still very imperfectly
    known. Little Lúristán lay west of the R. Dizfúl, extending nearly to the Plain
    of Babylonia. Its Dynasty, called Kurshid, [was founded in 1184 by the Kurd Shodja
    ed-din Khurshid, and existed till Shah-Werdy lost his throne in 1593.—H. C.].
    The Lúrs are akin to the Kurds, and speak a Kurd dialect, as do all those Ilyáts,
    or nomads of Persia, who are not of Turkish race. They were noted in the Middle
    Ages for their agility and their dexterity in thieving. The tribes of Little Lúr
    “do not affect the slightest veneration for Mahomed or the Koran; their only general
    object of worship is their great Saint Baba Buzurg,” and particular disciples
    regard with reverence little short of adoration holy men looked on as living representatives
    of the Divinity. (Ilchan. I. 70 seqq.; Rawlinson in J. R. G. S. IX.; Layard in
    Do. XVI. 75, 94; Ld. Strangford in J. R. A. S. XX. 64; N. et E. XIII. i. 330,
    I. B. II. 31; D’Ohsson, IV. 171–172.) IV. Shúlistán, best represented by Ramusio’s
    Suolstan, whilst the old French texts have Cielstan (i.e. Shelstán); the name
    applied to the country of the Shúls, or Shauls, a people who long occupied a part
    of Lúristán, but were expelled by the Lúrs in the 12th century, and settled in
    the country between Shíráz and Khuzistán (now that of the Mamaseni, whom Colonel
    Pelly’s information identifies with the Shúls), their central points being Naobanján
    and the fortress called Kala’ Safed or “White Castle.” Ibn Batuta, going from
    Shiraz to Kazerun, encamped the first day in the country of the Shúls, “a Persian
    desert tribe which includes some pious persons.” (Q. R. p. 385; N. et E. XIII.
    i. 332–333; Ilch. I. 71; J. R. G. S. XIII. Map; I. B. II. 88.) [“Adjoining the
    Kuhgelus on the East are the tents of the Mamasenni (qy. Mohammed Huseini) Lúrs,
    occupying the country still known as Shúlistán, and extending as far east and
    south-east as Fars and the Plain of Kazerun. This tribe prides itself on its origin,
    claiming to have come from Seistán, and to be directly descended from Rustam,
    whose name is still borne by one of the Mamasenni clans.” (Curzon, Persia, II.
    p. 318.)—H. C.] V. Ispahan? The name is in Ramusio Spaan, showing at least that
    he or some one before him had made this identification. The unusual combination
    ff, i.e. sf, in manuscript would be so like the frequent one ft, i.e. st, that
    the change from Isfan to Istan would be easy. But why Istanit? VI. Shíráz [(Shir
    = milk, or Shir = lion)—H. C.] representing the province of Fars or Persia Proper,
    of which it has been for ages the chief city. [It was founded after the Arab conquest
    in 694 a.d., by Mohammed, son of Yusuf Kekfi. (Curzon, Persia, II. pp. 93–110.)—H.
    C.] The last Dynasty that had reigned in Fars was that of the Salghur Atabegs,
    founded about the middle of the 12th century. Under Abubakr (1226–1260) this kingdom
    attained considerable power, embracing Fars, Kermán, the islands of the Gulf and
    its Arabian shores; and Shíráz then flourished in arts and literature; Abubakr
    was the patron of Saadi. From about 1262, though a Salghurian princess, married
    to a son of Hulaku, had the nominal title of Atabeg, the province of Fars was
    under Mongol administration. (Ilch. passim.)
