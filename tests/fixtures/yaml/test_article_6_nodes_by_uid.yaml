TbcQ8_-Pp:
  uid: TbcQ8_-Pp
  id: 12217
  string: 'And when the appointed day was come, all the Christians got up early, men
    and women, small and great, more than 100,000 persons, and went to church, and
    heard the Holy Mass. And after Mass had been sung, they all went forth together
    in a great procession to the plain in front of the mountain, carrying the precious
    cross before them, loudly singing and greatly weeping as they went. And when they
    arrived at the spot, there they found the Calif with all his Saracen host armed
    to slay them if they would not change their faith; for the Saracens believed not
    in the least that God would grant such favour to the Christians. These latter
    stood indeed in great fear and doubt, but nevertheless they rested their hope
    on their God Jesus Christ. So the Cobler received the Bishop’s benison, and then
    threw himself on his knees before the Holy Cross, and stretched out his hands
    towards Heaven, and made this prayer: “Blessed Lord God Almighty, I pray Thee
    by Thy goodness that Thou wilt grant this grace unto Thy people, insomuch that
    they perish not, nor Thy faith be cast down, nor abused nor flouted. Not that
    I am in the least worthy to prefer such request unto Thee; but for Thy great power
    and mercy I beseech Thee to hear this prayer from me Thy servant full of sin.”
    And when he had ended this his prayer to God the Sovereign Father and Giver of
    all grace, and whilst the Calif and all the Saracens, and other people there,
    were looking on, the mountain rose out of its place and moved to the spot which
    the Calif had pointed out! And when the Calif and all his Saracens beheld, they
    stood amazed at the wonderful miracle that God had wrought for the Christians,
    insomuch that a great number of the Saracens became Christians. And even the Calif
    caused himself to be baptised in the name of the Father and of the Son and of
    the Holy Ghost, Amen, and became a Christian, but in secret. Howbeit, when he
    died they found a little cross hung round his neck; and therefore the Saracens
    would not bury him with the other Califs, but put him in a place apart. The Christians
    exulted greatly at this most holy miracle, and returned to their homes full of
    joy, giving thanks to their Creator for that which He had done.{1}'
