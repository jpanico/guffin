5OuCt3i2H:
  uid: 5OuCt3i2H
  id: 12484
  string: 'Lieutenant-Colonel Gordon (Forsyth’s Mission, p. 231) says also: “Regarding
    the name ‘Pámír,’ the meaning appears to be wilderness—a place depopulated, abandoned,
    waste, yet capable of habitation. I obtained this information on the Great Pámír
    from one of our intelligent guides, who said in explanation—‘In former days, when
    this part was inhabited by Kirghiz, as is shown by the ruins of their villages
    and burial-grounds, the valley was not all called Pámír, as it is now. It was
    known by its village names, as is the country beyond Sirikol, which being now
    occupied by Kirghiz is not known by one name, but partly as Chárling, Bas Robát,
    etc. If deserted it would be Pámír.’” In a note Sir T. D. Forsyth adds that the
    same explanation of the word was given to him at Yangi-Hissar, and that it is
    in fact a Khokandi-Turki word.—H. C.] It would seem, from such notices as have
    been received, that there is not, strictly speaking, one steppe called Pamir,
    but a variety of Pamirs, which are lofty valleys between ranges of hills, presenting
    luxuriant summer pasture, and with floors more or less flat, but nowhere more
    than 5 or 6 miles in width and often much less. [This is quite exact; Mr. E. Delmar
    Morgan writes in the Scottish Geog. Mag. January, 1892, p. 17: “Following the
    terminology of Yule adopted by geographers, and now well established, we have
    (1) Pamir Alichur; (2) Pamir Khurd (or “Little”); (3) Pamir Kalan (or “Great”);
    (4) Pamir Khargosi (“of the hare”); (5) Pamir Sares; (6) Pamir Rang-kul.”—H. C.]'
