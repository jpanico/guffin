0jZ460wWL:
  uid: 0jZ460wWL
  id: 12398
  string: Note 3.—The mines of Lájwurd (whence l’Azur and Lazuli) have been, like
    the Ruby mines, celebrated for ages. They lie in the Upper Valley of the Kokcha,
    called Korán, within the Tract called Yamgán, of which the popular etymology is
    Hamah-Kán, or “All-Mines,” and were visited by Wood in 1838. The produce now is
    said to be of very inferior quality, and in quantity from 30 to 60 poods (36 lbs
    each) annually. The best quality sells at Bokhara at 30 to 60 tillas, or 12l.
    to 24l. the pood (Manphul). Surely it is ominous when a British agent writing
    of Badakhshan products finds it natural to express weights in Russian poods! The
    Yamgán Tract also contains mines of iron, lead, alum, salammoniac, sulphur, ochre,
    and copper. The last are not worked. But I do not learn of any silver mines nearer
    than those of Paryán in the Valley of Panjshir, south of the crest of the Hindu-Kúsh,
    much worked in the early Middle Ages. (See Cathay, p. 595.)
