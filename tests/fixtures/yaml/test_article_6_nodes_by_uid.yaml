  string: Yakut (✛1229), stating that this mountainous country is famed for its precious
    stones, and especially rubies, called Balakhsh.” (Bretschneider, Med. Res. II.
    p. 66.)—H. C.] The account of the royal monopoly in working the mines, etc., has
    continued accurate down to our own day. When Murad Beg of Kunduz conquered Badakhshan
    some forty years ago, in disgust at the small produce of the mines, he abandoned
    working them, and sold nearly all the population of the place into slavery! They
    continue still unworked, unless clandestinely. In 1866 the reigning Mír had one
    of them opened at the request of Pandit Manphul, but without much result. The
    locality of the mines is on the right bank of the Oxus, in the district of Ish
    Káshm and on the borders of Shignan, the Syghinan of the text. (P. Manph.; Wood,
    206; N. Ann. des. V. xxvi. 300.) [The ruby mines are really in the Gháran country,
    which extends along both banks of the Oxus. Barshar is one of the deserted villages;
    the boundary between Gháran and Shignán is the Kuguz Parin (in Shighai dialect
    means “holes in the rock”); the Persian equivalent is “Rafak-i-Somakh.” (Cf. Captain
    Trotter, Forsyth’s Mission, p. 277.)—H. C.]
