yBXShA3po:
  uid: yBXShA3po
  id: 12245
  string: 'In this country there are many cruel and murderous people, so that no day
    passes but there is some homicide among them. Were it not for the Government,
    which is that of the Tartars of the Levant, they would do great mischief to merchants;
    and indeed, maugre the Government, they often succeed in doing such mischief.
    Unless merchants be well armed they run the risk of being murdered, or at least
    robbed of everything; and it sometimes happens that a whole party perishes in
    this way when not on their guard. The people are all Saracens, i.e. followers
    of the Law of Mahommet.{3} In the cities there are traders and artizans who live
    by their labour and crafts, weaving cloths of gold, and silk stuffs of sundry
    kinds. They have plenty of cotton produced in the country; and abundance of wheat,
    barley, millet, panick, and wine, with fruits of all kinds. [Some one may say,
    “But the Saracens don’t drink wine, which is prohibited by their law.” The answer
    is that they gloss their text in this way, that if the wine be boiled, so that
    a part is dissipated and the rest becomes sweet, they may drink without breach
    of the commandment; for it is then no longer called wine, the name being changed
    with the change of flavour.{4}] Note 1.—The following appear to be Polo’s Eight
    Kingdoms:— I. Kazvín; then a flourishing city, though I know not why he calls
    it a kingdom. Persian ’Irák, or the northern portion thereof, seems intended.
    Previous to Hulaku’s invasion Kazvín seems to have been in the hands of the Ismailites
    or Assassins. II. Kurdistan. I do not understand the difficulties of Marsden,
    followed by Lazari and Pauthier, which lead them to put forth that Kurdistan is
    not Kurdistan but something else. The boundaries of Kurdistan according to Hamd
    Allah were Arabian ’Irák, Khuzistán, Persian ’Irák, Azerbaijan and Diarbekr. (Dict.
    de la P. 480.) [Cf. Curzon, Persia pass.—H. C.] Persian Kurdistan, in modern as
    in mediæval times, extends south beyond Kermanshah to the immediate border of
    Polo’s next kingdom, viz.:'
