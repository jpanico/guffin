    term “beaten gold,” though Dr. Rock in another passage refers it to a custom which
    he alleges of sewing goldsmith’s work upon robes. (Fr. Michel, Recherches, II.
    389, also I. 371; Rock’s Catalogue, pp. xxv. xxix. xxxviii. cvi.)
