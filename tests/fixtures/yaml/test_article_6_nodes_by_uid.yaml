9Ys5bSAIh:
  uid: 9Ys5bSAIh
  id: 12296
  string: 'A letter from Agassiz, printed in the Proc. As. Soc. Bengal (1865), refers
    to wild “zebus,” and calls the species a small one. There is no wild “zebu,” and
    some of the breeds are of enormous size. [“White oxen, with short thick horns
    and a round hump between the shoulders, are now very rare between Kermán and Bender
    ’Abbás. They are, however, still to be found towards Belúchistán and Mekrán, and
    they kneel to be loaded like camels. The sheep which I saw had fine large tails;
    I did not, however, hear of any having so high a weight as thirty pounds.” (HoutumSchindler,
    l.c. p. 493.)—H. C.] The fat-tailed sheep is well known in many parts of Asia
    and part of Africa. It is mentioned by Ctesias, and by Ælian, who says the shepherds
    used to extract the tallow from the live animal, sewing up the tail again; exactly
    the same story is told by the Chinese Pliny, Ma Twan-lin. Marco’s statements as
    to size do not surpass those of the admirable Kämpfer: “In size they so much surpass
    the common sheep that it is not unusual to see them as tall as a donkey, whilst
    all are much more than three feet; and as to the tail I shall not exceed the truth,
    though I may exceed belief, if I say that it sometimes reaches 40 lbs. in weight.”
    Captain Hutton was assured by an Afghan sheep-master that tails had occurred in
    his flocks weighing 12 Tabriz mans, upwards of 76 lbs.! The Afghans use the fat
    as an aperient, swallowing a dose of 4 to 6 lbs! Captain Hutton’s friend testified
    that trucks to bear the sheep-tails were sometimes used among the Taimúnis (north
    of Herat). This may help to locate that ancient and slippery story. Josafat Barbaro
    says he had seen the thing, but is vague as to place. (Ælian Nat. An. III. 3,
    IV. 32; Amoen. Exoticae; Ferrier, H. of Afghans, p. 294; J. A. S. B. XV. 160.)'
