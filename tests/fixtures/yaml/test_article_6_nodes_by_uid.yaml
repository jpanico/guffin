  string: The word has generally been interpreted bluish-grey, but in the passage
    just quoted, Fr.-Michel explains it by brillans. However, the evidence for noirs
    here seems strongest. Rashiduddin says that when Kúblái was born Chinghiz expressed
    surprise at the child’s being so brown, as its father and all his other sons were
    fair. Indeed, we are told that the descendants of Yesugai (the father of Chinghiz)
    were in general distinguished by blue eyes and reddish hair. (Michel’s Joinville,
    p. 324; D’Ohsson, II. 475; Erdmann, 252.)
