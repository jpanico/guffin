  id: 12098
  string: Note 2.—The language of the envoys seems rather to imply that they were
    the Great Kaan’s own people returning from the Court of Hulaku. And Rashid mentions
    that Sartak, the Kaan’s ambassador to Hulaku, returned from Persia in the year
    that the latter prince died. It may have been his party that the Venetians joined,
    for the year almost certainly was the same, viz. 1265. If so, another of the party
    was Bayan, afterwards the greatest of Kublai’s captains, and much celebrated in
    the sequel of this book. (See Erdmann’s Temudschin, p. 214.) Marsden justly notes
    that Marco habitually speaks of Latins, never of Franks. Yet I suspect his own
    mental expression was Farangi. 11
