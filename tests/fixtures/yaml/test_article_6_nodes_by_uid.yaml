KCN2HndAD:
  uid: KCN2HndAD
  id: 12236
  string: And when the Three Kings beheld this marvel they were sore amazed, and it
    greatly repented them that they had cast away the stone; for well they then perceived
    that it had a great and holy meaning. So they took of that fire, and carried it
    into their own country, and placed it in a rich and beautiful church. And there
    the people keep it continually burning, and worship it as a god, and all the sacrifices
    they offer are kindled with that fire. And if ever the fire becomes extinct they
    go to other cities round about where the same faith is held, and obtain of that
    fire from them, and carry it to the church. And this is the reason why the people
    of this country worship fire. They will often go ten days’ journey to get of that
    fire.{2} Such then was the story told by the people of that Castle to Messer Marco
    Polo; they declared to him for a truth that such was their history, and that one
    of the three kings was of the city called Saba, and the second of Ava, and the
    third of that very Castle where they still worship fire, with the people of all
    the country round about.{3} Having related this story, I will now tell you of
    the different provinces of Persia, and their peculiarities.
