r2dpLG9oZ:
  uid: r2dpLG9oZ
  id: 12199
  string: 'Note 5.—[Bretschneider (Med. Res. I. p. 114) says: “Hulagu left Karakorum,
    the residence of his brother, on the 2nd May, 1253, and returned to his ordo,
    in order to organize his army. On the 19th October of the same year, all being
    ready, he started for the west.” He arrived at Samarkand in September, 1255. For
    this chapter and the following of Polo, see: Hulagu’s Expedition to Western Asia,
    after the Mohammedan Authors, pp. 112–122, and the Translation of the Si Shi Ki
    (Ch’ang Te), pp. 122–156, in Bretschneider’s Mediæval Researches, I.—H. C.] Note
    6.—[“Hulagu proceeded to the lake of Ormia (Urmia), when he ordered a castle to
    be built on the island of Tala, in the middle of the lake, for the purpose of
    depositing here the immense treasures captured at Baghdad. A great part of the
    booty, however, had been sent to Mangu Khan.” (Hulagu’s Exp., Bretschneider, Med.
    Res. I. p. 120.) Ch’ang Te says (Si Shi Ki, p. 139): “The palace of the Ha-li-fa
    was built of fragrant and precious woods. The walls of it were constructed of
    black and white jade. It is impossible to imagine the quantity of gold and precious
    stones found there.”—H. C.]'
