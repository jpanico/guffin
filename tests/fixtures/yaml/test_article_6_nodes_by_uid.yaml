Xgly0LOgl:
  uid: Xgly0LOgl
  id: 12190
  string: Note 3.—We see here that mosolin or muslin had a very different meaning
    from what it has now. A quotation from Ives by Marsden shows it to have been applied
    in the middle of last century to a strong cotton cloth made at Mosul. Dozy says
    the Arabs use Mauçili in the sense of muslin, and refers to passages in ‘The Arabian
    Nights.’ [Bretschneider (Med. Res. II. p. 122) observes “that in the narrative
    of Ch’ang Ch’un’s travels to the west in 1221, it is stated that in Samarkand
    the men of the lower classes and the priests wrap their heads about with a piece
    of white mo-sze. There can be no doubt that mo-sze here denotes ‘muslin,’ and
    the Chinese author seems to understand by this term the same material which we
    are now used to call muslin.”—H. C.] I have found no elucidation of Polo’s application
    of mosolini to a class of merchants. But, in a letter of Pope Innocent IV. (1244)
    to the Dominicans in Palestine, we find classed as different bodies of Oriental
    Christians, “Jacobitae, Nestoritae, Georgiani, Graeci, Armeni, Maronitae, et Mosolini.”
    (Le Quien, III. 1342.) Note 4.—“The Curds,” says Ricold, “exceed in malignant
    ferocity all the barbarous nations that I have seen.... They are called Curti,
    not because they are curt in stature, but from the Persian word for Wolves....
    They have three principal vices, viz., Murder, Robbery, and Treachery.” Some say
    they have not mended since, but his etymology is doubtful. Kúrt is Turkish for
    a wolf, not Persian, which is Gurg; but the name (Karduchi, Kordiaei, etc.) is
    older, I imagine, than the Turkish language in that part of Asia. Quatremère refers
    it to the Persian gurd, “strong, valiant, hero.” As regards the statement that
    some of the Kurds were Christians, Mas’udi states that the Jacobites and certain
    other Christians in the territory of Mosul and Mount Judi were reckoned among
    the Kurds. (Not. et Ext. XIII. i. 304.) [The Kurds of Mosul are in part nomadic
    and are called Kotcheres, but the greater number are sedentary and cultivate cereals,
    cotton, tobacco, and fruits. (Cuinet.) Old Kurdistan had Shehrizor (Kerkuk, in
    the sanjak of that name) as its capital.— H. C.]
