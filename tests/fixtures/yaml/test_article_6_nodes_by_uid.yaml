iA9v_0ZbK:
  uid: iA9v_0ZbK
  id: 12495
  string: In leaving Badashan you ride twelve days between east and north-east, ascending
    a river that runs through land belonging to a brother of the Prince of Badashan,
    and containing a good many towns and villages and scattered habitations. The people
    are Mahommetans, and valiant in war. At the end of those twelve days you come
    to a province of no great size, extending indeed no more than three days’ journey
    in any direction, and this is called Vokhan. The people worship Mahommet, and
    they have a peculiar language. They are gallant soldiers, and they have a chief
    whom they call None, which is as much as to say Count, and they are liegemen to
    the Prince of Badashan.{1}
