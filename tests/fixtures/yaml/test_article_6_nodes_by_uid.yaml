WePDYlF3-:
  uid: WePDYlF3-
  id: 12295
  string: Note 2.—Abbott mentions the humped (though small) oxen in this part of Persia,
    and that in some of the neighbouring districts they are taught to kneel to receive
    the load, an accomplishment which seems to have struck Mas’udi (III. 27), who
    says he saw it exhibited by oxen at Rai (near modern Tehran). The Aín Akbari also
    ascribes it to a very fine breed in Bengal. The whimsical name Zebu, given to
    the humped or Indian ox in books of Zoology, was taken by Buffon from the exhibitors
    of such a beast at a French Fair, who probably invented it. That the humped breeds
    of oxen existed in this part of Asia in ancient times is shown by sculptures at
    Kouyunjik. (See cut below.)
