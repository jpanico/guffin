  id: 12650
  string: Between the two walls of the enclosure which I have described, there are
    fine parks and beautiful trees bearing a variety of fruits. There are beasts also
    of sundry kinds, such as white stags and fallow deer, gazelles and roebucks, and
    fine squirrels of various sorts, with numbers also of the animal that gives the
    musk, and all manner of other beautiful creatures, {10} insomuch that the whole
    place is full of them, and no spot remains void except where there is traffic
    of people going and coming. [The parks are covered with abundant grass; and the
    roads through them being all paved and raised two cubits above the surface, they
    never become muddy, nor does the rain lodge on them, but flows off into the meadows,
    quickening the soil and producing that abundance of herbage.]
