JRKK4tzAV:
  uid: JRKK4tzAV
  id: 12332
  string: '1. From Kermán to the caravanserai of Deh Bakri in the pass so called.
    “The ground as I ascended became covered with snow, and the weather bitterly cold”
    (Report) . . . 2. Two miles over very deep snow brought him to the top of the
    pass; he then descended 14 miles to his halt. Two miles to the south of the crest
    he passed a second caravanserai: “The two are evidently built so near one another
    to afford shelter to travellers who may be unable to cross the ridge during heavy
    snow-storms.” The next march continued the descent for 14 miles, and then carried
    him 10 miles along the banks of the Rudkhanah-i-Shor. The approximate height of
    the pass above the sea is estimated at 8000 feet. We have thus for the descent
    the greater part of . . . 3. “Clumps of date-palms growing near the village showed
    that I had now reached a totally different climate.” (Smith’s Report.) And Mr.
    Abbott says of the same region: “Partly wooded ... and with thickets of reeds
    abounding with francolin and Jirufti partridge.... The lands yield grain, millet,
    pulse, French- and horse-beans, rice, cotton, henna, Palma Christi, and dates,
    and in part are of great fertility.... Rainy season from'
