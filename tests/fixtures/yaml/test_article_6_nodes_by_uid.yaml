X-pmrTONW:
  uid: X-pmrTONW
  id: 12723
  string: 'Something like the changes of costume here spoken of is mentioned by Rubruquis
    at a great festival of four days’ duration at the court of Mangku Kaan: “Each
    day of the four they appeared in different raiment, suits of which were given
    them for each day of a different colour, but everything on the same day of one
    colour, from the boots to the turban.” So also Carpini says regarding the assemblies
    of the Mongol nobles at the inauguration of Kuyuk Kaan: “The first day they were
    all clad in white pourpre (? albis purpuris, see Bk. I. ch. vi. note 4), the second
    day in ruby pourpre, the third day in blue pourpre, the fourth day in the finest
    baudekins.” (Cathay, 141; Rubr. 368; Pl. Car. 755.) [Mr. Rockhill (Rubruck, p.
    247, note) makes the following remarks: “Odoric, however, says that the colours
    differed according to the rank. The custom of presenting khilats is still observed
    in Central Asia and Persia. I cannot learn from any other authority that the Mongols
    ever wore turbans. Odoric says the Mongols of the imperial feasts wore ‘coronets’
    (in capite coronati).”— H. C.]'
