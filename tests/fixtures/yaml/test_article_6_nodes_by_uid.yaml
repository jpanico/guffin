  id: 12253
  string: '[1] The Encyc. Britann., article “Money,” gives the livre tournois of this
    period as 18.17 francs. A French paper in Notes and Queries (4th S. IV. 485) gives
    it under St. Lewis and Philip III. as equivalent to 18.24 fr., and under Philip
    IV. to 17.95. And lastly, experiment at the British Museum, made by the kind intervention
    of my friend, Mr. E. Thomas, F.R.S., gave the weights of the sols of St. Lewis
    (1226–1270) and Philip IV. (1285–1314) respectively as 63 grains and 61½ grains
    of remarkably pure silver. These trials would give the livres (20 sols) as equivalent
    to 18.14 fr. and 17.70 fr. respectively.'
