iHUTkW7zz:
  uid: iHUTkW7zz
  id: 13004
  string: “Harry,” said Basil Hallward, looking him straight in the face, “every portrait
    that is painted with feeling is a portrait of the artist, not of the sitter. The
    sitter is merely the accident, the occasion. It is not he who is revealed by the
    painter; it is rather the painter who, on the coloured canvas, reveals himself.
    The reason I will not exhibit this picture is that I am afraid that I have shown
    in it the secret of my own soul.”
  order: 26
