lhL1QJTXU:
  uid: lhL1QJTXU
  id: 12447
  string: Note 1.—I apprehend that in this chapter Marco represents Buddhism (which
    is to be understood by his expression Idolatry, not always, but usually) as in
    a position of greater life and prosperity than we can believe it to have enjoyed
    in Káshmir at the end of the 13th century, and I suppose that his knowledge of
    it was derived in great part from tales of the Mongol and Tibetan Buddhists about
    its past glories. I know not if the spelling Kesciemur represents any peculiar
    Mongol pronunciation of the name. Plano Carpini, probably the first modern European
    to mention this celebrated region, calls it Casmir (p. 708).
