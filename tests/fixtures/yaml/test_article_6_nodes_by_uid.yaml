wVuAR5ZWY:
  uid: wVuAR5ZWY
  id: 12342
  string: '[Major Sykes (Geog. Journal, 1902, p. 130) heard of robbers, some five
    miles from Mináb, and he adds: “However, nothing happened, and after crossing
    the Gardan-i-Pichal, we camped at Birinti, which is situated just above the junction
    of Rudkhána Duzdi, or ‘River of Theft,’ and forms part of the district of Rudán,
    in Fars.” “The Jíruft and Rúdbár plains belong to the germsír (hot region), dates,
    pistachios, and konars (apples of Paradise) abound in them. Reobarles is Rúdbár
    or Rüdbáris.” (Houtum-Schindler, l.c. 1881, p. 495.)—H. C.] We have referred to
    Marco’s expressions regarding the great cold experienced on the pass which formed
    the first descent; and it is worthy of note that the title of “The Cold Mountains”
    is applied by Edrisi to these very mountains. Mr. Abbott’s MS. Report also mentions
    in this direction, Sardu, said to be a cold country (as its name seems to express
    [see above,—H. C.]), which its population (Iliyáts) abandon in winter for the
    lower plains. It is but recently that the importance of this range of mountains
    has become known to us. Indeed the existence of the chain, as extending continuously
    from near Kashán, was first indicated by Khanikoff in 1862. More recently Major
    St. John has shown the magnitude of this range, which rises into summits of 15,000
    feet in altitude, and after a course of 550 miles terminates in a group of volcanic
    hills some 50 miles S.E. of Bamm. Yet practically this chain is ignored on all
    our maps! Marco’s description of the “Plain of Formosa” does not apply, now at
    least, to the whole plain, for towards Bander Abbási it is barren. But to the
    eastward, about Minao, and therefore about Old Hormuz, it has not fallen off.
    Colonel Pelly writes: “The district of Minao is still for those regions singularly
    fertile. Pomegranates, oranges, pistachio-nuts, and various other fruits grow
    in profusion. The source of its fertility is of course the river, and you can
    walk for miles among lanes and cultivated ground, partially sheltered from the
    sun.” And Lieutenant Kempthorne, in his notes on that coast, says of the same
    tract: “It is termed by the natives the Paradise of Persia. It is certainly most
    beautifully fertile, and abounds in orange-groves, and orchards containing apples,
    pears, peaches, and apricots; with vineyards producing a delicious grape, from
    which was at one time made a wine called amber-rosolli”—a name not easy to explain.
    ’Ambar-i-Rasúl, “The Prophet’s Bouquet!” would be too bold a name even for Persia,
    though names more sacred are so profaned at Naples and on the Moselle. Sir H.
    Rawlinson suggests ’Ambar-’asali, “Honey Bouquet,” as possible. When Nearchus
    beached his fleet on the shore of Harmozeia at the mouth of the Anamis (the River
    of Minao), Arrian tells us he found the country a kindly one, and very fruitful
    in every way except that there were no olives. The weary mariners landed and enjoyed
    this pleasant rest from their toils. (Indica, 33; J. R. G. S. V. 274.)'
