LtjlwI_Xz:
  uid: LtjlwI_Xz
  id: 12481
  string: 'Wakhán was restored to geography by Macartney, in the able map which he
    compiled for Elphinstone’s Caubul, and was made known more accurately by Wood’s
    journey through it. [The district of Wakhán “comprises the valleys containing
    the two heads of the Panjah branch of the Oxus, and the valley of the Panjah itself,
    from the junction at Zung down to Ishkashím. The northern branch of the Panjah
    has its principal source in the Lake Victoria in the Great Pamir, which as well
    as the Little Pamir, belongs to Wakhán, the Aktash River forming the well recognized
    boundary between Kashgaria and Wakhán.” (Captain Trotter, Forsyth’s Mission, p.
    275.) The southern branch is the Sarhadd Valley.—H. C.] The lowest part is about
    8000 feet above the sea, and the highest Kishlak, or village, about 11,500. A
    few willows and poplars are the only trees that can stand against the bitter blasts
    that blow down the valley. Wood estimated the total population of the province
    at only 1000 souls, though it might be capable of supporting 5000.[1] He saw it,
    however, in the depth of winter. As to the peculiar language, see note I, ch.
    xxix. It is said to be a very old dialect of Persian. A scanty vocabulary was
    collected by Hayward. (J. R. G. S. XXI. p. 29.) The people, according to Shaw,
    have Aryan features, resembling those of the Kashmiris, but harsher. [Cf. Captain
    Trotter’s The Oxus below Wakhan, Forsyth’s Mission, p. 276.] We appear to see
    in the indications of this paragraph precisely the same system of government that
    now prevails in the Oxus valleys. The central districts of Faizabad and Jerm are
    under the immediate administration of the Mír of Badakhshan, whilst fifteen other
    districts, such as Kishm, Rusták, Zebák, Ishkáshm, Wakhán, are dependencies “held
    by the relations of the Mír, or by hereditary rulers, on a feudal tenure, conditional
    on fidelity and military service in time of need, the holders possessing supreme
    authority in their respective territories, and paying little or no tribute to
    the paramount power.” (Pandit Manphul.) The first part of the valley of which
    Marco speaks as belonging to a brother of the Prince, may correspond to Ishkáshm,
    or perhaps to Vardoj; the second, Wakhán, seems to have had a hereditary ruler;
    but both were vassals of the Prince of Badakhshan, and therefore are styled Counts,
    not kings or Seigneurs. The native title which Marco gives as the equivalent of
    Count is remarkable. Non or None, as it is variously written in the texts, would
    in French form represent Nono in Italian. Pauthier refers this title to the “Rao-nana
    (or nano) Rao” which figures as the style of Kanerkes in the IndoScythic coinage.
    But Wilson (Ariana Antiqua, p. 358) interprets Raonano as most probably a genitive
    plural of Rao, whilst the whole inscription answers precisely to the Greek one
    ΒΑΣΙΛΕΥΣ ΒΑΣΙΛΕΩΝ ΚΑΝΗΡΚΟΥ, which is found on other coins of the same prince.
    General Cunningham, a very competent authority, adheres to this view, and writes:
    “I do not think None or Non can have any connection with the Nana of the coins.”
    It is remarkable, however, that Nono (said to signify “younger,” or lesser) is
    in Tibet the title given to a younger brother, deputy, or subordinate prince.
    In Cunningham’s Ladak (259) we read: “Nono is the usual term of respect which
    is used in addressing any young man of the higher ranks, and when prefixed to
    Kahlon it means the younger or deputy minister.” And again (p. 352): “Nono is
    the title given to a younger brother. Nono Sungnam was the younger brother of
    Chang Raphtan, the Kahlon of Bazgo.” I have recently encountered the word used
    independently, and precisely in Marco’s application of it. An old friend, in speaking
    of a journey that he had made in our Tibetan provinces, said incidentally that
    he had accompanied the commissioner to the installation of a new Nono (I think
    in Spiti). The term here corresponds so precisely with the explanation which Marco
    gives of None as a Count subject to a superior sovereign, that it is difficult
    to regard the coincidence as accidental. The Yuechi or Indo-Scyths who long ruled
    the Oxus countries are said to have been of Tibetan origin, and Al-Biruni repeats
    a report that this was so. (Elliot. II. 9.)[2] Can this title have been a trace
    of their rule? Or is it Indian?'
