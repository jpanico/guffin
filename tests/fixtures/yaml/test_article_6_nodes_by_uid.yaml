  string: Keshimur also is a Province inhabited by a people who are Idolaters and
    have a language of their own.{1} They have an astonishing acquaintance with the
    devilries of enchantment; insomuch that they make their idols to speak. They can
    also by their sorceries bring on changes of weather and produce darkness, and
    do a number of things so extraordinary that no one without seeing them would believe
    them.{2} Indeed, this country is the very original source from which Idolatry
    has spread abroad.{3} In this direction you can proceed further till you come
    to the Sea of India.
