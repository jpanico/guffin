T-KT5WlpA:
  uid: T-KT5WlpA
  id: 12709
  string: And when the Great Kaan sits at table on any great court occasion, it is
    in this fashion. His table is elevated a good deal above the others, and he sits
    at the north end of the hall, looking towards the south, with his chief wife beside
    him on the left. On his right sit his sons and his nephews, and other kinsmen
    of the Blood Imperial, but lower, so that their heads are on a level with the
    Emperor’s feet. And then the other Barons sit at other tables lower still. So
    also with the women; for all the wives of the Lord’s sons, and of his nephews
    and other kinsmen, sit at the lower table to his right; and below them again the
    ladies of the other Barons and Knights, each in the place assigned by the Lord’s
    orders. The tables are so disposed that the Emperor can see the whole of them
    from end to end, many as they are.{1} [Further, you are not to suppose that everybody
    sits at table; on the contrary, the greater part of the soldiers and their officers
    sit at their meal in the hall on the carpets.] Outside the hall will be found
    more than 40,000 people; for there is a great concourse of folk bringing presents
    to the Lord, or come from foreign countries with curiosities.
