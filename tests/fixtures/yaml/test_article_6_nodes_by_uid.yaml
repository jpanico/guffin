h4mHiKeQf:
  uid: h4mHiKeQf
  id: 12706
  string: 381 guard by turns; a corps on tour of duty. Keshik is one of the archaisms
    of the Mongol language, for now this word has another meaning in Mongol. Colonel
    Yule has brought together several explanations of the term. It seems to me that
    among his suppositions the following is the most consistent with the ancient meaning
    of the word:— “We find Kishik still used at the court of Hindustan, under the
    great kings of Timur’s House, for the corps on tour of duty at the palace....
    The royal guards in Persia, who watch the King’s person at night, are termed Keshikchi.”
    “The Keshikten was divided into a day-watch called Turgaut and a night-watch Kebteul.
    The Kebte-ul consisted of pure Mongols, whilst the Turgaut was composed of the
    sons of the vassal princes and governors of the provinces, and of hostages. The
    watch of the Khan was changed every three days, and contained 400 men. In 1330
    it was reduced to 100 men.” (Palladius, 42–43.) Mr. E. H. Parker writes in the
    China Review, XVIII. p. 262, that they “are evidently the ‘body guards’ of the
    modern viceroys, now pronounced Kashïha, but, evidently, originally Kêshigha.”—
    H. C.]
