Ovs3Xbxg0:
  uid: Ovs3Xbxg0
  id: 12624
  string: Where I have used the Venetian term saggio, the French texts have here and
    elsewhere saics and saies, and sometimes pois. Saic points to saiga, which, according
    to Dupré de St. Maur, is in the Salic laws the equivalent of a denier or the twelfth
    part of a sol. Saggio is possibly the same word, or rather may have been confounded
    with it, but the saggio was a recognised Venetian weight equal to ⅙ of an ounce.
    We shall see hereafter that Polo appears to use it to indicate the misḳál, a weight
    which may be taken at 74 grains Troy. On that supposition the smallest tablet
    specified in the text would weigh 18½ ozs. Troy.
