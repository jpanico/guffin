inW4lJ2gT:
  uid: inW4lJ2gT
  id: 13042
  string: “Days in summer, Basil, are apt to linger,” murmured Lord Henry. “Perhaps
    you will tire sooner than he will. It is a sad thing to think of, but there is
    no doubt that genius lasts longer than beauty. That accounts for the fact that
    we all take such pains to overeducate ourselves. In the wild struggle for existence,
    we want to have something that endures, and so we fill our minds with rubbish
    and facts, in the silly hope of keeping our place. The thoroughly well-informed
    man⁠—that is the modern ideal. And the mind of the thoroughly well-informed man
    is a dreadful thing. It is like a bric-a-brac shop, all monsters and dust, with
    everything priced above its proper value. I think you will tire first, all the
    same. Some day you will look at your friend, and he will seem to you to be a little
    out of drawing, or you won’t like his tone of colour, or something. You will bitterly
    reproach him in your own heart, and seriously think that he has behaved very badly
    to you. The next time he calls, you will be perfectly cold and indifferent. It
    will be a great pity, for it will alter you. What you have told me is quite a
    romance, a romance of art one might call it, and the worst of having a romance
    of any kind is that it leaves one so unromantic.”
  order: 64
