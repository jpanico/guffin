8cpd4BAfL:
  uid: 8cpd4BAfL
  id: 12581
  string: 'Note 3.—This passage, and the extract from Ramusio’s version attached to
    the following chapter, contain the only allusions by Marco to Jews in China. John
    of Monte Corvino alludes to them, and so does Marignolli, who speaks of having
    held disputations with them at Cambaluc; Ibn Batuta also speaks of them at Khansa
    or Hangchau. Much has been written about the ancient settlement of Jews at Kaifungfu,
    in Honan. One of the most interesting papers on the subject is in the Chinese
    Repository, vol. xx. It gives the translation of a Chinese-Jewish Inscription,
    which in some respects forms a singular parallel to the celebrated Christian Inscription
    of Si-ngan fu, though it is of far more modern date (1511). It exhibits, as that
    inscription does, the effect of Chinese temperament or language, in modifying
    or diluting doctrinal statements. Here is a passage: “With respect to the Israelitish
    religion, we find on inquiry that its first ancestor, Adam, came originally from
    India, and that during the (period of the) Chau State the Sacred Writings were
    already in existence. The Sacred Writings, embodying Eternal Reason, consist of
    53 sections. The principles therein contained are very abstruse, and the Eternal
    Reason therein revealed is very mysterious, being treated with the same veneration
    as Heaven. The founder of the religion is Abraham, who is considered the first
    teacher of it. Then came Moses, who established the Law, and handed down the Sacred
    Writings. After his time, during the Han Dynasty (b.c. 206 to a.d. 221), this
    religion entered China. In (a.d.) 1164, a synagogue was built at P’ien. In (a.d.)
    1296, the old Temple was rebuilt, as a place in which the Sacred Writings might
    be deposited with veneration.”'
