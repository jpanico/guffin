t5T98lcjv:
  uid: t5T98lcjv
  id: 12268
  string: 'Note 1.—Kermán is mentioned by Ptolemy, and also by Ammianus amongst the
    cities of the country so called (Carmania): “inter quas nitet Carmana omnium mater.”
    (XXIII. 6.) M. Pauthier’s supposition that Sirján was in Polo’s time the capital,
    is incorrect. (See N. et E. XIV. 208, 290.) Our Author’s Kermán is the city still
    so called; and its proper name would seem to have been Kuwáshír. (See Reinaud,
    Mém. sur l’Inde, 171; also Sprenger P. and R. R. 77.) According to Khanikoff it
    is 5535 feet above the sea.'
