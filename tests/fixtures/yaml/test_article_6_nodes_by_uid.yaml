wFSbgQId3:
  uid: wFSbgQId3
  id: 12647
  string: You must know that for three months of the year, to wit December, January,
    and February, the Great Kaan resides in the capital city of Cathay, which is called
    Cambaluc, [and which is at the north-eastern extremity of the country]. In that
    city stands his great Palace, and now I will tell you what it is like. It is enclosed
    all round by a great wall forming a square, each side of which is a mile in length;
    that is to say, the whole compass thereof is four miles. This you may depend on;
    it is also very thick, and a good ten paces in height, whitewashed and loop-holed
    all round.{1} At each angle of the wall there is a very fine and rich palace in
    which the war-harness of the Emperor is kept, such as bows and quivers,{2} saddles
    and bridles, and bowstrings, and everything needful for an army. Also midway between
    every two of these Corner Palaces there is another of the like; so that taking
    the whole compass of the enclosure you find eight vast Palaces stored with the
    Great Lord’s harness of war.{3} And you must understand that each Palace is assigned
    to only one kind of article; thus one is stored with bows, a second with saddles,
    a third with bridles, and so on in succession right round.{4} The great wall has
    five gates on its southern face, the middle one being the great gate which is
    never opened on any occasion except when the Great Kaan himself goes forth or
    enters. Close on either side of this great gate is a smaller one by which all
    other people pass; and then towards each angle is another great gate, also open
    to people in general; so that on that side there are five gates in all.{5}
