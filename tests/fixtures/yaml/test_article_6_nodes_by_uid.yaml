4XR3sR72m:
  uid: 4XR3sR72m
  id: 12269
  string: Kermán, on the fall of the Beni Búya Dynasty, in the middle of the 11th
    century, came into the hands of a branch of the Seljukian Turks, who retained
    it till the conquests of the Kings of Khwarizm, which just preceded the Mongol
    invasion. In 1226 the Amir Borák, a Kara Khitaian, who was governor on behalf
    of Jaláluddin of Khwarizm, became independent under the title of Kutlugh Sultan.
    [He died in 1234.] The Mongols allowed this family to retain the immediate authority,
    and at the time when Polo returned from China the representative of the house
    was a lady known as the Pádishah Khátún [who reigned from 1291], the wife successively
    of the Ilkhans Abaka and Kaikhatu; an ambitious, clever, and masterful woman,
    who put her own brother Siyurgutmish to death as a rival, and was herself, after
    the decease of Kaikhatu, put to death by her brother’s widow and daughter [1294].
    The Dynasty continued, nominally at least, to the reign of the Ilkhan Khodabanda
    (1304–13), when it was extinguished. [See Major Sykes’ Persia, chaps, v. and xxiii.]
    Kermán was a Nestorian see, under the Metropolitan of Fars. (Ilch. passim; Weil,
    III. 454; Lequien, II. 1256.) [“There is some confusion with regard to the names
    of Kermán both as a town and as a province or kingdom. We have the names Kermán,
    Kuwáshír, Bardshír. I should say the original name of the whole country was Kermán,
    the ancient Karamania. A province of this was called Kúreh-iArdeshír, which, being
    contracted, became Kuwáshír, and is spoken of as the province in which Ardeshír
    Bábekán, the first Sassanian monarch, resided. A part of Kúreh-i-Ardeshír was
    called Bardshír, or Bard-i-Ardeshír, now occasionally Bardsír, and the present
    city of Kermán was situated at its north-eastern corner. This town, during the
    Middle Ages, was called Bardshír. On a coin of Qara Arslán Beg, King of Kermán,
    of a.h. 462, Mr. Stanley Lane Poole reads Yazdashír instead of Bardshír. Of Al
    Idrísí’s Yazdashír I see no mention in histories; Bardshír was the capital and
    the place where most of the coins were struck. Yazdashír, if such a place existed,
    can only have been a place of small importance. It is, perhaps, a clerical error
    for Bardshír; without diacritical points, both words are written alike. Later,
    the name of the city became Kermán, the name Bardshír reverting to the district
    lying south-west of it, with its principal place Mashíz. In a similar manner Mashíz
    was often, and is so now, called Bardshír. Another old town sometimes confused
    with Bardshír was Sírján or Shírján, once more important than Bardshír; it is
    spoken of as the capital of Kermán, of Bardshír, and of Sardsír. Its name now
    exists only as that of a district, with principal place S’aídábád. The history
    of Kermán, ’Agd-ul-’Olá, plainly says Bardshír is the capital of Kermán, and from
    the description of Bardshír there is no doubt of its having been the present town
    Kermán. It is strange that Marco Polo does not give the name of the city. In Assemanni’s
    Bibliotheca Orientalis Kuwáshír and Bardashír are mentioned as separate cities,
    the latter being probably the old Mashíz, which as early as a.h. 582 (a.d. 1186)
    is spoken of in the History of Kermán as an important town. The Nestorian bishop
    of the province Kermán, who stood under the Metropolitan of Fars, resided at Hormúz.”
    (Houtum-Schindler, l.c. pp. 491–492.)
