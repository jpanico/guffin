  string: Note 2.—Hammer mentions as what he chooses to call “Grand Priors” under
    the Shaikh or “Grand Master” at Alamút, the chief, in Syria, one in the Kuhistan
    of E. Persia (Tun-o-Kaïn), one in Kumis (the country about Damghan and Bostam),
    and one in ’Irák; he does not speak of any in Kurdistan. Colonel Monteith, however,
    says, though without stating authority or particulars, “There were several divisions
    of them (the Assassins) scattered throughout Syria, Kurdistan (near the Lake of
    Wan), and Asia Minor, but all acknowledging as Imaum or High Priest the Chief
    residing at Alamut.” And it may be noted that Odoric, a generation after Polo,
    puts the Old Man at Millescorte, which looks like Malasgird, north of Lake Van.
    (H. des Assass. p. 104; J. R. G. S. III. 16; Cathay, p. ccxliii.)
