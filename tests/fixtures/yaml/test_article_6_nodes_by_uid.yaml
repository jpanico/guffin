ybIBJ7Ulr:
  uid: ybIBJ7Ulr
  id: 12648
  string: Inside of this wall there is a second, enclosing a space that is somewhat
    greater in length than in breadth. This enclosure also has eight palaces corresponding
    to those of the outer wall, and stored like them with the Lord’s harness of war.
    This wall also hath five gates on the southern face, corresponding to those in
    the outer wall, and hath one gate on each of the other faces, as the outer wall
    hath also. In the middle of the second enclosure is the Lord’s Great Palace, and
    I will tell you what it is like.{6} You must know that it is the greatest Palace
    that ever was. [Towards the north it is in contact with the outer wall, whilst
    towards the south there is a vacant space which the Barons and the soldiers are
    constantly traversing.{7} The Palace itself] hath no upper story, but is all on
    the ground floor, only the basement is raised some ten palms above the surrounding
    soil [and this elevation is retained by a wall of marble raised to the level of
    the pavement, two paces in width and projecting beyond the base of the Palace
    so as to form a kind of terrace-walk, by which people can pass round the building,
    and which is exposed to view, whilst on the outer edge of the wall there is a
    very fine pillared balustrade; and up to this the people are allowed to come].
    The roof is very lofty, and the walls of the Palace are all covered with gold
    and silver. They are also adorned with representations of dragons [sculptured
    and gilt], beasts and birds, knights and idols, and sundry other subjects. And
    on the ceiling too you see nothing but gold and silver and painting. [On each
    of the four sides there is a great marble staircase leading to the top of the
    marble wall, and forming the approach to the Palace.]{8}
