tUOKjGPDW:
  uid: tUOKjGPDW
  id: 12545
  string: 'On the other hand, Nacchera, in Italian, seems always to have retained
    the meaning of kettle-drum, with the slight exception of a local application at
    Siena to a metal circle or triangle struck with a rod. The fact seems to be that
    there is a double origin, for the Arabic dictionaries not only have Naḳḳárah,
    but Naḳír and Náḳúr, “cornu, tuba.” The orchestra of Bibars Bunduḳdári, we are
    told, consisted of 40 pairs of kettle-drums, 4 drums, 4 hautbois, and 20 trumpets
    (Naḳír). (Sir B. Frere; Della Valle, II. 21; Tod’s Rájasthán, I. 328; Joinville,
    p. 83; N. et E. XIV. 129, and following note; Blochmann’s Ain-i-Akbari, pp. 50–51;
    Ducange, by Haenschel, s.v.; Makrizi, I. 173.) [Dozy (Supp. aux Dict. Arabes)
    has ‫[ نّقارة‬naqqārè] “petit tambour ou timbale, bassin de cuivre ou de terre
    recouvert d’une peau tendue,” and “grosses timbales en cuivre portées sur un chameau
    ou un mulet.”—Devic (Dict. Étym.) writes: “Bas Latin, nacara; bas grec, ἀνάχαρα.
    Ce n’est point comme on l’a dit, l’Arabe ‫ نقير‬naqïr ou ‫ ناقور‬náqör, qui signifient
    trompette, clairon, mais le persan ‫نقاره‬, en arabe, ‫ نقارة‬naqāra, timbale.”
    It is to be found also in Abyssinia and south of Gondokoro; it is mentioned in
    the Sedjarat Malayu.'
