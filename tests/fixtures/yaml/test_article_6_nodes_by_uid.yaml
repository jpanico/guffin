EIYjf1AE9:
  uid: EIYjf1AE9
  id: 12645
  string: 'was rickety in constitution; and on the death of the old Kaan (1294) Teimur
    was unanimously named to the Throne, after some opposition from Kambala, which
    was put down by the decided bearing of the great soldier Bayan. (Schmidt, p. 399;
    De Mailla, IX. 424; Gaubil, 203; Wassáf, 46.) [The Rev. W. S. Ament (Marco Polo
    in Cambaluc, p. 106), makes the following remarks regarding this young prince
    (Chimkin): “The historians give good reasons for their regard for Chen Chin. He
    had from early years exhibited great promise and had shown great proficiency in
    the military art, in government, history, mathematics, and the Chinese classics.
    He was well acquainted with the condition and numbers of the inhabitants of Mongolia
    and China, and with the topography and commerce of the Empire (Howorth). He was
    much beloved by all, except by some of his father’s own ministers, whose lives
    were anything but exemplary. That Kúblái had full confidence in his son is shown
    by the fact that he put the collecting of taxes in his hands. The native historians
    represent him as economical in the use of money and wise in the choice of companions.
    He carefully watched the officers in his charge, and would tolerate no extortion
    of the people. After droughts, famines or floods, he would enquire into the condition
    of the people and liberally supply their needs, thus starting them in life again.
    Polo ascribes all these virtues to the Khan himself. Doubtless he possessed them
    in greater or less degree, but father and son were one in all these benevolent
    enterprises.”—H. C.]'
