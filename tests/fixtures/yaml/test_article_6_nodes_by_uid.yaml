nI68JxG2K:
  uid: nI68JxG2K
  id: 13011
  string: '“The story is simply this,” said the painter after some time. “Two months
    ago I went to a crush at Lady Brandon’s. You know we poor artists have to show
    ourselves in society from time to time, just to remind the public that we are
    not savages. With an evening coat and a white tie, as you told me once, anybody,
    even a stockbroker, can gain a reputation for being civilized. Well, after I had
    been in the room about ten minutes, talking to huge overdressed dowagers and tedious
    academicians, I suddenly became conscious that someone was looking at me. I turned
    halfway round and saw Dorian Gray for the first time. When our eyes met, I felt
    that I was growing pale. A curious sensation of terror came over me. I knew that
    I had come face to face with someone whose mere personality was so fascinating
    that, if I allowed it to do so, it would absorb my whole nature, my whole soul,
    my very art itself. I did not want any external influence in my life. You know
    yourself, Harry, how independent I am by nature. I have always been my own master;
    had at least always been so, till I met Dorian Gray. Then⁠—but I don’t know how
    to explain it to you. Something seemed to tell me that I was on the verge of a
    terrible crisis in my life. I had a strange feeling that fate had in store for
    me exquisite joys and exquisite sorrows. I grew afraid and turned to quit the
    room. It was not conscience that made me do so: it was a sort of cowardice. I
    take no credit to myself for trying to escape.”'
  order: 33
  heading: null
