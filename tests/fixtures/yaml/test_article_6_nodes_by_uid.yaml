ck3MF45GB:
  uid: ck3MF45GB
  id: 12252
  string: 'Note 3.—The character of the nomad and semi-nomad tribes of Persia in those
    days—Kurds, Lúrs, Shúls, Karaunahs, etc.—probably deserved all that Polo says,
    and it is not changed now. Take as an example Rawlinson’s account of the Bakhtyáris
    of Luristán: “I believe them to be individually brave, but of a cruel and savage
    character; they pursue their blood feuds with the most inveterate and exterminating
    spirit.... It is proverbial in Persia that the Bakhtiyaris have been compelled
    to forego altogether the reading of the Fatihah or prayer for the dead, for otherwise
    they would have no other occupation. They are also most dextrous and notorious
    thieves.” (J. R. G. S. IX. 105.) Note 4.—The Persians have always been lax in
    regard to the abstinence from wine. According to Athenaeus, Aristotle, in his
    Treatise on Drinking (a work lost, I imagine, to posterity), says, “If the wine
    be moderately boiled it is less apt to intoxicate.” In the preparation of some
    of the sweet wines of the Levant, such as that of Cyprus, the must is boiled,
    but I believe this is not the case generally in the East. Baber notices it as
    a peculiarity among the Kafirs of the Hindu Kush. Tavernier, however, says that
    at Shíráz, besides the wine for which that city was so celebrated, a good deal
    of boiled wine was manufactured, and used among the poor and by travellers. No
    doubt what is meant is the sweet liquor or syrup called Dúsháb, which Della Valle
    says is just the Italian Mostocotto, but better, clearer, and not so mawkish (I.
    689). (Yonge’s Athen. X. 34; Baber, p. 145; Tavernier, Bk. V. ch. xxi.)'
