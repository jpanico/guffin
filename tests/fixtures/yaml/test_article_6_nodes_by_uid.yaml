rSuhodwCG:
  uid: rSuhodwCG
  id: 12294
  string: 'Now that I have told you of those scoundrels and their history, I must
    add the fact that Messer Marco himself was all but caught by their bands in such
    a darkness as that I have told you of; but, as it pleased God, he got off and
    threw himself into a village that was hard by, called Conosalmi. Howbeit he lost
    his whole company except seven persons who escaped along with him. The rest were
    caught, and some of them sold, some put to death.{5} Note 1.—Ramusio has “Adam’s
    apple” for apples of Paradise. This was some kind of Citrus, though Lindley thinks
    it impossible to say precisely what. According to Jacques de Vitry it was a beautiful
    fruit of the Citron kind, in which the bite of human teeth was plainly discernible.
    (Note to Vulgar Errors, II. 211; Bongars, I. 1099.) Mr. Abbott speaks of this
    tract as “the districts (of Kermán) lying towards the South, which are termed
    the Ghermseer or Hot Region, where the temperature of winter resembles that of
    a charming spring, and where the palm, orange, and lemon-tree flourish.” (MS.
    Report; see also J. R. G. S. XXV. 56.) [“Marco Polo’s apples of Paradise are more
    probably the fruits of the Konár tree. There are no plantains in that part of
    the country. Turtle doves, now as then, are plentiful, and as they are seldom
    shot, and are said by the people to be unwholesome food, we can understand Marco
    Polo’s saying that the people do not eat them.” (Houtum-Schindler, l.c. pp. 492–493.)—H.
    C.] The Francolin here spoken of is, as Major Smith tells me, the Darráj of the
    Persians, the Black Partridge of English sportsmen, sometimes called the Red-legged
    Francolin. The Darráj is found in some parts of Egypt, where its peculiar call
    is interpreted by the peasantry into certain Arabic words, meaning “Sweet are
    the corn-ears! Praised be the Lord!” In India, Baber tells us, the call of the
    Black Partridge was (less piously) rendered “Shír dáram shakrak,” “I’ve got milk
    and sugar!” The bird seems to be the ἀτταγὰς of Athenaeus, a fowl “speckled like
    the partridge, but larger,” found in Egypt and Lydia. The Greek version of its
    cry is the best of all: “τρìς τοῖς κακούργοις κακά” (“Threefold ills to the ill-doers!”).
    This is really like the call of the black partridge in India as I recollect it.
    [Tetrao francolinus.—H. C.] (Chrestomathie Arabe, II. 295; Baber, 320; Yonge’s
    Atken. IX. 39.)'
