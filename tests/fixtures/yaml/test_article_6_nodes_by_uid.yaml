2OcoizB28:
  uid: 2OcoizB28
  id: 12346
  string: 'Note 2.—A spirit is still distilled from dates in Persia, Mekran, Sind,
    and some places in the west of India. It is mentioned by Strabo and Dioscorides,
    according to Kämpfer, who says it was in his time made under the name of a medicinal
    stomachic; the rich added Radix Chinae, ambergris, and aromatic spices; the poor,
    liquorice and Persian absinth. (Sir B. Frere; Amoen. Exot. 750; Macd. Kinneir,
    220.) [“The date wine with spices is not now made at Bender ’Abbás. Date arrack,
    however, is occasionally found. At Kermán a sort of wine or arrack is made with
    spices and alcohol, distilled from sugar; it is called Má-ul-Háyát (water of life),
    and is recommended as an aphrodisiac. Grain in the Shamíl plain is harvested in
    April, dates are gathered in August.” (Houtum-Schindler, l.c. p. 496.) See “Remarks
    on the Use of Wine and Distilled Liquors among the Mohammedans of Turkey and Persia,”
    pp. 315–330 of Narrative of a Tour through Armenia, Kurdistan, Persia, and Mesopotamia....
    By the Rev. Horatio Southgate, ... London, 1840, vol. ii.—H. C.] [Sir H. Yule
    quotes, in a MS. note, these lines from Moore’s Light of the Harem: “Wine, too,
    of every clime and hue, Around their liquid lustre threw Amber Rosolli[3]—the
    bright dew From vineyards of the Green Sea gushing.”] See above, p. 114.'
