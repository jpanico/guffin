JndkLSFC-:
  uid: JndkLSFC-
  id: 12308
  string: 'The Magical darkness which Marco ascribes to the evil arts of the Karaunas
    is explained by Khanikoff from the phenomenon of Dry Fog, which he has often experienced
    in Khorasan, combined with the Dust Storm with which we are familiar in Upper
    India. In Sind these phenomena often produce a great degree of darkness. During
    a battle fought between the armies of Sindh and Kachh in 1762, such a fog came
    on, obscuring the light of day for some six hours, during which the armies were
    intermixed with one another and fighting desperately. When the darkness dispersed
    they separated, and the consternation of both parties was so great at the events
    of the day that both made a precipitate retreat. In 1844 this battle was still
    spoken of with wonder. (J. Bomb. Br. R. A. S. I. 423.) Major St. John has given
    a note on his own experience of these curious Kermán fogs (see Ocean Highways,
    1872, p. 286): “Not a breath of air was stirring, and the whole effect was most
    curious, and utterly unlike any other fog I have seen. No deposit of dust followed,
    and the feeling of the air was decidedly damp. I unfortunately could not get my
    hygrometer till the fog had cleared away.” [General Houtum-Schindler, l.c. p.
    493, writes: “The magical darkness might, as Colonel Yule supposes, be explained
    by the curious dry fogs or dust storms, often occurring in the neighbourhood of
    Kermán, but it must be remarked that Marco Polo was caught in one of these storms
    down in Jíruft, where, according to the people I questioned, such storms now never
    occur. On the 29th of September, 1879, at Kermán, a high wind began to blow from
    S.S.W. at about 5 p.m. First there came thick heavy clouds of dust with a few
    drops of rain. The heavy dust then settled down, the lighter particles remained
    in the air, forming a dry fog of such density that large objects, like houses,
    trees, etc., could not even faintly be distinguished at a distance of a hundred
    paces. The barometers suffered no change, the three I had with me remained in
    statu quo.” “The heat is over by the middle of September, and after the autumnal
    equinox, there are a few days of what is best described as a dense dry fog. This
    was undoubtedly the haze referred to by Marco Polo.” (Major Sykes, ch. iv.)—H.
    C.]'
