RUYYZHERS:
  uid: RUYYZHERS
  id: 12251
  string: The livre tournois at this period was equivalent to a little over 18 francs
    of modern French silver. But in bringing the value to our modern gold standard
    we must add one-third, as the ratio of silver to gold was then 1:12 instead of
    1:16. Hence the equivalent in gold of the livre tournois is very little less than
    1l. sterling, and the price of the horse would be about 193l.[1] Mr. Wright quotes
    an ordinance of Philip III. of France (1270–1285) fixing the maximum price that
    might be given for a palfrey at 60 livres tournois, and for a squire’s roncin
    at 20 livres. Joinville, however, speaks of a couple of horses presented to St.
    Lewis in 1254 by the Abbot of Cluny, which he says would at the time of his writing
    (1309) have been worth 500 livres (the pair, it would seem). Hence it may be concluded
    in a general way that the ordinary price of imported horses in India approached
    that of the highest class of horses in Europe. (Hist. of Dom. Manners, p. 317;
    Joinville, p. 205.) About 1850 a very fair Arab could be purchased in Bombay for
    60l., or even less; but prices are much higher now. With regard to the donkeys,
    according to Tavernier, the fine ones used by merchants in Persia were imported
    from Arabia. The mark of silver was equivalent to about 44s. of our silver money,
    and allowing as before for the lower relative value of gold, 30 marks would be
    equivalent to 88l. sterling. Kisi or Kish we have already heard of. Curmosa is
    Hormuz, of which we shall hear more. With a Pisan, as Rusticiano was, the sound
    of c is purely and strongly aspirate. Giovanni d’Empoli, in the beginning of the
    16th century, another Tuscan, also calls it Cormus. (See Archiv. Stor. Ital. Append.
    III. 81.)
