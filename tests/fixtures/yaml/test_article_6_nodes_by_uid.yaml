N2YuIgMDN:
  uid: N2YuIgMDN
  id: 12619
  string: 'So we will have done with this matter of Nayan, and go on with our account
    of the great state of the Great Kaan. We have already told you of his lineage
    and of his age; but now I must tell you what he did after his return, in regard
    to those barons who had behaved well in the battle. Him who was before captain
    of 100 he made captain of 1000; and him who was captain of 1000 men he made to
    be captain of 10,000, advancing every man according to his deserts and to his
    previous rank. Besides that, he also made them presents of fine silver plate and
    other rich appointments; gave them Tablets of Authority of a higher degree than
    they held before; and bestowed upon them fine jewels of gold and silver, and pearls
    and precious stones; insomuch that the amount that fell to each of them was something
    astonishing. And yet ’twas not so much as they had deserved; for never were men
    seen who did such feats of arms for the love and honour of their Lord, as these
    had done on that day of the battle.{1} Now those Tablets of Authority, of which
    I have spoken, are ordered in this way. The officer who is a captain of 100 hath
    a tablet of silver; the captain of 1000 hath a tablet of gold or silver-gilt;
    the commander of 10,000 hath a tablet of gold, with a lion’s head on it. And I
    will tell you the weight of the different tablets, and what they denote. The tablets
    of the captains of 100 and 1000 weigh each of them 120 saggi; and the tablet with
    the lion’s head engraven on it, which is that of the commander of 10,000, weighs
    220 saggi. And on each of the tablets is inscribed a device, which runs: “By the
    strength of the great God, and of the great grace which He hath accorded to our
    Emperor, may the name of the Kaan be blessed; and let all such as will not obey
    him be slain and be destroyed.” And I will tell you besides that all who hold
    these tablets likewise receive warrants in writing, declaring all their powers
    and privileges.'
