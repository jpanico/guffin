HVV5x-cix:
  uid: HVV5x-cix
  id: 12271
  string: Note 2.—A MS. treatise on precious stones cited by Ouseley mentions Shebavek
    in Kermán as the site of a Turquoise mine. This is probably Shahr-i-Babek, about
    100 miles west of the city of Kermán, and not far from Párez, where Abbott tells
    us there is a mine of these stones, now abandoned. Goebel, one of Khanikoff’s
    party, found a deposit of turquoises at Taft, near Yezd. (Ouseley’s Travels, I.
    211; J. R. G. S. XXVI. 63–65; Khan. Mém. 203.) [“The province Kermán is still
    rich in turquoises. The mines of Páríz or Párez are at Chemen-imó-aspán, 16 miles
    from Páríz on the road to Bahrámábád (principal place of Rafsinján), and opposite
    the village or garden called Gód-i-Ahmer. These mines were worked up to a few
    years ago; the turquoises were of a pale blue. Other turquoises are found in the
    present Bardshír plain, and not far from Mashíz, on the slopes of the Chehel tan
    mountain, opposite a hill called the Bear Hill (tal-i-Khers). The Shehr-i-Bábek
    turquoise mines are at the small village Kárík, a mile from Medvár-i-Bálá, 10
    miles north of Shehr-i-Bábek. They have two shafts, one of which has lately been
    closed by an earthquake, and were worked up to about twenty years ago. At another
    place, 12 miles from Shehr-i-Bábek, are seven old shafts now not worked for a
    long period. The stones of these mines are also of a very pale blue, and have
    no great value.” (Houtum-Schindler, l.c. 1881, p. 491.) The finest turquoises
    came from Khorasan; the mines were near Maaden, about 48 miles to the north of
    Nishapūr. (Heyd, Com. du Levant, II. p. 653; Ritter, Erdk. pp. 325–330.) It is
    noticeable that Polo does not mention indigo at Kermán.—H. C.]
