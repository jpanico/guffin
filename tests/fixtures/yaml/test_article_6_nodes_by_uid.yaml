IugoKcVLw:
  uid: IugoKcVLw
  id: 12300
  string: Note 4.—This is a knotty subject, and needs a long note. The Ḳaraunahs are
    mentioned often in the histories of the Mongol regime in Persia, first as a Mongol
    tribe forming a Tuman, i.e. a division or corps of 10,000 in the Mongol army (and
    I suspect it was the phrase the Tuman of the Ḳaraunahs in Marco’s mind that suggested
    his repeated use of the number 10,000 in speaking of them); and afterwards as
    daring and savage freebooters, scouring the Persian provinces, and having their
    headquarters on the Eastern frontiers of Persia. They are described as having
    had their original seats on the mountains north of the Chinese wall near Ḳaraún
    Jidun or Khidun; and their special accomplishment in war was the use of Naphtha
    Fire. Rashiduddin mentions the Ḳaránut as a branch of the great Mongol tribe of
    the Kunguráts, who certainly had their seat in the vicinity named, so these may
    possibly be connected with the Ḳaraunahs. The same author says that the Tuman
    of the Ḳaraunahs formed the Injú or peculium of Arghún Khan. Wassáf calls them
    “a kind of goblins rather than human beings, the most daring of all the Mongols”;
    and Mirkhond speaks in like terms. Dr. Bird of Bombay, in discussing some of the
    Indo-Scythic coins which bear the word Korano attached to the prince’s name, asserts
    this to stand for the name of the Ḳaraunah, “who were a Græco-Indo-Scythic tribe
    of robbers in the Punjab, who are mentioned by Marco Polo,” a somewhat hasty conclusion
    which Pauthier adopts. There is, Quatremère observes, no mention of the Ḳaraunahs
    before the Mongol invasion, and this he regards as the great obstacle to any supposition
    of their having been a people previously settled in Persia. Reiske, indeed, with
    no reference to the present subject, quotes a passage from Hamza of Ispahan, a
    writer of the 10th century, in which mention is made of certain troops called
    Ḳaráunahs. But it seems certain that in this and other like cases the real reading
    was Kazáwinah, people of Kazvin. (See Reiske’s Constant. Porphyrog. Bonn. ed.
    II. 674; Gottwaldt’s Hamza Ispahanensis, p. 161; and Quatremère in J. A. sér.
    V. tom. xv. 173.) Ibn Batuta only once mentions the name, saying that Tughlak
    Sháh of Dehli was “one of those Turks called Ḳaráunas who dwell in the mountains
    between Sind and Turkestan.” Hammer has suggested the derivation of the word Carbine
    from Karáwinah (as he writes), and a link in such an etymology is perhaps furnished
    by the fact that in the 16th century the word Carbine was used for some kind of
    irregular horseman.
