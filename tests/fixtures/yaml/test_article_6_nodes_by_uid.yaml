  id: 12000
  string: '**The Oath of the Assassin:** The Old Man would interrogate the youths
    before his court, and they would eagerly testify that they had seen Paradise.
    He would then promise them that if they assassinated his enemies, his angels would
    carry them straight back to the garden—whether they survived the mission or were
    killed in the attempt.'
