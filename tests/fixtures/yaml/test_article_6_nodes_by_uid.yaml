fCIMicK3P:
  uid: fCIMicK3P
  id: 12310
  string: 'Note 5.—The specification that only seven were saved from Marco’s company
    is peculiar to Pauthier’s Text, not appearing in the G. T. Several names compounded
    of Salm or Salmi occur on the dry lands on the borders of Kermán. Edrisi, however
    (I. p. 428), names a place called Ḳanát-ul-Shám as the first march in going from
    Jíruft to Walashjird. Walashjird is, I imagine, represented by Galashkird, Major
    R. Smith’s third march from Jíruft (see my Map of Routes from Kermán to Hormuz);
    and as such an indication agrees with the view taken below of Polo’s route, I
    am strongly disposed to identify Ḳanát-ulShám with his castello or walled village
    of Canosalmi. [“Marco Polo’s Conosalmi, where he was attacked by robbers and lost
    the greater part of his men, is perhaps the ruined town or village Kamasal (Kahn-i-asal
    = the honey canal), near Kahnúji-pancheh and Vakílábád in Jíruft. It lies on the
    direct road between Shehr-i-Daqíánús (Camadi) and the Nevergún Pass. The road
    goes in an almost due southerly direction. The Nevergún Pass accords with Marco
    Polo’s description of it; it is very difficult, on account of the many great blocks
    of sandstone scattered upon it. Its proximity to the Bashakird mountains and Mekrán
    easily accounts for the prevalence of robbers, who infested the place in Marco
    Polo’s time. At the end of the Pass lies the large village Shamíl, with an old
    fort; the distance thence to the site of Hormúz or Bender ’Abbás (lying more to
    the west) is 52 miles, two days’ march. The climate of Bender ’Abbás is very bad,
    strangers speedily fall sick, two of my men died there, all the others were seriously
    ill.” (Houtum-Schindler, l.c. pp. 495–496.) Major Sykes (ch. xxiii.) says: “Two
    marches from Camadi was Kahn-i-Panchur, and a stage beyond it lay the ruins of
    Fariáb or Pariáb, which was once a great city, and was destroyed by a flood, according
    to local legend. It may have been Alexander’s Salmous, as it is about the right
    distance from the coast, and if so, could not have been Marco’s Cono Salmi. Continuing
    on, Galashkird mentioned by Edrisi, is the next stage.”— H. C.] The raids of the
    Mekranis and Biluchis long preceded those of the Karaunas, for they were notable
    even in the time of Mahmud of Ghazni, and they have continued to our own day to
    be prosecuted nearly on the same stage and in the same manner. About 1721, 4000
    horsemen of this description plundered the town of Bander Abbási, whilst Captain
    Alex. Hamilton was in the port; and Abbott, in 1850, found the dread of Bilúch
    robbers to extend almost to the gates of Ispahan. A striking account of the Bilúch
    robbers and their characteristics is given by General Ferrier. (See Hamilton,
    I. 109; J. R. G. S. XXV.; Khanikoff’s Mémoire; Macd. Kinneir, 196; Caravan Journeys,
    p. 437 seq.)'
  order: 18
