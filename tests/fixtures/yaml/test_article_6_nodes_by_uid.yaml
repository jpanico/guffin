YuFNpxA5T:
  uid: YuFNpxA5T
  id: 12646
  string: Note 2.—The Chinese Annals, according to Pauthier and Gaubil, give only
    ten sons to Kúblái, at least by his legitimate wives; Hammer’s Table gives twelve.
    It is very probable that xxii. was an early clerical error in the texts of Polo
    for xii. Dodeci indeed occurs in one MS. (No. 37 of our Appendix F), though not
    one of much weight. Of these legitimate sons Polo mentions, in different parts
    of his work, five by name. The following is the list from Hammer and D’Ohsson,
    with the Chinese forms from Pauthier in parentheses. The seven whose names are
    in capitals had the title of Wang or “King” of particular territories, as M. Pauthier
    has shown from the Chinese Annals, thus confirming Marco’s accuracy on that point.
    I. Jurji or Dorjé (Torchi). II. Chimkin or Chingkim (Yu Tsung, King of Yen, i.e.
    Old Peking). III. Mangalai (Mankola, “King of the Pacified West”), mentioned by
    Polo (infra, ch. xli.) as King of Kenjanfu or Shensi. IV. Numugan (Numukan, “Pacifying
    King of the North”), mentioned by Polo (Bk. IV. ch. ii.) as with King George joint
    leader of the Kaan’s army against Kaidu. V. Kuridai (not in Chinese List). VI.
    Hukaji (Hukochi, “King of Yunnan”), mentioned by Polo (infra, ch. xlix.) as King
    of Carajan. VII. Aghrukji or Ukuruji (Gaoluchi, “King of Siping” or Tibet). VIII.
    Abaji (Gaiyachi?). IX. Kukju or Geukju (Khokhochu, “King of Ning” or Tangut).
    X. Kutuktemur (Hutulu Temurh). XI. Tukan (Thohoan, “King of Chinnan”). His command
    lay on the Tungking frontier, where he came to great grief in 1288, in consequence
    of which he was disgraced. (See Cathay, p. 272.) XII. Temkan (not in Chinese List).
    Gaubil’s Chinese List omits Hutulu Temurh, and introduces a prince called Gantanpouhoa
    as 4th son. M. Pauthier lays great stress on Polo’s intimate knowledge of the
    Imperial affairs (p. 263) because he knew the name of the Hereditary Prince to
    be Teimur; this being, he says, the private name which could not be known until
    after the owner’s death, except by those in the most confidential intimacy. The
    public only then discovered that, like the Irishman’s dog, his real name was Turk,
    though he had always been called Toby! But M. Pauthier’s learning has misled him.
    At least the secret must have been very badly kept, for it was known in Teimur’s
    lifetime not only to Marco, but to Rashiduddin in Persia, and to Hayton in Armenia;
    to say nothing of the circumstance that the name Temur Khaghan is also used during
    that Emperor’s life by Oljaitu Khan of Persia in writing to the King of France
    a letter which M. Pauthier himself republished and commented upon. (See his book,
    p. 780.)
