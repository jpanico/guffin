TCbvFDhkL:
  uid: TCbvFDhkL
  id: 12448
  string: “The Cashmeerians,” says Abu’l Fazl, “have a language of their own, but
    their books are written in the Shanskrit tongue, although the character is sometimes
    Cashmeerian. They write chiefly upon Tooz [birch-bark], which is the bark of a
    tree; it easily divides into leaves, and remains perfect for many years.” (Ayeen
    Akbery, II. 147.) A sketch of Kashmiri Grammar by Mr. Edgeworth will be found
    in vol. x. of the J. A. S. B., and a fuller one by Major Leech in vol. xiii. Other
    contributions on the language are in vol. xxxv. pt. i. p. 233 (Godwin-Austen);
    in vol. xxxix. pt. i. p. 95 (Dr. Elmslie); and in Proceedings for 1866, p. 62,
    seqq. (Sir G. Campbell and Bábú Rájendra Lál Mitra). The language, though in large
    measure of Sanskrit origin, has words and forms that cannot be traced in any other
    Indian vernacular. (Campbell, pp. 67, 68). The character is a modification of
    the Panjáb Nagari.
