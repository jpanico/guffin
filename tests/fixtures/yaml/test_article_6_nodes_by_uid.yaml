k7uEUMoYr:
  uid: k7uEUMoYr
  id: 12088
  string: Bolghar was first captured by the Mongols in 1225. It seems to have perished
    early in the 15th century, after which Kazan practically took its place. Its position
    is still marked by a village called Bolgari, where ruins of Mahomedan character
    remain, and where coins and inscriptions have been found. Coins of the Kings of
    Bolghar, struck in the 10th century, have been described by Fraehn, as well as
    coins of the Mongol period struck at Bolghar. Its latest known coin is of a.h.
    818 (a.d. 1415–16). A history of Bolghar was written in the first half of the
    12th century by Yakub Ibn Noman, Kadhi of the city, but this is not known to be
    extant. Fraehn shows ground for believing the people to have been a mixture of
    Fins, Slavs, and Turks. Nicephorus Gregoras supposes that they took their name
    from the great river on which they dwelt (Βούλγα). [“The ruins [of Bolghar],”
    says Bretschneider, in his Mediæval Researches, published in 1888, vol. ii. p.
    82, “still exist, and have been the subject of learned investigation by several
    Russian scholars. These remains are found on the spot where now the village Uspenskoye,
    called also Bolgarskoye (Bolgari), stands, in the district of Spask, province
    of Kazan. This village is about 4 English miles distant from the Volga, east of
    it, and 83 miles from Kazan.” Part of the Bulgars removed to the Balkans; others
    remained in their native country on the shores of the Azov Sea, and were subjugated
    by the Khazars. At the beginning of the 9th century, they marched northwards to
    the Volga and the Kama, and established the kingdom of Great Bulgaria. Their chief
    city, Bolghar, was on the bank of the Volga, but the river runs now to the west;
    as the Kama also underwent a change in its course, it is possible that formerly
    Bolghar was built at the junction of the two rivers. (Cf. Reclus, Europe russe,
    p. 761.) The Bulgars were converted to Islam in 922. Their country was first invaded
    by the Mongols under Subutai in 1223; this General conquered it in 1236, the capital
    was destroyed the following year, and the country annexed to the kingdom of Kipchak.
    Bolghar was again destroyed in 1391 by Tamerlan. In 1438, Ulugh Mohammed, cousin
    of Toka Timur, younger son of Juji, transformed this country into the khanate
    of Kazan, which survived till 1552. It had probably been the capital of the Golden
    Horde before Sarai.
