7AzRFFeEC:
  uid: 7AzRFFeEC
  id: 12597
  string: And after the Great Kaan had defeated Nayan in the way you have heard, he
    went back to his capital city of Cambaluc and abode there, taking his ease and
    making festivity. And the other Tartar Lord called Caydu was greatly troubled
    when he heard of the defeat and death of Nayan, and held himself in readiness
    for war; but he stood greatly in fear of being handled as Nayan had been.{1}
