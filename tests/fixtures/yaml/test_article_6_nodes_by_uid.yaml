  string: Note 3.—Ungrat, the reading of the Crusca, seems to be that to which the
    others point, and I doubt not that it represents the great Mongol tribe of Ḳungurat,
    which gave more wives than any other to the princes of the house of Chinghiz;
    a conclusion in which I find I have been anticipated by De Mailla or his editor
    (IX. 426). To this tribe (which, according to Vámbéry, took its name from (Turki)
    Kongur-At, “Chestnut Horse”) belonged Burteh Fujin, the favourite wife of Chinghiz
    himself, and mother of his four heirs; to the same tribe belonged the two wives
    of Chagatai, two of Hulaku’s seven wives, one of Mangku Kaan’s, two at least of
    Kúblái’s including the beloved Jamúi Khátún, one at least of Abaka’s, two of Ahmed
    Tigudar’s, two of Arghun’s, and two of Ghazan’s.
