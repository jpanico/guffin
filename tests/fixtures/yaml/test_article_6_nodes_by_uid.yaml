IKdZZCgop:
  uid: IKdZZCgop
  id: 13030
  string: Lord Henry stroked his pointed brown beard and tapped the toe of his patent-leather
    boot with a tasselled ebony cane. “How English you are Basil! That is the second
    time you have made that observation. If one puts forward an idea to a true Englishman⁠—always
    a rash thing to do⁠—he never dreams of considering whether the idea is right or
    wrong. The only thing he considers of any importance is whether one believes it
    oneself. Now, the value of an idea has nothing whatsoever to do with the sincerity
    of the man who expresses it. Indeed, the probabilities are that the more insincere
    the man is, the more purely intellectual will the idea be, as in that case it
    will not be coloured by either his wants, his desires, or his prejudices. However,
    I don’t propose to discuss politics, sociology, or metaphysics with you. I like
    persons better than principles, and I like persons with no principles better than
    anything else in the world. Tell me more about Mr. Dorian Gray. How often do you
    see him?”
