04k1NPUkf:
  uid: 04k1NPUkf
  id: 12400
  string: 'Note 5.—The huskless barley of the text is thus mentioned by Burnes in
    the vicinity of the Hindu-Kúsh: “They rear a barley in this elevated country which
    has no husk, and grows like wheat; but it is barley.” It is not properly huskless,
    but when ripe it bursts the husk and remains so loosely attached as to be dislodged
    from it by a slight shake. It is grown abundantly in Ladak and the adjoining Hill
    States. Moorcroft details six varieties of it cultivated there. The kind mentioned
    by Marco and Burnes is probably that named by Royle Hordeum Ægiceras, and which
    has been sent to England under the name of Tartarian Wheat, though it is a genuine
    barley. Naked barley is mentioned by Galen as grown in Cappadocia; and Matthioli
    speaks of it as grown in France in his day (middle of 16th century). It is also
    known to the Arabs, for they have a name for it—Sult. (Burnes, III. 205; Moorc.
    II. 148 seqq.; Galen, de Aliment. Facult. Lat. ed. 13; Matthioli, Ven. 1585, p.
    420; Eng. Cyc., art. Hordeum.) Sesamé is mentioned by P. Manphul as one of the
    products of Badakhshan; linseed is another, which is also used for oil. Walnut-trees
    abound, but neither he nor Wood mention the oil. We know that walnut oil is largely
    manufactured in Kashmir. (Moorcroft, II. 148.) [See on Saker and Lanner Falcons
    (F. Sakar, Briss.; F. lanarius, Schlegel) the valuable paper by Edouard Blanc,
    Sur l’utilisation des Oiseaux de proie en Asie centrale in Rev. des Sciences natur.
