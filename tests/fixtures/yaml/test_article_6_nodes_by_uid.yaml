_HRlrYpOw:
  uid: _HRlrYpOw
  id: 13016
  string: “And how did Lady Brandon describe this wonderful young man?” asked his
    companion. “I know she goes in for giving a rapid précis of all her guests. I
    remember her bringing me up to a truculent and red-faced old gentleman covered
    all over with orders and ribbons, and hissing into my ear, in a tragic whisper
    which must have been perfectly audible to everybody in the room, the most astounding
    details. I simply fled. I like to find out people for myself. But Lady Brandon
    treats her guests exactly as an auctioneer treats his goods. She either explains
    them entirely away, or tells one everything about them except what one wants to
    know.”
