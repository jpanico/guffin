BZ3DpfPyY:
  uid: BZ3DpfPyY
  id: 12279
  string: 'Note 5.—Parez is famous for its falcons still, and so are the districts
    of Aktár and Sirján. Both Mr. Abbott and Major Smith were entertained with hawking
    by Persian hosts in this neighbourhood. The late Sir O. St. John identifies the
    bird described as the Sháhín (Falco Peregrinator), one variety of which, the Fársi,
    is abundant in the higher mountains of S. Persia. It is now little used in that
    region, the Terlán or goshawk being most valued, but a few are caught and sent
    for sale to the Arabs of Oman. (J. R. G. S. XXV. 50, 63, and Major St. John’s
    Notes.) [“The fine falcons, ‘with red breasts and swift of flight,’ come from
    Páríz. They are, however, very scarce, two or three only being caught every year.
    A well-trained Páríz falcon costs from 30 to 50 tomans (12l. to 20l.), as much
    as a good horse.” (Houtum-Schindler, l.c. p. 491.) Major Sykes, Persia, ch. xxiii.,
    writes: “Marco Polo was evidently a keen sportsman, and his description of the
    Sháhin, as it is termed, cannot be improved upon.” Major Sykes has a list given
    him by a Khán of seven hawks of the province, all black and white, except the
    Sháhin, which has yellow eyes, and is the third in the order of size.—H. C.]'
