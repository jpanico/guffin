kwOHWFSr2:
  uid: kwOHWFSr2
  id: 12227
  string: '28 learn about all kinds of different matters in the countries which he
    visited, in order to be able to tell about them to the Great Kaan.{3} Note 1.—The
    word Emperor stands here for Seigneur. What the four characters acquired by Marco
    were is open to discussion. The Chronicle of the Mongol Emperors rendered by Gaubil
    mentions, as characters used in their Empire, the Uíghúr, the Persian and Arabic,
    that of the Lamas (Tibetan), that of the Niuché, introduced by the Kin Dynasty,
    the Khitán, and the Báshpah character, a syllabic alphabet arranged, on the basis
    of the Tibetan and Sanskrit letters chiefly, by a learned chief Lama socalled,
    under the orders of Kublai, and established by edict in 1269 as the official character.
    Coins bearing this character, and dating from 1308 to 1354, are extant. The forms
    of the Niuché and Khitán were devised in imitation of Chinese writing, but are
    supposed to be syllabic. Of the Khitán but one inscription was known, and no key.
    “The Khitan had two national scripts, the ‘small characters’ (hsiao tzŭ) and the
    ‘large characters’ (ta tzŭ).” S. W. Bushell, Insc. in the Juchen and Allied Scripts,
    Cong. des Orientalistes, Paris, 1897.—Die Sprache und Schrift der Juchen von Dr.
    W. Grube, Leipzig, 1896, from a polyglot MS. dictionary, discovered by Dr. F.
    Hirth and now kept in the Royal Library, Berlin.—H. Y. and H. C. Chinghiz and
    his first successors used the Uíghúr, and sometimes the Chinese character. Of
    the Uíghúr character we give a specimen in Bk. IV. It is of Syriac origin, undoubtedly
    introduced into Eastern Turkestan by the early Nestorian missions, probably in
    the 8th or 9th century. The oldest known example of this character so applied,
    the Kudatku Bilik, a didactic poem in Uíghúr (a branch of Oriental Turkish), dating
    from a.d. 1069, was published by Prof. Vámbéry in 1870. A new edition of the Kudatku
    Bilik was published at St. Petersburg, in 1891, by Dr. W. Radloff. Vámbéry had
    a pleasing illustration of the origin of the Uíghúr character, when he received
    a visit at Pesth from certain Nestorians of Urumia on a begging tour. On being
    shown the original MS. of the Kudatku Bilik, they read the character easily, whilst
    much to their astonishment they could not understand a word of what was written.
    This Uíghúr is the basis of the modern Mongol and Manchu characters. (Cf. E. Bretschneider,
    Mediæval Researches, I. pp. 236, 263.)—H. Y. and H. C. [At the village of Keuyung
    Kwan, 40 miles north of Peking, in the sub-prefecture of Ch’ang Ping, in the Chih-li
    province, the road from Peking to Kalgan runs beyond the pass of Nankau, under
    an archway, a view of which will be found at the end of this volume, on which
    were engraved, in 1345, two large inscriptions in six different languages: Sanskrit,
    Tibetan, Mongol, Báshpah, Uíghúr, Chinese, and a language unknown till recently.
    Mr. Wylie’s kindness enabled Sir Henry Yule to present a specimen of this. (A
    much better facsimile of these inscriptions than Wylie’s having since been published
    by Prince Roland Bonaparte in his valuable Recueil des Documents de l’Époque Mongole,
    this latter is, by permission, here reproduced.) The Chinese and Mongol inscriptions
    have been translated by M. Ed. Chavannes; the Tibetan by M. Sylvain Lévi (Jour.
    Asiat., Sept.–Oct. 1894, pp. 354–373); the Uíghúr, by Prof. W. Radloff (Ibid.
    Nov.–Dec. 1894, pp. 546, 550); the Mongol by Prof. G. Huth. (Ibid. Mars–Avril
    1895, pp. 351–360.) The sixth language was supposed by A. Wylie (J. R. A. S. vol.
    xvii. p. 331, and N.S., vol. v. p. 14) to be Neuchih, Niuché, Niuchen or Juchen.
    M. Devéria has shown that the inscription is written in Si Hia, or the language
    of Tangut, and gave a facsimile of a stone stèle (pei) in this language kept in
    the great Monastery of the Clouds (Ta Yun Ssŭ) at Liangchau in Kansuh, together
    with a translation of the Chinese text, engraved on the reverse side of the slab.
    M. Devéria thinks that this writing was borrowed by the Kings of Tangut from the
    one derived in 920 by the Khitans from the Chinese. (Stèle Si-Hia de Leang-tcheou
    ... J. As., 1898; L’écriture du royaume de Si-Hia ou Tangout, par M. Devéria....
    Ext. des Mém.... présentés à l’Ac. des Ins. et B. Let. 1ère Sér. XI., 1898.) Dr.
    S. W. Bushell in two papers (Inscriptions in the Juchen and Allied Scripts, Actes
    du XI. Congrès des Orientalistes, Paris, 1897, 2nd. sect., pp. 11, 35, and the
    Hsi Hsia Dynasty of Tangut, their Money and their peculiar Script, J. China Br.
    R. A. S., xxx. N.S. No. 2, pp. 142, 160) has also made a special study of the
    same subject. The Si Hia writing was adopted by Yuan Ho in 1036, on which occasion
    he changed the title of his reign to Ta Ch’ing, i.e. “Great Good Fortune.”'
