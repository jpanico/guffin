g9CM7k81s:
  uid: g9CM7k81s
  id: 12282
  string: Kerman is a kingdom which is also properly in Persia, and formerly it had
    a hereditary prince. Since the Tartars conquered the country the rule is no longer
    hereditary, but the Tartar sends to administer whatever lord he pleases.{1} In
    this kingdom are produced the stones called turquoises in great abundance; they
    are found in the mountains, where they are extracted from the rocks.{2} There
    are also plenty of veins of steel and Ondanique.{3} The people are very skilful
    in making harness of war; their saddles, bridles, spurs, swords, bows, quivers,
    and arms of every kind, are very well made indeed according to the fashion of
    those parts. The ladies of the country and their daughters also produce exquisite
    needlework in the embroidery of silk stuffs in different colours, with figures
    of beasts and birds, trees and flowers, and a variety of other patterns. They
    work hangings for the use of noblemen so deftly that they are marvels to see,
    as well as cushions, pillows quilts, and all sorts of things. {4}
