gz_yErmDu:
  uid: gz_yErmDu
  id: 12621
  string: 'These golden bulls of the Mongol Kaans appear to have been originally tokens
    of high favour and honour, though afterwards they became more frequent and conventional.
    They are often spoken of by the Persian historians of the Mongols under the name
    of Páïzah, and sometimes Páïzah Sir-i-Sher, or “Lion’s Head Paizah.” Thus, in
    a firmán of Ghazan Khan, naming a viceroy to his conquests in Syria, the Khan
    confers on the latter “the sword, the august standard, the drum, and the Lion’s
    Head Paizah.” Most frequently the grant of this honour is coupled with Yarlígh;
    “to such an one were granted Yarlígh and Páïzah,” the former word (which is still
    applied in Turkey to the Sultan’s rescripts) denoting the written patent which
    accompanies the grant of the tablet, just as the sovereign’s warrant accompanies
    the badge of a modern Order. Of such written patents also Marco speaks in this
    passage, and as he uttered it, no doubt the familiar words Yarlígh u Páïzah were
    in his mind. The Armenian history of the Orpelians, relating the visit of Prince
    Sempad, brother of King Hayton, to the court of Mangku Kaan, says: “They gave
    him also a P’haiza of gold, i.e. a tablet whereon the name of God is written by
    the Great Kaan himself; and this constitutes the greatest honour known among the
    Mongols. Farther, they drew up for him a sort of patent, which the Mongols call
    Iarlekh,” etc. The Latin version of a grant by Uzbek Khan of Kipchak to the Venetian
    Andrea Zeno, in 1333,[1] ends with the words: “Dedimus baisa et privilegium cum
    bullis rubeis,” where the latter words no doubt represent the Yarlígh al-tamghá,
    the warrant with the red seal or stamp,[2] as it may be seen upon the letter of
    Arghun Khan. (See plate at ch. xvii. of Bk. IV.) So also Janibek, the son of Uzbek,
    in 1344, confers privileges on the Venetians, “eisdem dando baissinum de auro”;
    and again Bardibeg, son, murderer, and successor of Janibeg, in 1358, writes:
    “Avemo dado comandamento [i.e. Yarlíg] cum le bolle rosse, et lo paysam.” Under
    the Persian branch, at least, of the house the degree of honour was indicated
    by the number of lions’ heads upon the plate, which varied from 1 to 5. The Lion
    and Sun, a symbol which survives, or has been revived, in the modern Persian decoration
    so called, formed the emblem of the Sun in Leo, i.e. in highest power. It had
    already been used on the coins of the Seljukian sovereigns of Persia and Iconium;
    it appears on coins of the Mongol Ilkhans Ghazan, Oljaïtu, and Abusaid, and it
    is also found on some of those of Mahomed Uzbek Khan of Kipchak. Seljukian Coin
    with the Lion and Sun.'
