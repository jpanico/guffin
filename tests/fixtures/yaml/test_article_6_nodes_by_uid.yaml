qIIkDOB-x:
  uid: qIIkDOB-x
  id: 12174
  string: Note 4.—The box-wood of the Abkhasian forests was so abundant, and formed
    so important an article of Genoese trade, as to give the name of Chao de Bux (Cavo
    di Bussi) to the bay of Bambor, N.W. of Sukum Kala’, where the traffic was carried
    on. (See Elie de Laprim. 243.) Abulfeda also speaks of the Forest of Box (Shará’
    ul-buḳs) on the shores of the Black Sea, from which box-wood was exported to all
    parts of the world; but his indication of the exact locality is confused. (Reinaud’s
    Abulf. I. 289.) At the present time “Boxwood abounds on the southern coast of
    the Caspian, and large quantities are exported from near Resht to England and
    Russia. It is sent up the Volga to Tsaritzin, from thence by rail to the Don,
    and down that river to the Black Sea, from whence it is shipped to England.” (MS.
    Note, H. Y.) [Cf. V. Helm’s Cultivated Plants, edited by J. S. Stallybrass, Lond.,
    1891, The Box Tree, pp. 176–179.—H. C.]
