xR14qUwGY:
  uid: xR14qUwGY
  id: 12244
  string: The first kingdom is that at the beginning of Persia, and it is called Casvin;
    the second is further to the south, and is called Curdistan; the third is Lor;
    the fourth [Suolstan]; the fifth Istanit; the sixth Serazy; the seventh Soncara;
    the eighth Tunocain, which is at the further extremity of Persia. All these kingdoms
    lie in a southerly direction except one, to wit, Tunocain; that lies towards the
    east, and borders on the (country of the) Arbre Sol.{1} In this country of Persia
    there is a great supply of fine horses; and people take them to India for sale,
    for they are horses of great price, a single one being worth as much of their
    money as is equal to 200 livres Tournois; some will be more, some less, according
    to the quality.{2} Here also are the finest asses in the world, one of them being
    worth full 30 marks of silver, for they are very large and fast, and acquire a
    capital amble. Dealers carry their horses to Kisi and Curmosa, two cities on the
    shores of the Sea of India, and there they meet with merchants who take the horses
    on to India for sale.
