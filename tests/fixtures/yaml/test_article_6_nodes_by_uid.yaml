iSKrnI_9K:
  uid: iSKrnI_9K
  id: 12304
  string: Ḳaraunahs, but had a like character for truculence. Their headquarters were
    about Sijistán, and Quatremère seems disposed to look upon them as a tribe indigenous
    in that quarter. Hammer says they were originally the troops of Prince Nigudar,
    grandson of Chaghatai, and that they were a rabble of all sorts, Mongols, Turkmans,
    Kurds, Shúls, and what not. We hear of their revolts and disorders down to 1319,
    under which date Mirkhond says that there had been one-and-twenty fights with
    them in four years. Again we hear of them in 1336 about Herat, whilst in Baber’s
    time they turn up as Nukdari, fairly established as tribes in the mountainous
    tracts of Karnúd and Ghúr, west of Kabul, and coupled with the Hazáras, who still
    survive both in name and character. “Among both,” says Baber, “there are some
    who speak the Mongol language.” Hazáras and Takdaris (read Nukdaris) again occur
    coupled in the History of Sind. (See Elliot, I. 303–304.) [On the struggle against
    Timur of Toumen, veteran chief of the Nikoudrians (1383–84), see Major David Price’s
    Mahommedan History, London, 1821, vol. iii. pp. 47–49, H. C.] In maps of the 17th
    century, as of Hondius and Blaeuw, we find the mountains north of Kabul termed
    Nochdarizari, in which we cannot miss the combination Nigudar-Hazárah, whencesoever
    it was got. The Hazáras are eminently Mongol in feature to this day, and it is
    very probable that they or some part of them are the descendants of the Ḳaráunahs
    or the Nigudaris, or of both, and that the origination of the bands so called,
    from the scum of the Mongol inundation, is thus in degree confirmed. The Hazáras
    generally are said to speak an old dialect of Persian. But one tribe in Western
    Afghanistan retains both the name of Mongols and a language of which six-sevenths
    (judging from a vocabulary published by Major Leech) appear to be Mongol. Leech
    says, too, that the Hazáras generally are termed Moghals by the Ghilzais. It is
    worthy of notice that Abu’l Fázl, who also mentions the Nukdaris among the nomad
    tribes of Kabul, says the Hazáras were the remains of the Chaghataian army which
    Mangu Kaan sent to the aid of Hulaku, under the command of Nigudar Oghlan. (Not.
    et Ext. XIV. 284; Ilch. I. 284, 309, etc,; Baber, 134, 136, 140; J. As. sér. IV.
    tom. iv. 98; Ayeen Akbery, II. 192–193.)
