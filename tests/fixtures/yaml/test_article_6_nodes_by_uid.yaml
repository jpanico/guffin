CkQY5wrAv:
  uid: CkQY5wrAv
  id: 12486
  string: 'Wood speaks of the numerous wolves in this region. And the great sheep
    is that to which Blyth, in honour of our traveller, has given the name of Ovis
    Poli.[4] A pair of horns, sent by Wood to the Royal Asiatic Society, and of which
    a representation is given above, affords the following dimensions:—Length of one
    horn on the curve, 4 feet 8 inches; round the base 14¼ inches; distance of tips
    apart 3 feet 9 inches. This sheep appears to be the same as the Rass, of which
    Burnes heard that the horns were so big that a man could not lift a pair, and
    that foxes bred in them; also that the carcass formed a load for two horses. Wood
    says that these horns supply shoes for the Kirghiz horses, and also a good substitute
    for stirrup-irons. “We saw numbers of horns strewed about in every direction,
    the spoils of the Kirghiz hunter. Some of these were of an astonishingly large
    size, and belonged to an animal of a species between a goat and a sheep, inhabiting
    the steppes of Pamir. The ends of the horns projecting above the snow often indicated
    the direction of the road; and wherever they were heaped in large quantities and
    disposed in a semicircle, there our escort recognised the site of a Kirghiz summer
    encampment.... We came in sight of a rough-looking building, decked out with the
    horns of the wild sheep, and all but buried amongst the snow. It was a Kirghiz
    burying-ground.” (Pp. 223, 229, 231.) [With reference to Wood’s remark that the
    horns of the Ovis Poli supply shoes for the Kirghiz horses, Mr. Rockhill writes
    to me that a Paris newspaper of 24th November, 1894, observes: “Horn shoes made
    of the horn of sheep are successfully used in Lyons. They are especially adapted
    to horses employed in towns, where the pavements are often slippery. Horses thus
    shod can be driven, it is said, at the most rapid pace over the worst pavement
    without slipping.”'
