EAKXqJmAv:
  uid: EAKXqJmAv
  id: 12494
  string: '[1] “Yet this barren and inaccessible upland, with its scanty handful of
    wild people, finds a place in Eastern history and geography from an early period,
    and has now become the subject of serious correspondence between two great European
    Governments, and its name, for a few weeks at least, a household word in London.
    Indeed, this is a striking accident of the course of modern history. We see the
    Slav and the Englishman—representatives of two great branches of the Aryan race,
    but divided by such vast intervals of space and time from the original common
    starting-point of their migration—thus brought back to the lap of Pamir to which
    so many quivering lines point as the centre of their earliest seats, there by
    common consent to lay down limits to mutual encroachment.” (Quarterly Review,
    April, 1873, p. 548.) [2] Ibn Haukal reckons Wakhán as an Indian country. It is
    a curious coincidence (it can scarcely be more) that Nono in the Garo tongue of
    Eastern Bengal signifies “a younger brother.” (J. A. S. B. XXII. 153, XVIII. 208.)
    [3] According to Colonel Tod, the Hindu bard Chand speaks of “Pamer, chief of
    mountains.” (I. p. 24.) But one may like and respect Colonel Tod without feeling
    able to rely on such quotations of his unconfirmed. [4] Usually written Polii,
    which is nonsense. [5] [“The Tian Shan wild sheep has since been described as
    the Ovis Karelini, a species somewhat smaller than the true Ovis Poli which frequents
    the Pamirs.” (Colonel Gordon, Roof of the World, p. 83, note.)—H. C.]'
