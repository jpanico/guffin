JHZh0W3D_:
  uid: JHZh0W3D_
  id: 12578
  string: Note 2.—Chorcha is the Manchu country, Niuché of the Chinese. (Supra, note
    2, ch. xlvi. Bk. I.) [“Chorcha is Churchin.—Nayan, as vassal of the Mongol khans,
    had the commission to keep in obedience the people of Manchuria (subdued in 1233),
    and to care for the security of the country (Yuen shi); there is no doubt that
    he shared these obligations with his relative Hatan, who stood nearer to the native
    tribes of Manchuria.” (Palladius, 32.)—H. C.] Kauli is properly Corea, probably
    here a district on the frontier thereof, as it is improbable that Nayan had any
    rule over Corea. [“The Corean kingdom proper could not be a part of the prince’s
    appanage. Marco Polo might mean the northern part of Corea, which submitted to
    the Mongols in a.d. 1269, with sixty towns, and which was subordinated entirely
    to the central administration in Liao-yang. As to the southern part of Corea,
    it was left to the king of Corea, who, however, was a vassal of the Mongols.”
    (Palladius, 32.) The king of Corea (Ko rye, Kao-li) was in 1288 Chyoung ryel wang
    (1274–1298); the capital was Syong-to, now Kăi syeng (K’ai-ch’eng).—H. C.]
