    of Mahomed, Sultan of Persia. 1121. The Amir Afdhal, the powerful Wazir of Egypt,
    at Cairo. 1126. Kasim Aksonkor, Prince of Mosul and Aleppo, in the Great Mosque
    at Mosul. 1127. Moyin-uddin, Wazir of Sanjár Shah of Persia. 1129. Amír Billah,
    Khalif of Egypt. 1131. Taj-ul Mulúk Buri, Prince of Damascus. 1134. Shams-ulMulúk,
    son of the preceding. 1135–38. The Khalif Mostarshid, the Khalif Rashíd, and Daùd,
    Seljukian Prince of Azerbaijan. 1149. Raymond, Count of Tripoli. 1191. Kizil Arzlan,
    Prince of Azerbaijan. 1192. Conrad of Montferrat, titular King of Jerusalem; a
    murder which King Richard has been accused of instigating. 1217. Oghulmish, Prince
    of Hamadán.
