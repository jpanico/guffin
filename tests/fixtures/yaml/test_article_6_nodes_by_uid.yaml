z_LsdQDTl:
  uid: z_LsdQDTl
  id: 12281
  string: '[1] A learned friend objects to Johnson’s Hundwáníy = “Indian Steel,” as
    too absolute; some word for steel being wanted. Even if it be so, I observe that
    in three places where Polo uses Ondanique (here, ch. xxi., and ch. xlii.), the
    phrase is always “steel and ondanique.” This looks as if his mental expression
    were Púlád-i-Hundwáni, rendered by an idiom like Virgil’s pocula et aurum. [2]
    Kenrick suggests that the “bright iron” mentioned by Ezekiel among the wares of
    Tyre (ch. xxvii. 19) can hardly have been anything else than Indian Steel, because
    named with cassia and calamus. [3] Literally rendered by Mr. Redhouse: “The Indians
    do well the combining of mixtures of the chemicals with which they (smelt and)
    cast the soft iron, and it becomes Indian (steel), being referred to India (in
    this expression).” [4] In Richardson’s Pers. Dict., by Johnson, we have a word
    Rohan, Rohina (and other forms). “The finest Indian steel, of which the most excellent
    swords are made; also the swords made of that steel.”'
