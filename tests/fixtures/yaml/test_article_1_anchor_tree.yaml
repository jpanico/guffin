- uid: cNW8lmXIM
  id: 11113
  string: '[[>]] [[!INFO]] THIS PAGE IS USED FOR TESTING [GUFFIN](https://github.com/jpanico/guffin)
    – DO NOT REMOVE

    Features:

    - Page is completely self-contained – there are `no Roam embeds` of any kind

    - 3 top-level `headers`, all H1

    - nested `headers` down to H4, via __Augmented Headings__ extension

    - a node, (Ma5KGUH9O) "AI assistant (Claude Opus 4.6):" that has property: BLOCK_HEADING
    = 0, which is not a valid Markdown level. It seems that this can happen when first
    a valid level value (1-6) is assigned, and then the heading level is removed altogether
    through the Roam UI.

    - a single JPEG `image` that **has not** been resized through the Roam UI (illustration
    1.1)

    - a single JPEG `image` that **has** been resized through the Roam UI (illustration
    2.1)

    - this INFO `Callout box`, which contains Roam `page references` '
