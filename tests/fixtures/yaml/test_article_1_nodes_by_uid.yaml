  id: 11938
  string: '**t’s an approximately** 600-year-old mystery that continues to stump scholars,
    cryptographers, physicists, and computer scientists: a roughly 240-page medieval
    codex written in an indecipherable language, brimming with bizarre drawings of
    esoteric plants, naked women, and astrological symbols. Known as the Voynich manuscript,
    it defies classification, much less comprehension.'
