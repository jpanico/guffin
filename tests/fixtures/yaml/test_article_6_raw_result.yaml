- - string: Note 5.—Ramusio here, as in all passages where other texts have Bucherami
      and the like, puts Boccassini, a word which has become obsolete in its turn.
      I see both Bochayrani and Bochasini coupled, in a Genoese fiscal statute of
      1339, quoted by Pardessus. (Lois Maritimes, IV. 456.) Mush and Mardin are in
      very different regions, but as their actual interval is only about 120 miles,
      they may have been under one provincial government. Mush is essentially Armenian,
      and, though the seat of a Pashalik, is now a wretched place. Mardin, on the
      verge of the Mesopotamian Plain, rises in terraces on a lofty hill, and there,
      says Hammer, “Sunnis and Shias, Catholic and Schismatic Armenians, Jacobites,
      Nestorians, Chaldæans, Sun-, Fire-, Calf-, and Devilworshippers dwell one over
      the head of the other.” (Ilchan. I. 191.)
