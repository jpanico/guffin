- - string: 10 thereof.” So they replied that they would be right glad to learn how.
      “In truth,” said the Envoys, “the Great Kaan hath never seen any Latins, and
      he hath a great desire so to do. Wherefore, if ye will keep us company to his
      Court, ye may depend upon it that he will be right glad to see you, and will
      treat you with great honour and liberality; whilst in our company ye shall travel
      with perfect security, and need fear to be molested by nobody.”{2} Note 1.—Hayton
      also calls Bokhara a city of Persia, and I see Vámbéry says that, up till the
      conquest by Chinghiz, Bokhara, Samarkand, Balkh, etc., were considered to belong
      to Persia. (Travels, p. 377.) The first Mongolian governor of Bokhara was Buka
      Bosha. King Barac is Borrak Khan, great-grandson of Chagatai, and sovereign
      of the Ulús of Chagatai, from 1264 to 1270. The Polos, no doubt, reached Bokhara
      before 1264, but Borrak must have been sovereign some time before they left
      it.
