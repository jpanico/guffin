- - string: 'Note 3.—The name is Bascra in the MSS., but this is almost certainly
      the common error of c for t. Basra is still noted for its vast date-groves.
      “The whole country from the confluence of the Euphrates and Tigris to the sea,
      a distance of 30 leagues, is covered with these trees.” (Tav. Bk. II. ch. iii.)
      Note 4.—From Baudas, or Baldac, i.e. Baghdad, certain of these rich silk and
      gold brocades were called Baldachini, or in English Baudekins. From their use
      in the state canopies and umbrellas of Italian dignitaries, the word Baldacchino
      has come to mean a canopy, even when architectural. [Baldekino, baldacchino,
      was at first entirely made of silk, but afterwards silk was mixed (sericum mixtum)
      with cotton or thread. When Hulaku conquered Baghdad part of the tribute was
      to be paid with that kind of stuff. Later on, says Heyd (II. p. 697), it was
      also manufactured in the province of Ahwaz, at Damas and at Cyprus; it was carried
      as far as France and England. Among the articles sent from Baghdad to Okkodai
      Khan, mentioned in the Yüan ch’ao pi shi (made in the 14th century), quoted
      by Bretschneider (Med. Res. II. p. 124), we note: Nakhut (a kind of gold brocade),
      Nachidut (a silk stuff interwoven with gold), Dardas (a stuff embroidered in
      gold). Bretschneider (p. 125) adds: “With respect to nakhut and nachidut, I
      may observe that these words represent the Mongol plural form of nakh and nachetti....
      I may finally mention that in the Yüan shi, ch. lxxviii. (on official dresses),
      a stuff, na-shi-shi, is repeatedly named, and the term is explained there by
      kin kin (gold brocade).”—H. C.] The stuffs called Nasich and Nac are again mentioned
      by our traveller below (ch. lix.). We only know that they were of silk and gold,
      as he implies here, and as Ibn Batuta tells us, who mentions Nakh several times
      and Nasíj once. The latter is also mentioned by Rubruquis (Nasic) as a present
      made to him at the Kaan’s court. And Pegolotti speaks of both nacchi and nacchetti
      of silk and gold, the latter apparently answering to Nasich. Nac, Nacques, Nachiz,
      Nacíz, Nasís, appear in accounts and inventories of the 14th century, French
      and English. (See Dictionnaire des Tissus, II. 199, and Douet d’Arcq, Comptes
      de l’Argenterie des Rois de France, etc., 334.) We find no mention of Nakh or
      Nasíj among the stuffs detailed in the Aín Akbari, so they must have been obsolete
      in the 16th century. [Cf. Heyd, Com. du Levant, II. p. 698; Nacco, nachetto,
      comes from the Arabic nakh (nekh); nassit (nasith) from the Arabic nécidj.—H.
      C.] Quermesis or Cramoisy derived its name from the Kermes insect (Ar. Kirmiz)
      found on Quercus coccifera, now supplanted by cochineal. The stuff so called
      is believed to have been originally a crimson velvet, but apparently, like the
      mediæval Purpura, if not identical with it, it came to indicate a tissue rather
      than a colour. Thus Fr.-Michel quotes velvet of vermeil cramoisy, of violet,
      and of blue cramoisy, and pourpres of a variety of colours, though he says he
      has never met with pourpre blanche. I may, however, point to Plano Carpini (p.
      755), who describes the courtiers at Karakorum as clad in white purpura.'
