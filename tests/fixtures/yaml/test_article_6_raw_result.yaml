- - string: Russian chroniclers speak of an earlier capital of the Bulgarian kingdom,
      Brakhimof, near the mouth of the Kama, destroyed by Andrew, Grand Duke of Rostof
      and Susdal, about 1160; and this may have been the city referred to in the earlier
      Arabic accounts. The fullest of these is by Ibn Fozlán, who accompanied an embassy
      from the Court of Baghdad to Bolghar, in a.d. 921. The King and people had about
      this time been converted to Islam, having previously, as it would seem, professed
      Christianity. Nevertheless, a Mahomedan writer of the 14th century says the
      people had then long renounced Islam for the worship of the Cross. (Not. et
      Extr. XIII. i. 270.)
