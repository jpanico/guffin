- - string: ✛ Sodaya, Soldaia, or Soldachia, called by Orientals Súdák, stands on
      the S.E. coast of the Crimea, west of Kaffa. It had belonged to the Greek Empire,
      and had a considerable Greek population. After the Frank conquest of 1204 it
      apparently fell to Trebizond. It was taken by the Mongols in 1223 for the first
      time, and a second time in 1239, and during that century was the great port
      of intercourse with what is now Russia. At an uncertain date, but about the
      middle of the century, the Venetians established a factory there, which in 1287
      became the seat of a consul. In 1323 we find Pope John XXII. complaining to
      Uzbek Khan of Sarai that the Christians had been ejected from Soldaia and their
      churches turned into mosques. Ibn Batuta, who alludes to this strife, counts
      Sudak as one of the four great ports of the World. The Genoese got Soldaia in
      1365 and built strong defences, still to be seen. Kaffa, with a good anchorage,
      in the 14th century, and later on Tana, took the place of Soldaia as chief emporium
      in South Russia. Some of the Arab Geographers call the Sea of Azov the Sea of
      Sudak.
