- - string: 'Note 2.—The Nestorian Church was at this time and in the preceding centuries
      diffused over Asia to an extent of which little conception is generally entertained,
      having a chain of Bishops and Metropolitans from Jerusalem to Peking. The Church
      derived its name from Nestorius, Patriarch of Constantinople, who was deposed
      by the Council of Ephesus in 431. The chief “point of the Faith” wherein it
      came short, was (at least in its most tangible form) the doctrine that in Our
      Lord there were two Persons, one of the Divine Word, the other of the Man Jesus;
      the former dwelling in the latter as in a Temple, or uniting with the latter
      “as fire with iron.” Nestorin, the term used by Polo, is almost a literal transcript
      of the Arab form Nastúri. A notice of the Metropolitan sees, with a map, will
      be found in Cathay, p. ccxliv. Játhalík, written in our text (from G. T.) Jatolic,
      by Fr. Burchard and Ricold Jaselic, stands for Καθολικóς. No doubt it was originally
      Gáthalík, but altered in pronunciation by the Arabs. The term was applied by
      Nestorians to their Patriarch; among the Jacobites to the Mafrián or Metropolitan.
      The Nestorian Patriarch at this time resided at Baghdad. (Assemani, vol. iii.
      pt. 2; Per. Quat. 91, 127.) The Jacobites, or Jacobins, as they are called by
      writers of that age (Ar. Ya’úbkíy), received their name from Jacob Baradaeus
      or James Zanzale, Bishop of Edessa (so called, Mas’udi says, because he was
      a maker of barda’at or saddle-cloths), who gave a great impulse to their doctrine
      in the 6th century. [At some time between the years 541 and 578, he separated
      from the Church and became a follower of the doctrine of Eutyches.—H. C.] The
      Jacobites then formed an independent Church, which at one time spread over the
      East at least as far as Sístán, where they had a see under the Sassanian Kings.
      Their distinguishing tenet was Monophysitism, viz., that Our Lord had but one
      Nature, the Divine. It was in fact a rebound from Nestorian doctrine, but, as
      might be expected in such a case, there was a vast number of shades of opinion
      among both bodies. The chief locality of the Jacobites was in the districts
      of Mosul, Tekrit, and Jazírah, and their Patriarch was at this time settled
      at the Monastery of St. Matthew, near Mosul, but afterwards, and to the present
      day, at or near Mardin. [They have at present two patriarchates: the Monastery
      of Zapharan near Baghdad and Etchmiadzin.—H. C.] The Armenian, Coptic, Abyssinian,
      and Malabar Churches all hold some shade of the Jacobite doctrine, though the
      first two at least have Patriarchs apart.'
