- - string: 'When that Prince, whose name was Cublay Kaan, Lord of the Tartars all
      over the earth, and of all the kingdoms and provinces and territories of that
      vast quarter of the world, had heard all that the Brothers had to tell him about
      the ways of the Latins, he was greatly pleased, and he took it into his head
      that he would send them on an Embassy to the Pope. So he urgently desired them
      to undertake this mission along with one of his Barons; and they replied that
      they would gladly execute all his commands as those of their Sovereign Lord.
      Then the Prince sent to summon to his presence one of his Barons whose name
      was Cogatal, and desired him to get ready, for it was proposed to send him to
      the Pope along with the Two Brothers. The Baron replied that he would execute
      the Lord’s commands to the best of his ability. After this the Prince caused
      letters from himself to the Pope to be indited in the Tartar tongue,{1} and
      committed them to the Two Brothers and to that Baron of his own, and charged
      them with what he wished them to say to the Pope. Now the contents of the letter
      were to this purport: He begged that the Pope would send as many as an hundred
      persons of our Christian faith; intelligent men, acquainted with the Seven Arts,{2}
      well qualified to enter into controversy, and able clearly to prove by force
      of argument to idolaters and other kinds of folk, that the Law of Christ was
      best, and that all other religions were false and naught; and that if they would
      prove this, he and all under him would become Christians and the Church’s liegemen.
      Finally he charged his Envoys to bring back to him some Oil of the Lamp which
      burns on the Sepulchre of our Lord at Jerusalem.{3}'
