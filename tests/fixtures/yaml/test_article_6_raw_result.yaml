- - string: 'The orders of the Great Kaan are stated to have been published habitually
      in six languages, viz., Mongol, Uíghúr, Arabic, Persian, Tangutan (Si-Hia),
      and Chinese.—H. Y. and H. C. Gházán Khan of Persia is said to have understood
      Mongol, Arabic, Persian, something of Kashmiri, of Tibetan, of Chinese, and
      a little of the Frank tongue (probably French). The annals of the Ming Dynasty,
      which succeeded the Mongols in China, mention the establishment in the 11th
      moon of the 5th year Yong-lo (1407) of the Sse yi kwan, a linguistic office
      for diplomatic purposes. The languages to be studied were Niuché, Mongol, Tibetan,
      Sanskrit, Bokharan (Persian?), Uíghúr, Burmese, and Siamese. To these were added
      by the Manchu Dynasty two languages called Papeh and Pehyih, both dialects of
      the S.W. frontier. (See infra, Bk. II. ch. lvi.–lvii., and notes.) Since 1382,
      however, official interpreters had to translate Mongol texts; they were selected
      among the Academicians, and their service (which was independent of the Sse
      yi kwan when this was created) was under the control of the Han-lin-yuen. There
      may have been similar institutions under the Yuen, but we have no proof of it.
      At all events, such an office could not then be called Sse yi kwan (Sse yi,
      Barbarians from four sides); Niuché (Niuchen) was taught in Yong-lo’s office,
      but not Manchu. The Sse yi kwan must not be confounded with the Hui t’ong kwan,
      the office for the reception of tributary envoys, to which it was annexed in
      1748. (Gaubil, p. 148; Gold. Horde, 184; Ilchan. II. 147; Lockhart in J. R.
      G. S. XXXVI. 152; Koeppen, II. 99; G. Devéria, Hist. du Collège des Interprètes
      de Peking in Mélanges Charles de Harlez, pp. 94–102; MS. Note of Prof. A. Vissière;
      The Tangut Script in the Nan-K’ou Pass, by Dr. S. W. Bushell, China Review,
      xxiv. II. pp. 65–68.)—H. Y. and H. C. Pauthier supposes Mark’s four acquisitions
      to have been Báshpah-Mongol, Arabic, Uighúr, and Chinese. I entirely reject
      the Chinese. Sir H. Yule adds: “We shall see no reason to believe that he knew
      either language or character” [Chinese]. The blunders Polo made in saying that
      the name of the city, Suju, signifies in our tongue “Earth” and Kinsay “Heaven”
      show he did not know the Chinese characters, but we read in Bk. II. ch. lxviii.:
      “And Messer Marco Polo himself, of whom this Book speaks, did govern this city
      (Yanju) for three full years, by the order of the Great Kaan.” It seems to me
      [H. C.] hardly possible that Marco could have for three years been governor
      of so important and so Chinese a city as Yangchau, in the heart of the Empire,
      without acquiring a knowledge of the spoken language.—H. C. The other three
      languages seem highly probable. The fourth may have been Tibetan. But it is
      more likely that he counted separately two varieties of the same character (e.g.
      of the Arabic and Persian) as two “lettres de leur escriptures.”—H. Y. and H.
      C.'
