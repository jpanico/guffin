- - string: Note 5.—The great River Tigeri or Tigris is the Volga, as Pauthier rightly
      shows. It receives the same name from the Monk Pascal of Vittoria in 1338. (Cathay,
      p. 234.) Perhaps this arose out of some legend that the Tigris was a reappearance
      of the same river. The ecclesiastical historian, Nicephorus Callistus, appears
      to imply that the Tigris coming from Paradise flows under the Caspian to emerge
      in Kurdistan. (See IX. 19.) The “17 days” applies to one stretch of desert.
      The whole journey from Ukek Bokhara would take some 60 days at least. Ibn Batuta
      is 58 days from Sarai to Bokhara, and of the last section he says, “we entered
      the desert which extends between Khwarizm and Bokhara, and which has an extent
      of 18 days’ journey.” (III. 19.)
