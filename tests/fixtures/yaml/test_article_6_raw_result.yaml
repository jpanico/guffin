- - string: Note 1.—Baldwin II. (de Courtenay), the last Latin Emperor of Constantinople,
      reigned from 1237 to 1261, when he was expelled by Michael Palaeologus. The
      date in the text is, as we see, that of the Brothers’ voyage across the Black
      Sea. It stands 1250 in all the chief texts. But the figure is certainly wrong.
      We shall see that, when the Brothers return to Venice in 1269, they find Mark,
      who, according to Ramusio’s version, was born after their departure, a lad of
      fifteen. Hence, if we rely on Ramusio, they must have left Venice about 1253–54.
      And we shall see also that they reached the Volga in 1261. Hence their start
      from Constantinople may well have occurred in 1260, and this I have adopted
      as the most probable correction. Where they spent the interval between 1254
      (if they really left Venice so early) and 1260, nowhere appears. But as their
      brother, Mark the Elder, in his Will styles himself “whilom of Constantinople,”
      their headquarters were probably there.
