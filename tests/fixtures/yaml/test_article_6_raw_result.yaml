- - string: The story alluded to by Polo is found in the mediæval romances of Alexander,
      and in the Pseudo-Callisthenes on which they are founded. The hero chases a
      number of impure cannibal nations within a mountain barrier, and prays that
      they may be shut up therein. The mountains draw together within a few cubits,
      and Alexander then builds up the gorge and closes it with gates of brass or
      iron. There were in all twenty-two nations with their kings, and the names of
      the nations were Gōth, Magōth, Anugi, Egēs, Exenach, etc. Godfrey of Viterbo
      speaks of them in his rhyming verses:— “Finibus Indorum species fuit una virorum;
      Goth erat atque Magoth dictum cognomen eorum * * * * * Narrat Esias, Isidorus
      et Apocalypsis, Tangit et in titulis Magna Sibylla suis. Patribus ipsorum tumulus
      fuit venter eorum,” etc.
