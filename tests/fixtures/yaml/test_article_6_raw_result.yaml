- - string: Note 3.—Alau is Polo’s representation of the name of Hulákú, brother of
      the Great Kaans Mangu and Kublai and founder of the Mongol dynasty in Persia.
      In the Mongol pronunciation guttural and palatal consonants are apt to be elided,
      hence this spelling. The same name is written by Pope Alexander IV., in addressing
      the Khan, Olao, by Pachymeres and Gregoras Χαλαὺ and Χαλαοῦ, by Hayton Haolon,
      by Ibn Batuta Huláún, as well as in a letter of Hulaku’s own, as given by Makrizi.
      The war in question is related in Rashíduddín’s history, and by Polo himself
      towards the end of the work. It began in the summer of 1262, and ended about
      eight months later. Hence the Polos must have reached Barka’s Court in 1261.
      Marco always applies to the Mongol Khans of Persia the title of “Lords of the
      East” (Levant), and to the Khans of Kipchak that of “Lords of the West” (Ponent).
      We use the term Levant still with a similar specific application, and in another
      form Anatolia. I think it best to preserve the terms Levant and Ponent when
      used in this way. [Robert Parke in his translation out of Spanish of Mendoza,
