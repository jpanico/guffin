- - string: Note 7.—The name assigned by Marco to the Caspian, “Mer de Gheluchelan”
      or “Ghelachelan,” has puzzled commentators. I have no doubt that the interpretation
      adopted above is the correct one. I suppose that Marco said that the sea was
      called “La Mer de Ghel ou (de) Ghelan,” a name taken from the districts of the
      ancient Gelae on its south-western shores, called indifferently Gíl or Gílán,
      just as many other regions of Asia have like duplicate titles (singular and
      plural), arising, I suppose, from the change of a gentile into a local name.
      Such are Lár, Lárán, Khutl, Khutlán, etc., a class to which Badakhshán, Wakhán,
      Shaghnán, Mungán, Chaghánián, possibly Bámián, and many others have formerly
      belonged, as the adjectives in some cases surviving, Badakhshi, Shaghni, Wákhi,
      etc., show.[2] The change exemplified in the induration of these gentile plurals
      into local singulars is everywhere traced in the passage from earlier to later
      geography. The old Indian geographical lists, such as are preserved in the Puránas,
      and in Pliny’s extracts from Megasthenes, are, in the main, lists of peoples,
      not of provinces, and even where the real name seems to be local a gentile form
      is often given. So also Tochari and Sogdi are replaced by Tokháristán and Sughd;
      the Veneti and Taurini by Venice and Turin; the Remi and the Parisii, by Rheims
      and Paris; East-Saxons and South-Saxons by Essex and Sussex; not to mention
      the countless -ings that mark the tribal settlement of the Saxons in Britain.
      Abulfeda, speaking of this territory, uses exactly Polo’s phrase, saying that
      the districts in question are properly called Kíl-o-Kílán, but by the Arabs
      Jíl-o-Jílán. Teixeira gives the Persian name of the sea as Darya Ghiláni. (See
      Abulf. in Büsching, v. 329.) [The province of Gíl (Gílán), which is situated
      between the mountains and the Caspian Sea, and between the provinces of Azerbaíján
      and Mázanderán (H. C.)], gave name to the silk for which it was and is still
      famous, mentioned as Ghelle (Gílí) at the end of this chapter. This Seta Ghella
      is mentioned also by Pegolotti (pp. 212, 238, 301), and by Uzzano, with an odd
      transposition, as Seta Leggi, along with Seta Masandroni, i.e. from the adjoining
      province of Mázanderán (p. 192). May not the Spanish Geliz, “a silk-dealer,”
      which seems to have been a puzzle to etymologists, be connected with this? (See
      Dozy and Engelmann, 2nd ed. p. 275.) [Prof. F. de Filippi (Viaggo in Persia
      nel 1862, ... Milan, 1865, 8vo) speaks of the silk industry of Ghílán (pp. 295–296)
      as the principal product of the entire province.—H. C.]
