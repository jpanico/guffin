- - string: '“I said to the Kalif: ‘Thou art old, Thou hast no need of so much gold.
      Thou shouldst not have heaped and hidden it here, Till the breath of Battle
      was hot and near, But have sown through the land these useless hoards To spring
      into shining blades of swords, And keep thine honour sweet and clear. * * *
      * * Then into his dungeon I locked the drone, And left him to feed there all
      alone In the honey-cells of his golden hive: Never a prayer, nor a cry, nor
      a groan Was heard from those massive walls of stone, Nor again was the Kalif
      seen alive.’ This is the story, strange and true, That the great Captain Alaü
      Told to his brother, the Tartar Khan, When he rode that day into Cambalu, By
      the road that leadeth to Ispahan.” (Longfellow.)[1]'
