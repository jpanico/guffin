- - string: '{7} to death as he was. Howbeit, since that time, there has been never
      another Calif, either at Baudas or anywhere else.{8} Now I will tell you of
      a great miracle that befell at Baudas, wrought by God on behalf of the Christians.
      Note 1.—This form of the Mediæval Frank name of Baghdad, Baudas [the Chinese
      traveller, Ch’ang Te, Si Shi Ki, XIII. cent., says, “the kingdom of Bao-da,”
      H. C.], is curiously like that used by the Chinese historians, Paota (Pauthier;
      Gaubil), and both are probably due to the Mongol habit of slurring gutturals.
      (See Prologue, ch. ii. note 3.) [Baghdad was taken on the 5th of February, 1258,
      and the Khalif surrendered to Hulaku on the 10th of February.—H. C.] Note 2.—Polo
      is here either speaking without personal knowledge, or is so brief as to convey
      an erroneous impression that the Tigris flows to Kisi, whereas three-fourths
      of the length of the Persian Gulf intervene between the river mouth and Kisi.
      The latter is the island and city of Kish or Kais, about 200 miles from the
      mouth of the Gulf, and for a long time one of the chief ports of trade with
      India and the East. The island, the Cataea of Arrian, now called Ghes or Kenn,
      is singular among the islands of the Gulf as being wooded and well supplied
      with fresh water. The ruins of a city [called Harira, according to Lord Curzon,]
      exist on the north side. According to Wassáf, the island derived its name from
      one Kais, the son of a poor widow of Síráf (then a great port of Indian trade
      on the northern shore of the Gulf), who on a voyage to India, about the 10th
      century, made a fortune precisely as Dick Whittington did. The proceeds of the
      cat were invested in an establishment on this island. Modern attempts to nationalise
      Whittington may surely be given up! It is one of the tales which, like Tell’s
      shot, the dog Gellert, and many others, are common to many regions. (Hammer’s
      Ilch. I. 239; Ouseley’s Travels, I. 170; Notes and Queries, 2nd s. XI. 372.)'
