- - string: Note 5.—Jerome Cardan notices that “the best and biggest goshawks come
      from Armenia,” a term often including Georgia and Caucasus. The name of the
      bird is perhaps the same as ’Afçi, “Falco montanus.” (See Casiri, I. 320.) Major
      St. John tells me that the Terlán, or goshawk, much used in Persia, is still
      generally brought from Caucasus. (Cardan, de Rer. Varietate, VII. 35.) Note
      6.—A letter of Warren Hastings, written shortly before his death, and after
      reading Marsden’s Marco Polo, tells how a fish-breeder of Banbury warned him
      against putting pike into his fish-pond, saying, “If you should leave them where
      they are till Shrove Tuesday they will be sure to spawn, and then you will never
      get any other fish to breed in it.” (Romance of Travel, I. 255.) Edward Webbe
      in his Travels (1590, reprinted 1868) tells us that in the “Land of Siria there
      is a River having great store of fish like unto Salmon-trouts, but no Jew can
      catch them, though either Christian and Turk shall catch them in abundance with
      great ease.” The circumstance of fish being got only for a limited time in spring
      is noticed with reference to Lake Van both by Tavernier and Mr. Brant. But the
      exact legend here reported is related (as M. Pauthier has already noticed) by
      Wilibrand of Oldenburg of a stream under the Castle of Adamodana, belonging
      to the Hospitallers, near Naversa (the ancient Anazarbus), in Cilicia under
      Taurus. And Khanikoff was told the same story of a lake in the district of Akhaltziké
      in Western Georgia, in regard to which he explains the substance of the phenomenon
      as a result of the rise of the lake’s level by the melting of the snows, which
      often coincides with Lent. I may add that Moorcroft was told respecting a sacred
      pond near Sir-i-Chashma, on the road from Kabul to Bamian, that the fish in
      the pond were not allowed to be touched, but that they were accustomed to desert
      it for the rivulet that ran through the valley regularly every year on the day
      of the vernal equinox, and it was then lawful to catch them.
