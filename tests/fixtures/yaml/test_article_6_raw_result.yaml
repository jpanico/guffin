      of writing, and their practice of war; in fact he came in brief space to know
      several languages, and four sundry written characters. And he was discreet and
      prudent in every way, insomuch that the Emperor held him in great esteem.{1}
      And so when he discerned Mark to have so much sense, and to conduct himself
      so well and beseemingly, he sent him on an ambassage of his, to a country which
      was a good six months’ journey distant.{2} The young gallant executed his commission
      well and with discretion. Now he had taken note on several occasions that when
      the Prince’s ambassadors returned from different parts of the world, they were
      able to tell him about nothing except the business on which they had gone, and
      that the Prince in consequence held them for no better than fools and dolts,
      and would say: “I had far liever hearken about the strange things, and the manners
      of the different countries you have seen, than merely be told of the business
