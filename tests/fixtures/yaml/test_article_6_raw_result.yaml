- - string: On the frontier of Armenia towards the south-east is the kingdom of Mausul.
      It is a very great kingdom, and inhabited{1} by several different kinds of people
      whom we shall now describe. First there is a kind of people called Arabi, and
      these worship Mahommet. Then there is another description of people who are
      Nestorian and Jacobite Christians. These have a Patriarch, whom they call the
      Jatolic, and this Patriarch creates Archbishops, and Abbots, and Prelates of
      all other degrees, and sends them into every quarter, as to India, to Baudas,
      or to Cathay, just as the Pope of Rome does in the Latin countries. For you
      must know that though there is a very great number of Christians in those countries,
      they are all Jacobites and Nestorians; Christians indeed, but not in the fashion
      enjoined by the Pope of Rome, for they come short in several points of the Faith.{2}
      All the cloths of gold and silk that are called Mosolins are made in this country;
      and those great Merchants called Mosolins, who carry for sale such quantities
      of spicery and pearls and cloths of silk and gold, are also from this kingdom.{3}
      There is yet another race of people who inhabit the mountains in that quarter,
      and are called Curds. Some of them are Christians, and some of them are Saracens;
      but they are an evil generation, whose delight it is to plunder merchants.{4}
      [Near this province is another called Mus and Merdin, producing an immense quantity
      of cotton, from which they make a great deal of buckram{5} and other cloth.
      The people are craftsmen and traders, and all are subject to the Tartar King.]
      Note 1.—Polo could scarcely have been justified in calling Mosul a very great
      kingdom. This is a bad habit of his, as we shall have to notice again. Badruddín
      Lúlú, the last Atabeg of Mosul of the race of Zenghi had at the age of 96 taken
      sides with Hulaku, and stood high in his favour. His son Malik Sálih, having
      revolted, surrendered to the Mongols in 1261 on promise of life; which promise
      they kept in Mongol fashion by torturing him to death. Since then the kingdom
      had ceased to exist as such. Coins of Badruddín remain with the name and titles
      of Mangku Kaan on their reverse, and some of his and of other atabegs exhibit
      curious imitations of Greek art. (Quat. Rash. p. 389; Jour. As. IV. VI. 141.).
