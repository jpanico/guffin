- - string: Mr. Badger, in a postscript to his translation of the History of Omán
      (Hak. Soc. 1871), maintains that Kish or Kais was at this time a city on the
      mainland, and identical from Síráf. He refers to Ibn Batuta (II. 244), who certainly
      does speak of visiting “the city of Kais, called also Síráf.” And Polo, neither
      here nor in Bk. III. ch. xl., speaks of Kisi as an island. I am inclined, however,
      to think that this was from not having visited it. Ibn Batuta says nothing of
      Síráf as a seat of trade; but the historian Wassáf, who had been in the service
      of Jamáluddín al-Thaibi, the Lord of Kais, in speaking of the export of horses
      thence to India, calls it “the Island of Kais.” (Elliot, III. 34.) Compare allusions
      to this horse trade in ch. xv. and in Bk. III. ch. xvii. Wassáf was precisely
      a contemporary of Polo.
