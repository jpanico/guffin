      at Constantinople,{1} that Messer Nicolas Polo, the father of my lord Mark,
      and Messer Maffeo Polo, the brother of Messer Nicolas, were at the said city
      of Constantinople, whither they had gone from Venice with their merchants’ wares.
      Now these two Brethren, men singularly noble, wise, and provident, took counsel
      together to cross the Greater Sea on a venture of trade; so they laid in a store
      of jewels and set forth from Constantinople, crossing the Sea to Soldaia.{2}
