- - string: These legends are referred to by Rabbi Benjamin, Hayton, Rubruquis, Ricold,
      Matthew Paris, and many more. Josephus indeed speaks of the Pass which Alexander
      fortified with gates of steel. But his saying that the King of Hyrcania was
      Lord of this Pass points to the Hyrcanian Gates of Northern Persia, or perhaps
      to the Wall of Gomushtapah, described by Vámbéry. Ricold of Montecroce allows
      two arguments to connect the Tartars with the Jews who were shut up by Alexander;
      one that the Tartars hated the very name of Alexander, and could not bear to
      hear it; the other, that their manner of writing was very like the Chaldean,
      meaning apparently the Syriac (anté, p. 29). But he points out that they had
      no resemblance to Jews, and no knowledge of the law. Edrisi relates how the
      Khalif Wathek sent one Salem the Dragoman to explore the Rampart of Gog and
      Magog. His route lay by Tiflis, the Alan country, and that of the Bashkirds,
      to the far north or north-east, and back by Samarkand. But the report of what
      he saw is pure fable. In 1857, Dr. Bellew seems to have found the ancient belief
      in the legend still held by Afghan gentlemen at Kandahar. At Gelath in Imeretia
      there still exists one valve of a large iron gate, traditionally said to be
      the relic of a pair brought as a trophy from Derbend by David, King of Georgia,
      called the Restorer (1089–1130). M. Brosset, however, has shown it to be the
      gate of Ganja, carried off in 1139. (Bayer in Comment. Petropol. I. 401 seqq.;
      Pseudo-Callisth. by Müller, p. 138; Gott. Viterb. in Pistorii Nidani Script.
      Germ. II. 228; Alexandriade, pp. 310–311; Pereg. IV. p. 118; Acad. des Insc.
      Divers Savans, II. 483; Edrisi, II. 416–420, etc.)
