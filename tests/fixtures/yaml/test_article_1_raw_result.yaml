- - string: '[[>]] [[!INFO]] THIS PAGE IS USED FOR TESTING [GUFFIN](https://github.com/jpanico/guffin)
      – DO NOT REMOVE

      Features:

      - Page is completely self-contained – there are `no Roam embeds` of any kind

      - 3 top-level `headers`, all H1

      - nested `headers` down to H4, via __Augmented Headings__ extension

      - a node, (Ma5KGUH9O) "AI assistant (Claude Opus 4.6):" that has property: BLOCK_HEADING
      = 0, which is not a valid Markdown level. It seems that this can happen when
      first a valid level value (1-6) is assigned, and then the heading level is removed
      altogether through the Roam UI.

      - a pair of JPEG `image`s that **have not** been resized through the Roam UI
      (illustration 1.1)

      - a single JPEG `image` that **has** been resized through the Roam UI (illustration
      2.1)

      - a JPEG `image` whose child block renders as its caption, below the image (illustration
      2.1)

      - three Python `code block`s (Section 1.2): one with a caption – its child block
      – and no `code-source::` tag (listing 1.2.1), one with a `code-source::` tag
      – a SHA-pinned GitHub blob URL, through its `guffin-meta::` child – and no caption
      (listing 1.2.2), and one with both, the caption set above the source attribution
      (listing 1.2.3)

      - a `float:: figure` wrapper block (Section 1.3) whose text is the figure''s
      caption and whose one content child is a JPEG `image` block itself, not a reference
      to one; it renders as the numbered Figure 1, and the text block before it refers
      to it with a kind-word alias – an inline `block reference` aliased `figure`
      – which the export completes with the number and links to the figure

      - a `float:: listing` wrapper block (Section 1.4) whose text is the listing''s
      caption and whose one content child is a Python `code block` itself, not a reference
      to one; it renders as the numbered Listing 1, and the text block before it refers
      to it with the kind-word alias `listing`, completed with the number and linked

      - a `float:: table` wrapper block (Section 1.5) whose text is the table''s caption
      and whose one content child is a native `{{table}}` (2x3) itself, not a reference
      to one; it renders as the numbered Table 1, its caption carried by the table
      itself, and the text block before it refers to it with the kind-word alias `table`,
      completed with the number and linked

      - a native `{{table}}` (Section 2.2) whose four cells are each a standalone
      `block reference` to a JPEG `image` block, so each cell displays its referenced
      image

      - an embedded PDF document that has no special PublishingSemantics Attributes
      attached

      - an embedded PDF document that has `guffin-meta:: pdf-render: "inline"`

      - this INFO `Callout box`, which contains Roam `page references` '
